<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <link rel="stylesheet" href="Styles/style.css">
    <style>
        /* Base Setup Mirroring Anime Heaven */
        body {
            background-color: #070707;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #151515;
            border-bottom: 2px solid #ff001e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
        }
        .nav-logo {
            background-color: #ff001e;
            color: white;
            font-weight: 900;
            padding: 4px 10px;
            font-size: 22px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }
        .search-container {
            flex-grow: 1;
            margin: 0 12px;
        }
        .search-container input {
            width: 100%;
            background-color: #0f0f0f;
            border: 1px solid #ff001e;
            color: white;
            padding: 8px 12px;
            font-size: 15px;
            border-radius: 2px;
            box-sizing: border-box;
        }
        .menu-icon {
            color: #ff001e;
            font-size: 28px;
            font-weight: bold;
            line-height: 1;
        }

        /* Video Streaming Player Panel */
        .player-wrapper {
            background-color: #151515;
            border-bottom: 3px solid #ff001e;
            width: 100%;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .player-info {
            padding: 12px 15px;
        }
        .player-info h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: #fff;
            font-weight: 600;
        }
        .player-info p {
            margin: 0;
            font-size: 14px;
            color: #a5a5a5;
        }

        /* Top Banner Ad Container */
        .top-banner-space {
            width: 100%;
            margin: 0 auto;
            text-align: center;
            background-color: #000;
            display: flex;
            justify-content: center;
        }
        .top-banner-space img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Category Section Headers */
        .section-title {
            background-color: #121212;
            color: #d1d1d1;
            text-align: left;
            padding: 14px 15px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-left: 4px solid #ff001e;
            border-bottom: 1px solid #1c1c1c;
            margin: 0;
            text-transform: uppercase;
        }

        /* Side-by-Side Mobile Layout Grid */
        .anime-feed {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding: 6px;
            box-sizing: border-box;
            width: 100%;
        }

        .anime-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            cursor: pointer;
        }

        .anime-card {
            background-color: #0f0f0f;
            border-bottom: 3px solid #ff001e;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .poster-container {
            position: relative;
            width: 100%;
            padding-top: 135%;
            background-color: #151515;
            overflow: hidden;
        }
        .poster-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episode-badge {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #ff001e;
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 10px;
            z-index: 2;
        }
        .movie-badge {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #9000ff;
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 10px;
            z-index: 2;
        }

        .action-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: rgba(255, 0, 30, 0.85);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 2;
        }

        .anime-details {
            padding: 8px 10px;
            text-align: left;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .anime-title-main {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 3px 0;
            color: #e3e3e3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .anime-status {
            color: #ff001e;
            font-size: 11px;
            font-weight: 600;
            margin: 0;
        }

        #no-results-msg {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 16px;
            display: none;
        }

        .mobile-footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #121212;
            border-top: 1px solid #1c1c1c;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 10;
        }
        .footer-nav-item {
            color: #7a7a7a;
            text-decoration: none;
            font-size: 22px;
        }
        .footer-nav-item.active {
            color: #ffffff;
        }
    </style>
</head>
