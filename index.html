<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only - Stream & Watchlist</title>
    <style>
        :root {
            --bg: #0b0b0f;
            --panel: #17171f;
            --red: #ef233c;
            --text: #f7f7fb;
            --muted: #aaaab8;
            --yellow: #ffb703;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }
        header {
            background: #111116;
            border-bottom: 1px solid #292933;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            color: var(--red);
            font-size: 23px;
            font-weight: bold;
            cursor: pointer;
        }
        .logo span {
            color: white;
        }
        .search {
            width: min(100%, 320px);
            padding: 11px 13px;
            border-radius: 8px;
            border: 1px solid #373742;
            background: #20202a;
            color: white;
            outline: none;
        }
        .search:focus {
            border-color: var(--red);
        }
        
        /* New Genre Filter Styling */
        .filter-bar {
            display: flex;
            gap: 10px;
            padding: 15px 20px 5px;
            max-width: 1200px;
            margin: auto;
            overflow-x: auto;
            white-space: nowrap;
        }
        .filter-btn {
            background: #1c1c24;
            color: var(--muted);
            border: 1px solid #2d2d3d;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        .section-title {
            margin: 24px 0 16px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 17px;
            margin-bottom: 35px;
        }
        .anime-card {
            background: var(--panel);
            border: 1px solid #282832;
            border-radius: 11px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s, border-color .2s;
            position: relative;
        }
        .anime-card:hover {
            transform: translateY(-4px);
            border-color: var(--red);
        }
        .poster {
            height: 205px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            overflow: hidden;
        }
        .poster span {
            text-shadow: 0 2px 10px #000;
        }
        .card-info {
            padding: 12px;
        }
        .card-info h3 {
            font-size: 15px;
            margin: 0 0 7px;
        }
        .card-info p {
            color: var(--muted);
            font-size: 12px;
            margin: 0;
        }
        
        /* Watchlist Buttons */
        .watchlist-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--yellow);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 2;
        }
        .action-tray {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .watchlist-btn {
            background: #30303b;
            color: white;
            border: 0;
            border-radius: 7px;
            padding: 11px 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .watchlist-btn.in-list {
            background: #40131e;
            color: #ff9ca8;
            border: 1px solid var(--red);
        }

        button, .download-btn {
            background: var(--red);
            color: white;
            border: 0;
            border-radius: 7px;
            padding: 11px 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        button:hover, .download-btn:hover {
            filter: brightness(1.12);
        }
        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .secondary {
            background: #30303b;
        }
        .hidden {
            display: none !important;
        }
        #watchView {
            background: var(--panel);
            border: 1px solid #2b2b36;
            border-radius: 12px;
            padding: 17px;
        }
        .back-button {
            margin-bottom: 18px;
        }
        #watchTitle {
            margin: 5px 0 10px;
        }
        .player {
            width: 100%;
            background: black;
            border-radius: 9px;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
            max-height: 70vh;
            background: black;
        }
        #playerMessage {
            color: #ddd;
            background: #101015;
            padding: 16px;
            line-height: 1.6;
            font-size: 14px;
            text-align: center;
        }
        .player-toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            background: #111116;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #292933;
        }
        .toolbar-left {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .w2g-link {
            color: #ef233c;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .w2g-link:hover {
            text-decoration: underline;
        }
        .nav-arrow {
            background: #252530;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .camera-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }
        .download-container {
            margin: 15px 0 25px;
        }
        .download-btn {
            width: 100%;
            padding: 14px;
        }
        .episode-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .episode-button {
            background: #30303b;
            min-width: 46px;
        }
        .episode-button.active {
            background: var(--red);
        }
        .empty {
            color: var(--muted);
            padding: 25px 0;
            text-align: center;
            grid-column: 1 / -1;
        }
        footer {
            text-align: center;
            color: var(--muted);
            padding: 35px 16px;
            border-top: 1px solid #292933;
            margin-top: 45px;
            font-size: 13px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .social-links a {
            color: var(--muted);
            text-decoration: none;
            font-weight: bold;
        }
        .social-links a:hover {
            color: white;
        }
        .social-links a.heart {
            color: var(--red);
        }
        @media (max-width: 450px) {
            header {
                padding: 12px;
            }
            main {
                padding: 13px;
            }
            .catalog {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 11px;
            }
            .poster {
                height: 180px;
                font-size: 19px;
            }
            #watchView {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="homeButton">ANIME <span>ONLY</span></div>
        <input class="search" id="searchInput" type="search" placeholder="Search anime..." aria-label="Search anime">
    </header>

    <!-- Genre Navigation Strip -->
    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-genre="all">All Items</button>
        <button class="filter-btn" data-genre="Action">Action</button>
        <button class="filter-btn" data-genre="Adventure">Adventure</button>
        <button class="filter-btn" data-genre="watchlist">❤ My Watchlist</button>
    </div>

    <main>
        <!-- Catalog Page View -->
        <section id="homeView">
            <h2 class="section-title" id="catalogTitle"># Trending Anime</h2>
