
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Only - Stream</title>
<style>
:root {
  --bg-primary: #0b0c10;
  --bg-secondary: #121212;
  --card-bg: #1f2833;
  --accent-color: #e50914;
  --text-main: #ffffff;
  --text-secondary: #8a9aa7;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: var(--bg-primary);
  color: var(--text-main);
  padding-bottom: 4rem;
  min-height: 100vh;
}
header {
  background: var(--bg-secondary);
  padding: 1.5rem 1rem;
  text-align: center;
  border-bottom: 2px solid var(--accent-color);
}
.logo {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 1.2rem;
  cursor: pointer;
}
.logo span:first-child { color: var(--accent-color); }
.logo span:last-child { color: var(--text-main); }
.search-container {
  width: 100%;
  max-width: 650px;
  margin: auto;
}
.search-bar {
  width: 100%;
  background: #202020;
  border: 1px solid #2a2a2a;
  color: white;
  padding: 12px 16px;
  border-radius: 25px;
  font-size: 1rem;
}
main {
  padding: 1.5rem 1rem;
  max-width: 1200px;
  margin: auto;
}
.section-title {
  font-size: 1.5rem;
  text-transform: uppercase;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
}
.section-title::before {
  content: '';
  width: 5px;
  height: 1.4rem;
  background: var(--accent-color);
  margin-right: 10px;
}
.anime-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 16px;
}
.anime-card {
  background: var(--card-bg);
  border-radius: 7px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 4px 10px #0005;
}
.anime-card:hover { transform: translateY(-3px); }
.poster {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 2.9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  text-align: center;
  background: linear-gradient(145deg, var(--poster-a), var(--poster-b));
}
.poster img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.poster-title {
  font-size: 1.2rem;
  font-weight: 800;
  text-shadow: 0 2px 8px #000;
}
.badge {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 2;
  background: #0b0c10e8;
  border-left: 4px solid var(--accent-color);
  padding: 5px 8px;
  font-size: .7rem;
  font-weight: 800;
}
.episode-badge {
  position: absolute;
  bottom: 8px;
  right: 8px;
  z-index: 2;
  background: var(--accent-color);
  padding: 4px 7px;
  border-radius: 4px;
  font-size: .75rem;
}
.anime-details {
  background: #1b2028;
  padding: 10px;
}
.anime-title {
  font-size: .95rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.anime-meta {
  margin-top: 5px;
  color: var(--text-secondary);
  font-size: .85rem;
}
#watch-view {
  display: none;
  max-width: 900px;
  margin: auto;
  text-align: center;
}
.stream-title { font-size: 1.5rem; margin-bottom: 8px; }
.stream-episode-indicator {
  color: var(--text-secondary);
  margin-bottom: 1rem;
}
.player-container {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  margin-bottom: 1rem;
}
.player-container video { width: 100%; height: 100%; }
.action-control-bar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 1rem 0;
}
.action-btn, .back-btn, .episode-btn, .download-btn {
  background: var(--accent-color);
  color: white;
  border: none;
  padding: 12px 16px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}
.back-btn { background: #30343b; margin-bottom: 1rem; }
.download-btn { display: block; margin: 1rem 0; }
.download-btn.disabled {
  background: #3b3b3b;
  color: #aaa;
  pointer-events: none;
}
.episode-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 1rem 0;
}
.episode-btn { background: #252a33; }
.episode-btn.active { background: var(--accent-color); }
.status {
  color: var(--text-secondary);
  text-align: center;
  padding: 2rem 1rem;
}
.social-strip {
  background: var(--bg-secondary);
  padding: 15px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}
@media (max-width: 420px) {
  main { padding: 1.2rem .8rem; }
  .anime-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
}
</style>
</head>
<body>
<header>
  <div class="logo" id="nav-logo">
    <span>Anime</span><span>Only</span>
  </div>
  <div class="search-container" id="nav-search-box">
    <input type="search" id="anime-search"
      class="search-bar" placeholder="Search anime titles..."
      aria-label="Search anime titles">
  </div>
</header>

<main>
  <section id="catalog-view">
    <h1 class="section-title" id="display-title">Trending Anime</h1>
    <div id="anime-grid" class="anime-grid"></div>
    <div id="catalog-status" class="status" hidden></div>
  </section>

  <section id="watch-view">
    <button class="back-btn" id="btn-back-catalog">← Back to Catalog</button>
    <h2 id="stream-anime-title" class="stream-title">Anime Title</h2>
    <div id="stream-episode-num" class="stream-episode-indicator">Episode 1</div>
    <div class="player-container">
      <video id="main-video-player" controls playsinline></video>
    </div>
    <p id="player-message" class="status">Select an episode to begin.</p>
    <div class="action-control-bar">
      <button class="action-btn" id="btn-prev-control">← Previous</button>
      <button class="action-btn" id="btn-next-control">Next →</button>
    </div>
    <a href="#" id="download-link" class="download-btn disabled" aria-disabled="true">Download Episode</a>
    <h3 class="section-title">Episodes</h3>
    <div id="episode-list" class="episode-list"></div>
    <div class="social-strip">
      <span>💬 Community</span>
      <span>⭐ Anime Only</span>
      <span>❤️ Support</span>
    </div>
  </section>
</main>

<script>
"use strict";

const animeDatabase = [
  {id:1,title:"Chainsaw Man",episodes:12,type:"SUB",year:2022,colors:["#9d1725","#171923"],poster:"",episodeSources:{}},
  {id:2,title:"Demon Slayer",episodes:26,type:"SUB / DUB",year:2019,colors:["#1c5960","#151526"],poster:"",episodeSources:{}},
  {id:3,title:"Jujutsu Kaisen",episodes:24,type:"SUB / DUB",year:2020,colors:["#4b286e","#15131c"],poster:"",episodeSources:{}},
  {id:4,title:"One Piece",episodes:1000,type:"SUB",year:1999,colors:["#126c87","#15213a"],poster:"",episodeSources:{}},
  {id:5,title:"Attack on Titan",episodes:25,type:"SUB / DUB",year:2013,colors:["#77502b","#1c2027"],poster:"",episodeSources:{}},
  {id:6,title:"My Hero Academia",episodes:13,type:"SUB / DUB",year:2016,colors:["#26856b","#10222a"],poster:"",episodeSources:{}},
  {id:7,title:"Naruto",episodes:220,type:"SUB / DUB",year:2002,colors:["#d66b18","#54252b"],poster:"",episodeSources:{}},
  {id:8,title:"Spy x Family",episodes:12,type:"SUB / DUB",year:2022,colors:["#b4a36b","#284b58"],poster:"",episodeSources:{}},
  {id:9,title:"Frieren: Beyond Journey's End",episodes:28,type:"SUB / DUB",year:2023,colors:["#438c8b","#242344"],poster:"",episodeSources:{}},
  {id:10,title:"Solo Leveling",episodes:12,type:"SUB / DUB",year:2024,colors:["#3553a2","#141523"],poster:"",episodeSources:{}},
  {id:11,title:"Haikyu!!",episodes:25,type:"SUB / DUB",year:2014,colors:["#df762e","#25374b"],poster:"",episodeSources:{}},
  {id:12,title:"Dragon Ball Z",episodes:291,type:"SUB / DUB",year:1989,colors:["#e69a26","#71353a"],poster:"",episodeSources:{}}
];

const catalogView = document.getElementById("catalog-view");
const watchView = document.getElementById("watch-view");
const grid = document.getElementById("anime-grid");
const searchInput = document.getElementById("anime-search");
const searchBox = document.getElementById("nav-search-box");
const displayTitle = document.getElementById("display-title");
const status = document.getElementById("catalog-status");
const logo = document.getElementById("nav-logo");
const video = document.getElementById("main-video-player");
const playerMessage = document.getElementById("player-message");
const downloadLink = document.getElementById("download-link");
const episodeList = document.getElementById("episode-list");

let activeAnime = null;
let activeEpisode = 1;

function renderCatalog(items, query = "") {
  grid.replaceChildren();
  displayTitle.textContent = query ? "Search Results" : "Trending Anime";
  status.hidden = items.length > 0;
  status.textContent = query
    ? `No anime found for "${query}". Try another title.`
    : "No anime available.";

  items.forEach(anime => {
    const card = document.createElement("article");
    card.className = "anime-card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");

    const poster = document.createElement("div");
    poster.className = "poster";
    poster.style.setProperty("--poster-a", anime.colors[0]);
    poster.style.setProperty("--poster-b", anime.colors[1]);

    if (anime.poster) {
      const image = document.createElement("img");
      image.src = anime.poster;
      image.alt = anime.title + " poster";
      image.loading = "lazy";
      image.onerror = () => image.remove();
      poster.appendChild(image);
    }

    const posterTitle = document.createElement("div");
    posterTitle.className = "poster-title";
    posterTitle.textContent = anime.title;
    poster.appendChild(posterTitle);

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = anime.type;
    poster.appendChild(badge);

    const episodeBadge = document.createElement("span");
    episodeBadge.className = "episode-badge";
    episodeBadge.textContent = anime.episodes + " eps";
    poster.appendChild(episodeBadge);

    const details = document.createElement("div");
    details.className = "anime-details";

    const title = document.createElement("div");
    title.className = "anime-title";
    title.textContent = anime.title;

    const meta = document.createElement("div");
    meta.className = "anime-meta";
    meta.textContent = anime.year;

    details.append(title, meta);
    card.append(poster, details);

    const openCard = () => openAnime(anime, 1);
    card.addEventListener("click", openCard);
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openCard();
      }
    });
    grid.appendChild(card);
  });
}

function runSearch() {
  const query = searchInput.value.trim().toLowerCase();
  const results = animeDatabase.filter(anime =>
    anime.title.toLowerCase().includes(query)
  );
  renderCatalog(results, searchInput.value.trim());
}

renderCatalog(animeDatabase);

// Part 3 will add the player and episode controls.
</script>
</body>
</html>
