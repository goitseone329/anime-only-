<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free Anime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0b0b; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 60px; }
        
        /* HEADER BAR */
        header { background-color: #141414; border-bottom: 2px solid #b60000; display: flex; align-items: center; padding: 8px 12px; height: 56px; position: sticky; top: 0; z-index: 1000; }
        .logo-box { background-color: #d61c1c; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 900; font-size: 22px; color: #fff; text-decoration: none; margin-right: 12px; font-style: italic; }
        .search-wrapper { flex: 1; position: relative; max-width: 600px; display: flex; align-items: center; }
        .search-input { width: 100%; height: 36px; background-color: #1a1a1a; border: 1px solid #d61c1c; border-radius: 4px; color: #fff; padding: 0 40px 0 12px; font-size: 15px; }
        .search-icon-btn { position: absolute; right: 10px; background: none; border: none; color: #d61c1c; cursor: pointer; display: flex; align-items: center; }

        /* COLLECTION NAVIGATION TABS */
        .collection-tabs { display: flex; background-color: #141414; border-bottom: 1px solid #222; margin-top: 2px; }
        .tab-btn { flex: 1; padding: 14px 5px; background: none; border: none; color: #aaa; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #fff; border-bottom-color: #d61c1c; background-color: #1a1a1a; }

        /* PLAYER OVERLAY SECTION */
        #player-section { display: none; max-width: 800px; margin: 15px auto; background: #141414; padding: 8px; border-bottom: 3px solid #d61c1c; }
        #player-section iframe { width: 100%; height: 400px; border: none; background: #000; }
        #now-playing-title { padding: 10px 5px; font-size: 16px; font-weight: bold; color: #fff; border-bottom: 1px solid #222; }

        /* LIST LAYOUT TILES */
        .section-heading { background-color: #141414; padding: 12px; font-size: 18px; font-weight: 500; border-bottom: 1px solid #222; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .catalog-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; }
        .anime-row-card { background-color: #111; padding: 12px; border-bottom: 1px solid #1c1c1c; display: flex; flex-direction: column; cursor: pointer; }
        .anime-row-card:hover { background-color: #141414; }
        
        .image-banner-wrapper { position: relative; width: 100%; height: 210px; overflow: hidden; border-radius: 4px; background: #222; }
        .image-banner-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .rank-badge { position: absolute; top: 0; left: 0; background-color: #d61c1c; color: #fff; font-weight: bold; font-size: 18px; padding: 6px 14px; border-bottom-right-radius: 4px; }
        .action-plus { position: absolute; top: 10px; right: 10px; background-color: rgba(214, 28, 28, 0.85); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        
        .card-details { padding: 12px 2px 4px 2px; }
        .primary-title { font-size: 17px; font-weight: 400; color: #eee; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .secondary-title { font-size: 14px; color: #aaa; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .status-released { color: #d61c1c; font-size: 14px; font-weight: bold; text-align: center; margin-top: 4px; }

        /* FOOTER APP NAVIGATION BAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background-color: #111; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #888; display: flex; align-items: center; justify-content: center; width: 25%; height: 100%; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
