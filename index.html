<script>
    // Mock Application Database Setup
    const ANIME_DATA = [
        {
            id: "1",
            title: "Cyber Rush 2099",
            genres: ["Action"],
            bgGradient: "linear-gradient(135deg, #2e0854, #8b008b)",
            description: "High-octane synthwave chases down neon city alleyways.",

                { num: 2, title: "Data Stream Ghost", url: "https://googleapis.com" },
                { num: 3, title: "Netrunner Eclipse", url: "https://googleapis.com" }

            description: "An epic high-fantasy expedition to uncover the deep-rooted myths of a long lost empire.",
            episodes: [
                { num: 1, title: "The Forbidden Sanctuary", url: "https://googleapis.com" },
                { num: 2, title: "Echoes in the Sky", url: "https://googleapis.com" }
            ],
            w2gRoom: "https://watch2gether.com"
        },
        {
            id: "3",
            title: "Vanguard Overdrive",
            genres: ["Action", "Adventure"],
            bgGradient: "linear-gradient(135deg, #800f2f, #ff4d6d)",
            description: "Mecha squads square off against planetary forces in deep interstellar space.",
            episodes: [
                { num: 1, title: "Launch Blueprint", url: "https://googleapis.com" }
            ],
            w2gRoom: "https://watch2gether.com"
        }
    ];

    // State Variables
    let currentGenreFilter = "all";
    let activeSearchString = "";
    let localWatchlist = JSON.parse(localStorage.getItem('anime_watchlist')) || [];
    let stateCurrentAnime = null;
    let stateCurrentEpisodeIndex = 0;

    // DOM References
    const animeCatalog = document.getElementById('animeCatalog');
    const homeView = document.getElementById('homeView');
    const watchView = document.getElementById('watchView');
    const searchInput = document.getElementById('searchInput');
    const filterBar = document.getElementById('filterBar');
    const catalogTitle = document.getElementById('catalogTitle');
    const homeButton = document.getElementById('homeButton');

    // Player UI Elements
    const backButton = document.getElementById('backButton');
    const watchTitle = document.getElementById('watchTitle');
    const toggleWatchlistBtn = document.getElementById('toggleWatchlistBtn');
    const videoPlayer = document.getElementById('videoPlayer');
    const playerMessage = document.getElementById('playerMessage');
    const prevEpisodeBtn = document.getElementById('prevEpisodeBtn');
    const nextEpisodeBtn = document.getElementById('nextEpisodeBtn');
    const w2gLink = document.getElementById('w2gLink');
    const screenshotBtn = document.getElementById('screenshotBtn');
    const downloadSourceLink = document.getElementById('downloadSourceLink');
    const episodeContainer = document.getElementById('episodeContainer');

    // Initialize Application Core
    function initApp() {
        renderCatalog();
        setupListeners();
    }

    // Component Renderers
    function renderCatalog() {
        animeCatalog.innerHTML = "";
        
        const modelsToRender = ANIME_DATA.filter(item => {
            const matchesSearch = item.title.toLowerCase().includes(activeSearchString.toLowerCase());
            
            if (currentGenreFilter === "all") {
                return matchesSearch;
            } else if (currentGenreFilter === "watchlist") {
                return localWatchlist.includes(item.id) && matchesSearch;
            } else {
                return item.genres.includes(currentGenreFilter) && matchesSearch;
            }
        });

        if (modelsToRender.length === 0) {
            animeCatalog.innerHTML = `<div class="empty">No title content fits your current selection criteria.</div>`;
            return;
        }

        modelsToRender.forEach(anime => {
            const isSaved = localWatchlist.includes(anime.id);
            const cardElement = document.createElement('div');
            cardElement.className = 'anime-card';
            cardElement.innerHTML = `
                ${isSaved ? '<div class="watchlist-badge">❤</div>' : ''}
                <div class="poster" style="background: ${anime.bgGradient};">
                    <span>${anime.title.charAt(0)}</span>
                </div>
                <div class="card-info">
                    <h3>${anime.title}</h3>
                    <p>${anime.genres.join(', ')} &middot; ${anime.episodes.length} Eps</p>
                </div>
            `;
            cardElement.addEventListener('click', () => launchWatchView(anime));
            animeCatalog.appendChild(cardElement);
        });
    }

    // Navigation and Action Views Switching
    function launchWatchView(anime) {
        stateCurrentAnime = anime;
        stateCurrentEpisodeIndex = 0;
        
        homeView.classList.add('hidden');
        watchView.classList.remove('hidden');
        window.scrollTo(0, 0);

        updateWatchViewUI();
    }

    function returnToCatalogView() {
        videoPlayer.pause();
        videoPlayer.src = "";
        stateCurrentAnime = null;
        watchView.classList.add('hidden');
        homeView.classList.remove('hidden');
        renderCatalog();
    }

    function updateWatchViewUI() {
        if (!stateCurrentAnime) return;

        watchTitle.textContent = stateCurrentAnime.title;
        w2gLink.href = stateCurrentAnime.w2gRoom;
        
        // Refresh Watchlist Dynamic State Textures
        const isSaved = localWatchlist.includes(stateCurrentAnime.id);
        if (isSaved) {
            toggleWatchlistBtn.classList.add('in-list');
            toggleWatchlistBtn.textContent = '❤ Saved in Watchlist';
        } else {
            toggleWatchlistBtn.classList.remove('in-list');
            toggleWatchlistBtn.textContent = '❤ Add to Watchlist';
        }

        // Render Individual Actionable Episode Nodes
        episodeContainer.innerHTML = "";
        stateCurrentAnime.episodes.forEach((ep, index) => {
            const epBtn = document.createElement('button');
            epBtn.className = `episode-button ${index === stateCurrentEpisodeIndex ? 'active' : 'secondary'}`;
            epBtn.textContent = ep.num;
            epBtn.addEventListener('click', () => {
                stateCurrentEpisodeIndex = index;
                loadEpisodeStream();
            });
            episodeContainer.appendChild(epBtn);
        });

        loadEpisodeStream();
    }

    function loadEpisodeStream() {
        const episode = stateCurrentAnime.episodes[stateCurrentEpisodeIndex];
        if (!episode) return;

        // Synchronize Toolbar Arrows
        prevEpisodeBtn.disabled = stateCurrentEpisodeIndex === 0;
        nextEpisodeBtn.disabled = stateCurrentEpisodeIndex === stateCurrentAnime.episodes.length - 1;
        downloadSourceLink.href = episode.url;

        // Clean out dynamic styles across child nodes inside Container UI references
