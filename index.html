<script> 
"use strict"; 

const animeDatabase = [ 
  { 
    id: 1, 
    title: "Naruto", 
    genre: "Action", 
    episodes: 5, 
    description: "A young ninja works toward his dream of becoming a leader.", 
    colors: ["#e66b18", "#76232a"], 
    episodeSources: {
      1: "https://w3schools.com", // Sample playable video stream
      2: "https://w3schools.com"
    } 
  }
]; 

// Core Application Tracking States
let currentAnime = null;
let currentEpisodeIndex = 1;

// Document Selectors
const homeView = document.getElementById("homeView");
const watchView = document.getElementById("watchView");
const animeCatalog = document.getElementById("animeCatalog");
const searchInput = document.getElementById("searchInput");
const homeButton = document.getElementById("homeButton");
const backButton = document.getElementById("backButton");

const watchTitle = document.getElementById("watchTitle");
const watchDescription = document.getElementById("watchDescription");
const videoPlayer = document.getElementById("videoPlayer");
const playerMessage = document.getElementById("playerMessage");
const episodeListContainer = document.getElementById("episodeList");

const prevBtn = document.getElementById("previousButton");
const nextBtn = document.getElementById("nextButton");
const downloadLink = document.getElementById("downloadLink");
const w2gLink = document.getElementById("w2gLink");

// 1. Render Catalog on Home Page
function renderCatalog(animeArray) {
  animeCatalog.innerHTML = "";
  if (animeArray.length === 0) {
    animeCatalog.innerHTML = '<div class="empty">No anime found matching your search.</div>';
    return;
  }

  animeArray.forEach(anime => {
    const card = document.createElement("div");
    card.className = "anime-card";
    
    // Custom background gradient using anime token accent color configurations
    const gradient = anime.colors ? `linear-gradient(145deg, ${anime.colors[0]}, ${anime.colors[1]})` : '#17171f';
    
    card.innerHTML = `
      <div class="poster" style="background: ${gradient}">
        <span>${anime.title}</span>
      </div>
      <div class="card-info">
        <h3>${anime.title}</h3>
        <p>${anime.description.substring(0, 45)}...</p>
        <span class="tag">${anime.genre}</span>
      </div>
    `;
    
    card.addEventListener("click", () => openWatchView(anime));
    animeCatalog.appendChild(card);
  });
}

// 2. Navigation View Toggles
function openWatchView(anime) {
  currentAnime = anime;
  homeView.classList.add("hidden");
  watchView.classList.remove("hidden");
  
  watchTitle.textContent = anime.title;
  watchDescription.textContent = anime.description;
  
  loadEpisode(1);
  renderEpisodeButtons(anime);
}

function showHomeView() {
  homeView.classList.remove("hidden");
  watchView.classList.add("hidden");
  videoPlayer.pause();
  videoPlayer.src = "";
}

// 3. Load Selected Episode Stream
function loadEpisode(episodeNum) {
  currentEpisodeIndex = episodeNum;
  downloadLink.textContent = `Download Episode ${episodeNum}`;
  
  // Highlight active button state
  const buttons = episodeListContainer.querySelectorAll(".episode-button");
  buttons.forEach(btn => {
    if (parseInt(btn.textContent) === episodeNum) {
      btn.classList.add("active");
    } else {
      btn.classList.remove("active");
    }
  });

  // Pull video link source from entry data if available
  if (currentAnime.episodeSources && currentAnime.episodeSources[episodeNum]) {
    videoPlayer.src = currentAnime.episodeSources[episodeNum];
    videoPlayer.classList.remove("hidden");
    playerMessage.classList.add("hidden");
    videoPlayer.load();
  } else {
    // Hide player and show fallback notice if stream doesn't exist
    videoPlayer.src = "";
    videoPlayer.classList.add("hidden");
    playerMessage.classList.remove("hidden");
  }

  // Manage boundary state buttons
  prevBtn.disabled = (episodeNum === 1);
  nextBtn.disabled = (episodeNum === currentAnime.episodes);
}

// 4. Generate Dynamic Clickable Buttons
function renderEpisodeButtons(anime) {
  episodeListContainer.innerHTML = "";
  for (let i = 1; i <= anime.episodes; i++) {
    const btn = document.createElement("button");
    btn.className = "episode-button";
    btn.textContent = i;
    if (i === currentEpisodeIndex) btn.classList.add("active");
    
    btn.addEventListener("click", () => loadEpisode(i));
    episodeListContainer.appendChild(btn);
  }
}

// 5. Global Application Event Listeners
homeButton.addEventListener("click", showHomeView);
backButton.addEventListener("click", showHomeView);

prevBtn.addEventListener("click", () => {
  if (currentEpisodeIndex > 1) loadEpisode(currentEpisodeIndex - 1);
});

nextBtn.addEventListener("click", () => {
  if (currentEpisodeIndex < currentAnime.episodes) loadEpisode(currentEpisodeIndex + 1);
});

searchInput.addEventListener("input", (e) => {
  const query = e.target.value.toLowerCase().trim();
  const filtered = animeDatabase.filter(anime => 
    anime.title.toLowerCase().includes(query) || 
    anime.genre.toLowerCase().includes(query)
  );
  renderCatalog(filtered);
});

// App Initialization Launch Point
renderCatalog(animeDatabase);
</script>
</body>
</html>
