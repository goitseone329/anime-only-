
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Only</title>
<style>
:root {
  --bg: #0b0b0f;
  --panel: #17171f;
  --red: #ef233c;
  --text: #f7f7fb;
  --muted: #aaaab8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  background: #111116;
  border-bottom: 1px solid #292933;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo {
  color: var(--red);
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}
.logo span { color: white; }
.search {
  width: min(100%, 320px);
  padding: 11px 13px;
  border-radius: 8px;
  border: 1px solid #373742;
  background: #20202a;
  color: white;
  outline: none;
}
.search:focus { border-color: var(--red); }
main { max-width: 1200px; margin: auto; padding: 20px; }
.hero {
  padding: 30px 22px;
  border-radius: 14px;
  margin-bottom: 26px;
  background: linear-gradient(120deg, #50101e, #19111f 65%, #101015);
}
.hero h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 44px); }
.hero p { color: #ddd; line-height: 1.5; margin-bottom: 0; }
.section-title { margin: 24px 0 16px; font-size: 22px; }
.catalog {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 17px;
}
.anime-card {
  background: var(--panel);
  border: 1px solid #282832;
  border-radius: 11px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, border-color .2s;
}
.anime-card:hover {
  transform: translateY(-4px);
  border-color: var(--red);
}
.poster {
  height: 205px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(145deg, #4b1025, #21142e, #101018);
  overflow: hidden;
}
.poster span { text-shadow: 0 2px 10px #000; }
.card-info { padding: 12px; }
.card-info h3 { font-size: 15px; margin: 0 0 7px; }
.card-info p { color: var(--muted); font-size: 12px; margin: 0; }
.tag {
  display: inline-block;
  margin-top: 9px;
  color: #ff9ca8;
  background: #40131e;
  border-radius: 5px;
  padding: 4px 7px;
  font-size: 11px;
}
button, .download {
  background: var(--red);
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 11px 14px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
button:hover, .download:hover { filter: brightness(1.12); }
button:disabled { opacity: .4; cursor: not-allowed; }
.secondary { background: #30303b; }
.hidden { display: none !important; }
#watchView {
  background: var(--panel);
  border: 1px solid #2b2b36;
  border-radius: 12px;
  padding: 17px;
}
.back-button { margin-bottom: 18px; }
#watchTitle { margin: 5px 0 10px; }
.player {
  width: 100%;
  background: black;
  border-radius: 9px;
  overflow: hidden;
}
video {
  width: 100%;
  display: block;
  max-height: 70vh;
  background: black;
}
#playerMessage {
  color: #ddd;
  background: #101015;
  padding: 16px;
  line-height: 1.6;
  font-size: 14px;
}
.player-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin: 15px 0;
}
#episodeLabel { color: var(--muted); }
.episode-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.episode-button {
  background: #30303b;
  min-width: 46px;
}
.episode-button.active { background: var(--red); }
.empty {
  color: var(--muted);
  padding: 25px 0;
  text-align: center;
  grid-column: 1 / -1;
}
footer {
  text-align: center;
  color: var(--muted);
  padding: 28px 16px;
  border-top: 1px solid #292933;
  margin-top: 35px;
  font-size: 13px;
}
@media (max-width: 450px) {
  header { padding: 12px; }
  main { padding: 13px; }
  .catalog { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
  .poster { height: 180px; font-size: 19px; }
  #watchView { padding: 12px; }
}
</style>
</head>
<body>

<header>
  <div class="logo" id="homeButton">ANIME <span>ONLY</span></div>
  <input
    class="search"
    id="searchInput"
    type="search"
    placeholder="Search anime..."
    aria-label="Search anime"
  >
</header>

<main>
  <section id="homeView">
    <div class="hero">
      <h1>Anime Only</h1>
      <p>Your anime corner. Discover titles, open a show, and choose an episode.</p>
    </div>

    <h2 class="section-title">Anime Collection</h2>
    <div class="catalog" id="animeCatalog"></div>
  </section>

  <section id="watchView" class="hidden">
    <button class="secondary back-button" id="backButton">← Back to Anime</button>

    <h2 id="watchTitle">Anime Title</h2>
    <p id="watchDescription" style="color:#aaaab8;line-height:1.6"></p>

    <div class="player">
      <video id="videoPlayer" controls playsinline preload="metadata">
        Your browser does not support video playback.
      </video>
      <div id="playerMessage">
        Choose an episode below. A playable video source must be added by the site owner.
      </div>
    </div>

    <div class="player-controls">
      <button id="previousButton" class="secondary">← Previous</button>
      <span id="episodeLabel">Episode 1</span>
      <button id="nextButton">Next →</button>
      <a id="downloadLink" class="download" href="#" aria-disabled="true">Download</a>
    </div>

    <h3>Episodes</h3>
    <div id="episodeList" class="episode-list"></div>
  </section>
</main>

<footer>
  Anime Only · Fan-made demo website
</footer>

<script>
"use strict";

/*
  DEMO CATALOG:
  These are sample entries to help you build your website.
  Add authorized video URLs to episodeSources when available.
*/

const animeDatabase = [
  {
    id: 1,
    title: "Naruto",
    genre: "Action",
    episodes: 5,
    description: "A young ninja works toward his dream of becoming a leader.",
    colors: ["#e66b18", "#76232a"],
    episodeSources: {}
  },
  {
    id: 2,
    title: "One Piece",
    genre: "Adventure",
    episodes: 5,
    description: "A crew of pirates sets out on a grand adventure.",
    colors: ["#1c728a", "#12274c"],
    episodeSources: {}
  },
  {
    id: 3,
    title: "Attack on Titan",
    genre: "Action",
    episodes: 5,
    description: "Humanity fights for survival behind enormous walls.",
    colors: ["#8a4027", "#241b27"],
    episodeSources: {}
  },
  {
    id: 4,
    title: "Demon Slayer",
    genre: "Fantasy",
    episodes: 5,
    description: "A young swordsman searches for a way to save his sister.",
    colors: ["#267a76", "#18213f"],
    episodeSources: {}
  },
  {
    id: 5,
    title: "Jujutsu Kaisen",
    genre: "Supernatural",
    episodes: 5,
    description: "Students face dangerous supernatural curses.",
    colors: ["#5a318d", "#19142b"],
    episodeSources: {}
  },
  {
    id: 6,
    title: "My Hero Academia",
    genre: "Action",
    episodes: 5,
    description: "A young student trains to become a great hero.",
    colors: ["#36815d", "#172d35"],
    episodeSources: {}
  },
  {
    id: 7,
    title: "Dragon Ball",
    genre: "Adventure",
    episodes: 5,
    description: "Warriors train and take on powerful opponents.",
    colors: ["#e78b22", "#7b271a"],
    episodeSources: {}
  },
  {
    id: 8,
    title: "Death Note",
    genre: "Thriller",
    episodes: 5,
    description: "A mysterious notebook leads to a battle of wits.",
    colors: ["#45455f", "#111118"],
    episodeSources: {}
  },
  {
    id: 9,
    title: "Hunter x Hunter",
    genre: "Adventure",
    episodes: 5,
    description: "A young adventurer sets out to find his father.",
    colors: ["#368a72", "#182d50"],
    episodeSources: {}
  },
  {
    id: 10,
    title: "Bleach",
    genre: "Action",
    episodes: 5,
    description: "A teenager gains extraordinary spiritual powers.",
    colors: ["#3574aa", "#171b30"],
    episodeSources: {}
  },
  {
    id: 11,
    title: "Spy x Family",
    genre: "Comedy",
    episodes: 5,
    description: "An unusual family tries to keep its secrets hidden.",
    colors: ["#7d9d55", "#233b35"],
    episodeSources: {}
  },
  {
    id: 12,
    title: "Fullmetal Alchemist",
    genre: "Fantasy",
    episodes: 5,
    description: "Two brothers search for a way to restore what they lost.",
    colors: ["#ad583a", "#38242c"],
    episodeSources: {}
  }
];

const catalog = document.getElementById("animeCatalog");
const searchInput = document.getElementById("searchInput");
const homeView = document.getElementById("homeView");
const watchView = document.getElementById("watchView");
const videoPlayer = document.getElementById("videoPlayer");
const playerMessage = document.getElementById("playerMessage");
const watchTitle = document.getElementById("watchTitle");
const watchDescription = document.getElementById("watchDescription");
const episodeLabel = document.getElementById("episodeLabel");
const episodeList = document.getElementById("episodeList");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const downloadLink = document.getElementById("downloadLink");

let activeAnime = null;
let activeEpisode = 1;

function renderCatalog(items) {
  catalog.innerHTML = "";

  if (items.length === 0) {
    catalog.innerHTML =
      '<p class="empty">No anime found. Try another search.</p>';
    return;
  }

  items.forEach(function(anime) {
    const card = document.createElement("article");
    card.className = "anime-card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", "Open " + anime.title);

    const poster = document.createElement("div");
    poster.className = "poster";
    poster.style.background =
      "linear-gradient(145deg, " +
      anime.colors[0] + ", " + anime.colors[1] + ")";

    const posterText = document.createElement("span");
    posterText.textContent = anime.title;
    poster.appendChild(posterText);

    const info = document.createElement("div");
    info.className = "card-info";

    const title = document.createElement("h3");
    title.textContent = anime.title;

    const genre = document.createElement("p");
    genre.textContent = anime.genre;

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = anime.episodes + " demo episodes";

    info.append(title, genre, tag);
    card.append(poster, info);

    card.addEventListener("click", function() {
      openAnime(anime);
    });

    card.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openAnime(anime);
      }
    });

    catalog.appendChild(card);
  });
}

function searchAnime() {
  const query = searchInput.value.trim().toLowerCase();

  const filtered = animeDatabase.filter(function(anime) {
    return anime.title.toLowerCase().includes(query) ||
      anime.genre.toLowerCase().includes(query);
  });

  renderCatalog(filtered);
}

function openAnime(anime) {
  activeAnime = anime;
  activeEpisode = 1;

  homeView.classList.add("hidden");
  watchView.classList.remove("hidden");
  searchInput.classList.add("hidden");

  watchTitle.textContent = anime.title;
  watchDescription.textContent = anime.description;

  showEpisode(activeEpisode);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showEpisode(episodeNumber) {
  if (!activeAnime) return;

  activeEpisode = Math.max(
    1,
    Math.min(episodeNumber, activeAnime.episodes)
  );

  episodeLabel.textContent =
    "Episode " + activeEpisode + " of " + activeAnime.episodes;

  previousButton.disabled = activeEpisode === 1;
  nextButton.disabled = activeEpisode === activeAnime.episodes;

  episodeList.innerHTML = "";

  for (let i = 1; i <= activeAnime.episodes; i++) {
    const button = document.createElement("button");
    button.className = "episode-button" +
      (i === activeEpisode ? " active" : "");
    button.textContent = i;
    button.setAttribute("aria-label", "Episode " + i);

    button.addEventListener("click", function() {
      showEpisode(i);
    });

    episodeList.appendChild(button);
  }

  videoPlayer.pause();
  videoPlayer.removeAttribute("src");
  videoPlayer.load();

  const source = activeAnime.episodeSources[activeEpisode];

  downloadLink.removeAttribute("href");
  downloadLink.removeAttribute("download");
  downloadLink.setAttribute("aria-disabled", "true");
  downloadLink.style.opacity = ".4";
  downloadLink.style.pointerEvents = "none";

  if (source && isValidVideoUrl(source)) {
    videoPlayer.src = source;
    playerMessage.textContent =
      "Episode " + activeEpisode + " is ready. Press play to watch.";
    playerMessage.classList.remove("hidden");

    downloadLink.href = source;
    downloadLink.download =
      activeAnime.title.replace(/[^a-z0-9]/gi, "_") +
      "_episode_" + activeEpisode + ".mp4";
    downloadLink.setAttribute("aria-disabled", "false");
    downloadLink.style.opacity = "1";
    downloadLink.style.pointerEvents = "auto";

    videoPlayer.load();
  } else {
    playerMessage.classList.remove("hidden");
    playerMessage.textContent =
      "Episode " + activeEpisode +
      " is selected, but no video file has been added yet. " +
      "The catalogue and episode controls work; playback and downloads " +
      "need a valid, authorized video URL.";
  }
}

function isValidVideoUrl(value) {
  try {
    const url = new URL(value, window.location.href);
    return url.protocol === "https:" || url.protocol === "http:";
  } catch (error) {
    return false;
  }
}

function returnHome() {
  videoPlayer.pause();
  videoPlayer.removeAttribute("src");
  videoPlayer.load();

  activeAnime = null;
  watchView.classList.add("hidden");
  homeView.classList.remove("hidden");
  searchInput.classList.remove("hidden");

  searchAnime();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

searchInput.addEventListener("input", searchAnime);

document.getElementById("backButton").addEventListener("click", returnHome);
document.getElementById("homeButton").addEventListener("click", returnHome);

previousButton.addEventListener("click", function() {
  if (activeAnime && activeEpisode > 1) {
    showEpisode(activeEpisode - 1);
  }
});

nextButton.addEventListener("click", function() {
  if (activeAnime && activeEpisode < activeAnime.episodes) {
    showEpisode(activeEpisode + 1);
  }
});

downloadLink.addEventListener("click", function(event) {
  if (downloadLink.getAttribute("aria-disabled") === "true") {
    event.preventDefault();
    playerMessage.textContent =
      "Download is unavailable until a valid video URL is added.";
  }
});

renderCatalog(animeDatabase);
</script>
</body>
</html>
