<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <style>
        :root {
            --bg: #0b0b0f;
            --panel: #17171f;
            --red: #ef233c;
            --text: #f7f7fb;
            --muted: #aaaab8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            background: #111116;
            border-bottom: 1px solid #292933;
            padding: 16px;
        }

        .logo {
            color: var(--red);
            font-size: 23px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .logo span {
            color: white;
        }

        .search {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #292933;
            background: #1c1c24;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .search:focus {
            border-color: var(--red);
        }

        /* Filter Tab Row matching your layout */
        .filter-row {
            display: flex;
            gap: 8px;
            padding: 16px;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #1c1c24;
        }

        .filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: #1c1c24;
            color: var(--text);
            border: 1px solid #292933;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
        }

        main {
            padding: 16px;
        }

        .section-title {
            margin: 8px 0 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .anime-card {
            background: var(--panel);
            border: 1px solid #242430;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }

        .poster {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .card-info {
            padding: 10px;
        }

        .card-info h3 {
            font-size: 14px;
            margin: 0 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info p {
            color: var(--muted);
            font-size: 12px;
            margin: 0;
        }

        .hidden {
            display: none !important;
        }

        #watchView {
            background: var(--panel);
            border: 1px solid #242430;
            border-radius: 12px;
            padding: 16px;
        }

        .back-btn {
            background: #242430;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .player {
            width: 100%;
            background: black;
            border-radius: 8px;
            overflow: hidden;
            margin: 12px 0;
        }

        video {
            width: 100%;
            display: block;
        }

        .episode-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .episode-btn {
            background: #242430;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .episode-btn.active {
            background: var(--red);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="logoHome">Anime <span>Only</span></div>
        <input class="search" id="animeSearch" type="search" placeholder="Search anime...">
    </header>

    <!-- Category Filters -->
    <div class="filter-row">
        <button class="filter-btn active" data-genre="all">All Items</button>
        <button class="filter-btn" data-genre="Action">Action</button>
        <button class="filter-btn" data-genre="Adventure">Adventure</button>
    </div>

    <main>
        <!-- Home Catalog View -->
        <section id="homeView">
            <h2 class="section-title"># Trending Anime</h2>
            <div class="catalog" id="catalogGrid"></div>
        </section>

        <!-- Player Watch View -->
        <section id="watchView" class="hidden">
            <button class="back-btn" id="btnBack">← Back to Catalog</button>
            <h2 id="streamTitle">Anime Stream</h2>
            
            <div class="player">
                <video id="mainVideoPlayer" controls playsinline>
                    Your browser does not support video playback.
                </video>
            </div>

            <h3>Episodes</h3>
            <div id="episodeGrid" class="episode-list"></div>
        </section>
    </main>

    <script>
        "use strict";

        // Structured Database
        const ANIME_DATA = [
            {
                id: "1",
                title: "Naruto Shuden",
                genres: ["Action"],
                bg: "linear-gradient(135deg, #e66b18, #76232a)",
                episodes: [
                    { num: 1, url: "https://w3schools.com" },
                    { num: 2, url: "https://w3schools.com" }
                ]
            },
            {
                id: "2",
                title: "One Piece Voyage",
                genres: ["Adventure"],
                bg: "linear-gradient(135deg, #1a5276, #111116)",
                episodes: [
                    { num: 1, url: "https://w3schools.com" }
                ]
            }
        ];

        // Tracker States
        let currentGenre = "all";
        let searchQuery = "";
        let selectedAnime = null;
        let activeEpisodeIdx = 0;

        // DOM Nodes
        const catalogGrid = document.getElementById('catalogGrid');
        const homeView = document.getElementById('homeView');
        const watchView = document.getElementById('watchView');
        const animeSearch = document.getElementById('animeSearch');
        const logoHome = document.getElementById('logoHome');
        const btnBack = document.getElementById('btnBack');
        const streamTitle = document.getElementById('streamTitle');
        const mainVideoPlayer = document.getElementById('mainVideoPlayer');
        const episodeGrid = document.getElementById('episodeGrid');

        function displayCatalog() {
            catalogGrid.innerHTML = "";

            const filtered = ANIME_DATA.filter(anime => {
                const matchesSearch = anime.title.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesGenre = currentGenre === "all" || anime.genres.includes(currentGenre);
                return matchesSearch && matchesGenre;
            });

            if (filtered.length === 0) {
                catalogGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#aaaab8; padding:20px;">No anime found.</div>';
                return;
            }

            filtered.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="poster" style="background: ${anime.bg};">
                        <span>${anime.title.charAt(0)}</span>
                    </div>
                    <div class="card-info">
                        <h3>${anime.title}</h3>
                        <p>${anime.genres.join(', ')} &middot; ${anime.episodes.length} Eps</p>
                    </div>
                `;
                card.addEventListener('click', () => openPlayer(anime));
                catalogGrid.appendChild(card);
            });
        }

        function openPlayer(anime) {
            selectedAnime = anime;
            activeEpisodeIdx = 0;
            
            homeView.classList.add('hidden');
            watchView.classList.remove('hidden');
            streamTitle.textContent = anime.title;

            buildEpisodeButtons();
            playEpisode();
        }

        function closePlayer() {
            mainVideoPlayer.pause();
            mainVideoPlayer.src = "";
            selectedAnime = null;
            watchView.classList.add('hidden');
            homeView.classList.remove('hidden');
        }

        function buildEpisodeButtons() {
            episodeGrid.innerHTML = "";
            selectedAnime.episodes.forEach((ep, idx) => {
                const btn = document.createElement('button');
                btn.className = `episode-btn ${idx === activeEpisodeIdx ? 'active' : ''}`;
                btn.textContent = ep.num;
                btn.addEventListener('click', () => {
                    activeEpisodeIdx = idx;
                    updateEpisodeButtonStyles();
                    playEpisode();
                });
                episodeGrid.appendChild(btn);
            });
