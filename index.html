<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHeaven - Ghost Rider Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            font-family: 'Impact', 'Arial Black', sans-serif; 
            text-align: center; 
            padding: 20px;
            background-image: linear-gradient(rgba(10, 10, 10, 0.9), rgba(10, 10, 10, 0.95));
        }
        
        /* Hellfire & Skull Elements */
        .skull-header {
            font-size: 32px;
            color: #ff4500;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff4500, 0 0 20px #ff8c00, 0 0 30px #ff0000;
            margin-bottom: 20px;
        }
        .skull-icon {
            font-size: 50px;
            animation: flame 1.5s ease-in-out infinite alternate;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes flame {
            0% { text-shadow: 0 0 10px #ff4500, 0 0 20px #ff8c00; transform: scale(1); }
            100% { text-shadow: 0 0 15px #ff0000, 0 0 30px #ff4500, 0 0 40px #ff8c00; transform: scale(1.05); }
        }

        /* Responsive Hellfire Video Player Box */
        .video-container {
            max-width: 450px;
            margin: 15px auto 25px;
            padding: 0 10px;
        }
        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border: 2px solid #ff4500;
            border-radius: 6px;
            background: #000000;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.4);
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Metadata & Category Tags */
        .tags-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .tag { 
            background: linear-gradient(45deg, #ff0000, #ff5722); 
            color: white; 
            padding: 6px 15px; 
            font-weight: bold; 
            border-radius: 4px; 
            font-size: 14px;
            box-shadow: 0 0 8px rgba(255, 69, 0, 0.6);
        }
        .meta-info { font-size: 18px; margin: 10px 0; font-family: sans-serif; }
        .highlight-flame { color: #ff5722; font-weight: bold; text-shadow: 0 0 5px rgba(255, 87, 34, 0.5); }
        
        /* Brimstone Action Buttons */
        .btn-container { display: flex; justify-content: center; gap: 15px; margin: 15px 0 25px; }
        .action-btn { 
            background: #1a1a1a; 
            color: #ff5722; 
            border: 2px solid #ff5722; 
            padding: 8px 22px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.3);
            text-transform: uppercase;
        }
        .action-btn:hover {
            background: #ff5722;
            color: #000;
            box-shadow: 0 0 15px #ff5722;
        }

        /* Hellfire Countdown Box */
        .countdown-box { 
            margin: 25px 0; 
            border-top: 2px solid #ff4500; 
            border-bottom: 2px solid #ff4500; 
            padding: 15px 0;
            background: rgba(255, 69, 0, 0.05);
            box-shadow: inset 0 0 15px rgba(255, 69, 0, 0.1);
        }
        .countdown-title { font-size: 20px; color: #bbbbbb; margin-bottom: 8px; font-family: sans-serif; }
        .countdown-timer { 
            font-size: 26px; 
            color: #ff4500; 
            font-weight: bold; 
            text-shadow: 0 0 8px #ff4500;
        }

        /* Episode Grid Setup */
        .episode-grid { max-width: 450px; margin: 0 auto 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 10px; font-family: sans-serif; }
        .episode-card { 
            border: 2px solid #ff4500; 
            background: #111111; 
            padding: 14px 5px; 
            border-radius: 4px; 
            text-decoration: none; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 0 8px rgba(255, 69, 0, 0.2);
            cursor: pointer;
        }
        .episode-card:hover { 
            background: #220a02; 
            border-color: #ff8c00;
            box-shadow: 0 0 15px #ff4500;
        }
        .ep-label { font-size: 12px; color: #ff8c00; font-weight: bold; text-transform: uppercase; }
        .ep-num { font-size: 28px; font-weight: bold; margin: 2px 0; color: #ffffff; }
        .ep-time { font-size: 11px; color: #888888; }
        
        .row-2 { grid-column: span 3; display: flex; justify-content: center; gap: 12px; }
        .row-2 .episode-card { width: calc(33.33% - 8px); }

        .section-title { 
            font-size: 22px; 
            color: #ff4500; 
            margin-top: 20px; 
            border-top: 2px dashed #333; 
            padding-top: 15px;
            text-shadow: 0 0 5px #ff4500;
        }
    </style>
</head>
<body>

    <!-- Ghost Rider Skull Visual Brand Indicator -->
    <div class="skull-container">
        <span class="skull-icon">💀</span>
        <div class="skull-header">Ghost Rider Stream</div>
    </div>

    <!-- Interactive Streaming Frame Box -->
    <div class="video-container">
        <div class="player-wrapper">
            <!-- Starting Source (Episode 5 Placeholder) -->
            <iframe id="main-player" src="https://youtube.com" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Category Tags -->
    <div class="tags-container">
        <div class="tag">Comedy</div>
        <div class="tag">Fantasy</div>
    </div>

    <!-- Metadata Details -->
    <div class="meta-info">
        <p>Episodes: <span class="highlight-flame">5+</span> Year: <span class="highlight-flame">2026</span></p>
        <p>Score: <span class="highlight-flame">?</span></p>
    </div>

    <!-- Action Buttons -->
    <div class="btn-container">
        <button class="action-btn">Bookmark ＋</button>
        <button class="action-btn">Rate ＋</button>
    </div>

    <!-- Fire Timer Display -->
    <div class="countdown-box">
        <div class="countdown-title">Countdown to Next Soul</div>
        <div class="countdown-timer" id="timer">Loading Engine...</div>
    </div>

    <!-- Episode Selection System Grid with Data Attributes -->
    <div class="episode-grid">
        <div class="episode-card" data-video="https://youtube.com">
            <span class="ep-label">Chapter</span>
            <span class="ep-num">5</span>
            <span class="ep-time">2 h ago</span>
        </div>
        <div class="episode-card" data-video="https://youtube.com">
            <span class="ep-label">Chapter</span>
            <span class="ep-num">4</span>
            <span class="ep-time">5 d ago</span>
        </div>
        <div class="episode-card" data-video="https://youtube.com">
            <span class="ep-label">Chapter</span>
            <span class="ep-num">3</span>
            <span class="ep-time">5 d ago</span>
        </div>
        <div class="row-2">
            <div class="episode-card" data-video="https://youtube.com">
                <span class="ep-label">Chapter</span>
                <span class="ep-num">2</span>
                <span class="ep-time">5 d ago</span>
            </div>
            <div class="episode-card" data-video="https://youtube.com">
                <span class="ep-label">Chapter</span>
                <span class="ep-num">1</span>
                <span class="ep-time">5 d ago</span>
            </div>
        </div>
    </div>

    <div class="section-title">More Hellfire Streams</div>

    <!-- Script Automation Layer -->
    <script>
        // 1. Episode Video Switching Logic
        const player = document.getElementById('main-player');
        document.querySelectorAll('.episode-card').forEach(card => {
            card.addEventListener('click', () => {
                const targetUrl = card.getAttribute('data-video');
                if (targetUrl) {
                    player.src = targetUrl;
                }
            });
        });

        // 2. Real-time Live Ticking Countdown Script (Set for 7 days into the future)
        const targetDate = new Date().getTime() + (7 * 24 * 60 * 60 * 1000);

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('timer').innerHTML = 
                `${days}d ${hours}h ${minutes}m ${seconds}s`;

            if (difference < 0) {
                clearInterval(intervalId);
                document.getElementById('timer').innerHTML = "NEW EPISODE RELEASED!";
            }
        }

        const intervalId = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
