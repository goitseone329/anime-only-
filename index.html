<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <link rel="stylesheet" href="Styles/style.css">
    <style>
        /* Base Setup Mirroring Anime Heaven */
        body {
            background-color: #070707;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #151515;
            border-bottom: 2px solid #ff001e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
        }
        .nav-logo {
            background-color: #ff001e;
            color: white;
            font-weight: 900;
            padding: 4px 10px;
            font-size: 22px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }
        .search-container {
            flex-grow: 1;
            margin: 0 12px;
        }
        .search-container input {
            width: 100%;
            background-color: #0f0f0f;
            border: 1px solid #ff001e;
            color: white;
            padding: 8px 12px;
            font-size: 15px;
            border-radius: 2px;
            box-sizing: border-box;
        }
        .menu-icon {
            color: #ff001e;
            font-size: 28px;
            font-weight: bold;
            line-height: 1;
        }

        /* Video Streaming Player Panel */
        .player-wrapper {
            background-color: #151515;
            border-bottom: 3px solid #ff001e;
            width: 100%;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .player-info {
            padding: 12px 15px;
        }
        .player-info h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: #fff;
            font-weight: 600;
        }
        .player-info p {
            margin: 0;
            font-size: 14px;
            color: #a5a5a5;
        }

        /* Top Banner Ad Container */
        .top-banner-space {
            width: 100%;
            margin: 0 auto;
            text-align: center;
            background-color: #000;
            display: flex;
            justify-content: center;
        }
        .top-banner-space img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Category Section Headers */
        .section-title {
            background-color: #121212;
            color: #d1d1d1;
            text-align: left;
            padding: 14px 15px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-left: 4px solid #ff001e;
            border-bottom: 1px solid #1c1c1c;
            margin: 0;
            text-transform: uppercase;
        }

        /* Anime List Array Stacks */
        .anime-feed {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .anime-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            cursor: pointer;
        }

        .anime-card {
            background-color: #0f0f0f;
            border-bottom: 5px solid #070707;
            position: relative;
            width: 100%;
        }

        /* 16:9 Image Wrapper */
        .poster-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #151515;
            overflow: hidden;
        }
        .poster-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Badge Layering */
        .episode-badge {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #ff001e;
            color: white;
            font-size: 16px;
            font-weight: 700;
            padding: 5px 14px;
            z-index: 2;
        }
        .movie-badge {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #9000ff;
            color: white;
            font-size: 16px;
            font-weight: 700;
            padding: 5px 14px;
            z-index: 2;
        }

        .action-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background-color: rgba(255, 0, 30, 0.85);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 2;
        }

        /* Metadata Details Layout */
        .anime-details {
            padding: 14px 15px;
            text-align: left;
        }
        .anime-title-main {
            font-size: 19px;
            font-weight: 400;
            margin: 0 0 3px 0;
            color: #e3e3e3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .anime-title-sub {
            font-size: 16px;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: #a5a5a5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .anime-status {
            color: #ff001e;
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }

        #no-results-msg {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 16px;
            display: none;
        }

        /* Fixed Mobile Tab Navigation Footer */
        .mobile-footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #121212;
            border-top: 1px solid #1c1c1c;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 10;
        }
        .footer-nav-item {
            color: #7a7a7a;
            text-decoration: none;
            font-size: 22px;
        }
        .footer-nav-item.active {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Header Navbar Container Interface -->
    <nav class="navbar">
        <div class="nav-logo">💀</div>
        <div class="search-container">
            <input type="text" id="anime-search-input" onkeyup="filterAnimeCatalog()" placeholder="Search catalog...">
        </div>
        <div class="menu-icon">&#9776;</div>
    </nav>

    <!-- LIVE DYNAMIC EMBEDDABLE PLAYER CONTROLLER PANEL -->
    <section class="player-wrapper">
        <div class="video-container">
            <iframe id="main-stream-player" src="https://youtube.com" allowfullscreen></iframe>
        </div>
        <div class="player-info">
            <h2 id="player-stream-title">Select an episode below to play</h2>
            <p id="player-stream-meta">Language: Subbed | Source: High-Definition Widescreen Mirror</p>
        </div>
    </section>

    <!-- Adsterra Header Banner Box Area Placement Node -->
    <div class="top-banner-space">
        <img src="https://placeholder.com" alt="Featured Promo Banner">
    </div>

    <!-- Live Search Fallback Text Notification Container -->
    <div id="no-results-msg">No titles match your search entry.</div>

    <!-- CATEGORY BLOCK 1: TV SERIES SCHEDULE -->
    <h2 class="section-title">Subbed Anime Schedule</h2>
    <main class="anime-feed" id="series-feed-grid"></main>

    <!-- CATEGORY BLOCK 2: MOVIES FEED -->
    <h2 class="section-title">Featured Anime Movies</h2>
    <main class="anime-feed" id="movies-feed-grid" style="margin-bottom: 85px;"></main>

    <!-- Mobile Menu Footer -->
    <div class="mobile-footer-nav">
        <a href="#" class="footer-nav-item active">&#8962;</a>
        <a href="#" class="footer-nav-item">&#129517;</a>
        <a href="#" class="footer-nav-item">&#128278;</a>
        <a href="#" class="footer-nav-item">&#128269;</a>
    </div>

    <!-- Live Automated Database API Pipeline Script Engine -->
    <script>
        const apiSeriesUrl = 'https://jikan.moe';
        const apiMoviesUrl = 'https://jikan.moe';

        Promise.all([
            fetch(apiSeriesUrl).then(res => res.json()),
            fetch(apiMoviesUrl).then(res => res.json())
        ])
        .then(([seriesData, moviesData]) => {
            renderList(seriesData.data, 'series-feed-grid', 'series');
            renderList(moviesData.data, 'movies-feed-grid', 'movie');
        })
        .catch(err => console.error('Database bridge pipeline error:', err));

        function renderList(animeArray, targetGridId, catalogType) {
            const grid = document.getElementById(targetGridId);
            grid.innerHTML = '';

            animeArray.forEach(anime => {
                const mainTitle = anime.title_english ? anime.title_english : anime.title;
                const subTitle = anime.title_japanese ? anime.title_japanese : '';
