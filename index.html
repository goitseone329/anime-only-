<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free</title>
    <style>
        /* GLOBAL RESET & THEME */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* HEADER BAR SETTINGS */
        header {
            background-color: #0d0d0d;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 2px solid #ff0000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-box {
            background-color: #ff0000;
            padding: 8px;
            border-radius: 5px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .logo-box svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        /* SEARCH BAR SYSTEM */
        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px 40px 10px 15px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #ff0000;
        }
        .search-icon-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .search-icon-btn svg {
            width: 16px;
            height: 16px;
            fill: #ff0000;
        }

        /* INTEGRATED VIDEO PLAYER CONSOLE CONTAINER */
        .player-section {
            width: 100%;
            background-color: #050505;
            border-bottom: 1px solid #1a1a1a;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-wrapper {
            width: 90%;
            max-width: 800px;
            position: relative;
            padding-top: 56.25%; /* Fixed 16:9 ratio layout box */
            background-color: #0c0c0c;
            border: 2px solid #222;
            border-radius: 6px;
            overflow: hidden;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .player-details {
            width: 90%;
            max-width: 800px;
            padding: 10px 0 0 0;
            text-align: left;
        }
        .player-details h2 {
            font-size: 1.1rem;
            color: #ff0000;
            margin-bottom: 4px;
        }
        .player-details p {
            font-size: 0.85rem;
            color: #888;
        }

        /* MAIN CONTENT LAYOUT */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 15px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 4px solid #ff0000;
            padding-left: 10px;
        }

        /* CARDS GRID SYSTEM */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        /* INDIVIDUAL ANIME CARD */
        .anime-card {
            background-color: #0d0d0d;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #222;
            cursor: pointer;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
            box-shadow: 0 5px 15px rgba(250, 0, 0, 0.2);
        }
        .anime-poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%; 
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .anime-poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .anime-card-info {
            padding: 10px;
        }
        .anime-card-info h3 {
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-card-info p {
            font-size: 0.75rem;
            color: #ff0000;
        }

        /* ADSTERRA PLACEHOLDER BLOCKS */
        .ad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            width: 100%;
            min-height: 90px;
        }
    </style>
</head>
<body>
