<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Heaven</title>
  <!-- FIX 1: This hides your Vercel URL info from referrers -->
  <meta name="referrer" content="no-referrer">
  <style>
    /* --- GLOBAL BASE THEME --- */
    body {
      background-color: #060606;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0e0e0e;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 2px solid #ff0000;
    }

    .logo-box {
      background-color: #ff0000;
      color: #ffffff;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 3px;
      margin-right: 15px;
      font-size: 1.1rem;
    }

    .search-bar {
      background-color: #161616;
      border: 1px solid #222222;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 4px;
      width: 100%;
      max-width: 400px;
    }

    /* --- STABLE CONTROLS DISPLAY COMPONENT --- */
    .player-container {
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-wrapper {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background-color: #0e0e0e;
      border: 2px solid #1a1a1a;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }

    /* --- CENTRALIZED PLAYER ACTIONS WINDOW --- */
    .player-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ccc;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 5;
      background-color: rgba(14, 14, 14, 0.95);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    /* --- Sleek Red Watch Button Layout */
    .stream-action-btn {
      background-color: #ff0000;
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.2s ease, transform 0.2s ease;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
    }

    .stream-action-btn:active {
      transform: scale(0.98);
    }

    .player-details {
      width: 90%;
      max-width: 800px;
      padding: 15px 0 0 0;
      text-align: left;
      box-sizing: border-box;
    }

    .player-details h2 {
      font-size: 1.2rem;
      color: #ff0000;
      margin: 0 0 4px 0;
    }

    .player-details p {
      font-size: 0.85rem;
      color: #888;
      margin: 0;
    }

    /* --- MAIN CONTENT LAYOUT --- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      font-size: 1.4rem;
      border-left: 4px solid #ff0000;
      padding-left: 10px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- CARDS GRID SYSTEM --- */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .anime-card {
      background-color: #0e0e0e;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .anime-card:hover {
      transform: translateY(-4px);
      border-color: #ff0000;
    }

    .card-image-wrapper {
      background-size: cover;
      background-position: center;
      height: 240px;
      width: 100%;
      background-color: #1a1a1a;
    }

    .card-details {
      padding: 10px;
    }

    .card-details h3 {
      font-size: 0.95rem;
      margin: 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .banner-title {
      display: block;
      color: #ff0000;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .rating {
      font-size: 0.8rem;
      color: #ffcc00;
    }

    .loading-text {
      color: #888;
      grid-column: 1 / -1;
      text-align: center;
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-box">ANIME</div>
    <input type="text" class="search-bar" placeholder="Search anime...">
  </header>

  <div class="player-container">
    <div class="player-wrapper">
      <!-- Media Embed Area -->
      <div id="placeholder-screen" class="player-placeholder">
        <p>No media stream targeting currently loaded.</p>
        <p style="font-size: 0.8rem; color: #666;">Select a dynamic node card lower on the grid interface architecture to bind connection layout endpoints.</p>
      </div>
      <iframe id="video-embed-frame" style="display: none;" allowfullscreen></iframe>
    </div>
    
    <div class="player-details">
      <h2 id="statusMsg">Playing: Select an Anime</h2>
      <p id="subMsg">Streaming Client: Idle</p>
    </div>
  </div>

  <div class="container">
    <div class="section-title">Trending Anime</div>
    <!-- Clean grid node targets for runtime engine injection logic -->
    <div id="trending-anime-grid" class="anime-grid">
      <div class="loading-text">Connecting to Jikan API pipeline node structure...</div>
    </div>
  </div>

  <!-- --- DYNAMIC DISPATCH ENGINE --- -->
  <script>
    // System Configuration Coordinates
    const JIKAN_API_BASE = 'https://jikan.moe';
    const VIDLINK_EMBED_BASE = 'https://vidlink.pro';

    /**
     * Dispatches runtime request targets to populate UI card matrices 
     */
    async function loadTrendingAnime() {
      const gridContainer = document.getElementById('trending-anime-grid');
      if (!gridContainer) return;

      try {
        // Fetch popular global items directly via MyAnimeList engine bridges
        const response = await fetch(`${JIKAN_API_BASE}/top/anime?filter=bypopularity&limit=12`);
        const result = await response.json();
        
        // Wipe interface template placeholders
        gridContainer.innerHTML = '';

        if (!result.data || result.data.length === 0) {
          gridContainer.innerHTML = `<div class="loading-text">No data packets received from downstream structural networks.</div>`;
          return;
        }

        // Loop array data structures mapping entities dynamically into document fragments
        result.data.forEach(anime => {
          const card = document.createElement('div');
          card.className = 'anime-card';
          
          // Cross-connect selection parameters cleanly into live player loops
          card.addEventListener('click', () => {
            prepareStreamNode(anime.mal_id, anime.title);
          });

          card.innerHTML = `
            <div class="card-image-wrapper" style="background-image: url('${anime.images.jpg.image_url}');"></div>
            <div class="card-details">
              <span class="banner-title">${anime.type || 'TV'}</span>
              <h3>${anime.title}</h3>
              <span class="rating">★ ${anime.score || 'N/A'}</span>
            </div>
          `;
          gridContainer.appendChild(card);
        });

      } catch (error) {
        console.error('API Pipeline Break:', error);
        gridContainer.innerHTML = `<div class="loading-text" style="color: #ff0000;">Engine initialization failed. Pipeline error context logs.</div>`;
      }
    }

    /**
     * Binds structural dynamic element routing data targeting third party streaming contexts
     */
    function prepareStreamNode(id, streamTitle) {
      const statusMsg = document.getElementById('statusMsg');
      const subMsg = document.getElementById('subMsg');
      const placeholderScreen = document.getElementById('placeholder-screen');
      const embedFrame = document.getElementById('video-embed-frame');

      if (!statusMsg || !subMsg || !embedFrame || !placeholderScreen) return;

      // Update functional UI typography states safely
      statusMsg.textContent = `Playing: ${streamTitle}`;
      subMsg.textContent = `Streaming Client: Active (MAL Node ID: ${id})`;

      // Strip placeholders out of standard frame visualization flow states
      placeholderScreen.style.display = 'none';
      embedFrame.style.display = 'block';

      // Re-route clean dynamic query nodes directly into the target media frame interface structures
      embedFrame.src = `${VIDLINK_EMBED_BASE}/${id}`;
    }

    // Bind event loop listeners tracking system frame processing loops
    document.addEventListener('DOMContentLoaded', loadTrendingAnime);
  </script>
</body>
</html>
