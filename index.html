<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <style>
        :root {
            --bg: #0b0b0f;
            --panel: #17171f;
            --red: #ef233c;
            --text: #f7f7fb;
            --muted: #aaaab8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            background: #111116;
            border-bottom: 1px solid #292933;
            padding: 16px;
        }

        .logo {
            color: var(--red);
            font-size: 23px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .logo span {
            color: white;
        }

        .search {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #292933;
            background: #1c1c24;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .search:focus {
            border-color: var(--red);
        }

        main {
            padding: 16px;
        }

        .section-title {
            margin: 8px 0 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .anime-card {
            background: var(--panel);
            border: 1px solid #242430;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }

        .poster-wrapper {
            height: 210px;
            width: 100%;
            overflow: hidden;
            background: #1c1c24;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 10px;
        }

        .card-info h3 {
            font-size: 14px;
            margin: 0 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info p {
            color: var(--muted);
            font-size: 12px;
            margin: 0;
        }

        .hidden {
            display: none !important;
        }

        #watchView {
            background: var(--panel);
            border: 1px solid #242430;
            border-radius: 12px;
            padding: 16px;
        }

        .back-btn {
            background: #242430;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .player {
            width: 100%;
            background: black;
            border-radius: 8px;
            overflow: hidden;
            margin: 12px 0;
        }

        video {
            width: 100%;
            display: block;
        }

        .episode-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .episode-btn {
            background: #242430;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .episode-btn.active {
            background: var(--red);
        }

        footer {
            text-align: center;
            padding: 30px 16px;
            margin-top: 40px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .social-links a {
            color: var(--muted);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="logoHome">Anime <span>Only</span></div>
        <input class="search" id="animeSearch" type="search" placeholder="Search anime...">
    </header>

    <main>
        <!-- Home Catalog View -->
        <section id="homeView">
            <h2 class="section-title" id="viewHeading"># Trending Anime</h2>
            <div class="catalog" id="catalogGrid"></div>
        </section>

        <!-- Player Watch View -->
        <section id="watchView" class="hidden">
            <button class="back-btn" id="btnBack">← Back to Catalog</button>
            <h2 id="streamTitle">Loading Title...</h2>
            
            <div class="player">
                <video id="mainVideoPlayer" controls playsinline>
                    Your browser does not support video playback.
                </video>
            </div>

            <h3>Episodes</h3>
            <div id="episodeGrid" class="episode-list"></div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#" target="_blank">💬 Discord</a>
            <a href="#" target="_blank">🐦 Twitter</a>
            <a href="#" style="color:var(--red);" target="_blank">❤ Support Us</a>
        </div>
    </footer>

    <script>
        "use strict";

        // Global Application Tracker Variables
        let searchQuery = "";
        let selectedAnime = null;
        let activeEpisodeIdx = 0;
        let debounceTimer;

        // DOM Nodes
        const catalogGrid = document.getElementById('catalogGrid');
        const homeView = document.getElementById('homeView');
        const watchView = document.getElementById('watchView');
        const animeSearch = document.getElementById('animeSearch');
        const logoHome = document.getElementById('logoHome');
        const btnBack = document.getElementById('btnBack');
        const streamTitle = document.getElementById('streamTitle');
        const mainVideoPlayer = document.getElementById('mainVideoPlayer');
        const episodeGrid = document.getElementById('episodeGrid');
        const viewHeading = document.getElementById('viewHeading');

        // Fetch Trending Anime Data using Jikan API v4
        async function fetchTrendingAnime() {
            catalogGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px;">Fetching global trends...</div>';
            try {
                const response = await fetch('https://jikan.moe');
                const json = await response.json();
                renderCards(json.data);
            } catch (error) {
                catalogGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#ef233c; padding:20px;">Failed to load data. Network rate limits met.</div>';
            }
        }

        // Fetch Queried Search Data using Jikan API v4
        async function searchAnime(query) {
            if (query.trim().length < 3) return;
            catalogGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px;">Searching database...</div>';
            try {
                const response = await fetch(`https://jikan.moe{encodeURIComponent(query)}&limit=20`);
                const json = await response.json();
                renderCards(json.data);
            } catch (error) {
                catalogGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#ef233c; padding:20px;">Error processing search parameters.</div>';
            }
        }

        // Dynamic Card DOM Rendering
        function renderCards(animeArray) {
            catalogGrid.innerHTML = "";
            if (!animeArray || animeArray.length === 0) {
                catalogGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#aaaab8; padding:20px;">No matching content found.</div>';
                return;
            }

            animeArray.forEach(anime => {
                const title = anime.title;
                const image = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
                const episodesCount = anime.episodes || '??';
                const rating = anime.score ? `★ ${anime.score}` : 'Unrated';

                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${image}" alt="${title}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <h3>${title}</h3>
                        <p>${rating} &middot; ${episodesCount} Eps</p>
                    </div>
                `;
                
                // Track dynamic structure parameters locally
                card.addEventListener('click', () => openPlayer(anime));
                catalogGrid.appendChild(card);
            });
        }

        function openPlayer(anime) {
            selectedAnime = anime;
            activeEpisodeIdx = 0;
            
            homeView.classList.add('hidden');
            watchView.classList.remove('hidden');
            streamTitle.textContent = anime.title;

            buildEpisodeButtons();
            playEpisode();
        }

        function closePlayer() {
            mainVideoPlayer.pause();
            mainVideoPlayer.src = "";
            selectedAnime = null;
            watchView.classList.add('hidden');
            homeView.classList.remove('hidden');
        }

        function buildEpisodeButtons() {
            episodeGrid.innerHTML = "";
