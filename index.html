<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven</title>
    <meta name="referrer" content="no-referrer">
    <style>
        body {
            background-color: #060606;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #0e0e0e;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 2px solid #ff0000;
        }
        .logo-box {
            background-color: #ff0000;
            color: #ffffff;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
            margin-right: 15px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .search-bar {
            background-color: #161616;
            border: 1px solid #222222;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .search-bar:focus {
            border-color: #ff0000;
        }
        .player-container {
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-wrapper {
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #0e0e0e;
            border: 2px solid #1a1a1a;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }
        .player-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ccc;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
            background-color: rgba(14, 14, 14, 0.95);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
        .player-details {
            width: 90%;
            max-width: 800px;
            padding: 15px 0 0 0;
            text-align: left;
            box-sizing: border-box;
        }
        .player-details h2 {
            font-size: 1.2rem;
            color: #ff0000;
            margin: 0 0 4px 0;
        }
        .player-details p {
            font-size: 0.85rem;
            color: #888;
            margin: 0 0 15px 0;
        }
        .episode-control-panel {
            display: none;
            background-color: #0e0e0e;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 15px;
            margin-top: 5px;
        }
        .episode-panel-title {
            font-size: 0.9rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .episode-grid::-webkit-scrollbar {
            width: 6px;
        }
        .episode-grid::-webkit-scrollbar-thumb {
            background-color: #222;
            border-radius: 3px;
        }
        .episode-btn {
            background-color: #161616;
            border: 1px solid #222;
            color: #ccc;
            padding: 6px 0;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .episode-btn:hover {
            background-color: #222;
            color: #fff;
            border-color: #444;
        }
        .episode-btn.active {
            background-color: #ff0000;
            color: #fff;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .section-title {
            font-size: 1.4rem;
            border-left: 4px solid #ff0000;
            padding-left: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .anime-card {
            background-color: #0e0e0e;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }
        .anime-card:hover {
            transform: translateY(-4px);
            border-color: #ff0000;
        }
        .card-image-wrapper {
            height: 240px; /* Adjusted height slightly to accommodate standard poster ratios */
            width: 100%;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222;
        }
        .card-details {
            padding: 10px;
        }
        .card-details h3 {
            font-size: 0.95rem;
            margin: 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .banner-title {
            display: block;
            color: #aaa;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .rating {
            font-size: 0.8rem;
            color: #ffcc00;
        }
        .loading-text {
            color: #888;
            grid-column: 1 / -1;
            text-align: center;
            padding: 4px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box" id="logoHomeBtn">ANIME</div>
        <input type="text" class="search-bar" id="searchEngineInput" placeholder="Search built-in titles...">
    </header>

    <div class="player-container">
        <div class="player-wrapper">
            <div id="placeholder-screen" class="player-placeholder">
                <p>No media stream targeting currently loaded.</p>
                <p style="font-size: 0.8rem; color: #666;">Select an anime below to generate the stream endpoints.</p>
            </div>
            <iframe id="video-embed-frame" style="display: none;" allowfullscreen></iframe>
        </div>
        
        <div class="player-details">
            <h2 id="statusMsg">Playing: Select an Anime</h2>
            <p id="subMsg">Streaming Client: Idle</p>
            
            <div class="episode-control-panel" id="episodeControlPanel">
                <div class="episode-panel-title">Select Episode</div>
                <div class="episode-grid" id="episodeButtonGrid"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="section-title" id="gridTitleDisplay">Popular Anime</div>
        <div id="trending-anime-grid" class="anime-grid">
            <div class="loading-text">Assembling engine configurations...</div>
        </div>
    </div>

    <script>
        const PUBLIC_API_URL = "https://jikan.moe";
        const gridContainer = document.getElementById("trending-anime-grid");

        async function assembleEngineConfigurations() {
            try {
                // Fetch dynamic entries from public REST API 
                const response = await fetch(PUBLIC_API_URL);
                
                if (!response.ok) {
                    throw new Error(`API Endpoint error: ${response.status}`);
                }
                
                const jsonResult = await response.json();
                const animeList = jsonResult.data;

                // Clear out static assembly engine text placeholder
                gridContainer.innerHTML = "";

                // Populate grid items dynamically
                animeList.forEach(anime => {
                    const card = document.createElement("div");
                    card.className = "anime-card";
                    
                    card.innerHTML = `
                        <div class="card-image-wrapper">
                            <img src="${anime.images.jpg.image_url}" alt="${anime.title}" style="width:100%; height:100%; object-fit:cover;">
                        </div>
                        <div class="card-details">
                            <span class="banner-title">${anime.type || 'TV'} (${anime.episodes || '?'})</span>
                            <h3>${anime.title}</h3>
                            <div class="rating">⭐ ${anime.score || 'N/A'}</div>
                        </div>
                    `;
                    
                    // Wire framework player state transformations on element clicks
                    card.addEventListener("click", () => {
                        document.getElementById("statusMsg").textContent = `Playing: ${anime.title}`;
                        document.getElementById("subMsg").textContent = `Streaming Client: Frame parsing initialized for entry ID ${anime.mal_id}`;
                        
                        // Stream pipeline mapping hooks go here
