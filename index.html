<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free</title>
    <style>
        /* GLOBAL RESET & THEME */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* HEADER BAR SETTINGS */
        header {
            background-color: #0d0d0d;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 2px solid #ff0000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-box {
            background-color: #ff0000;
            padding: 8px;
            border-radius: 5px;
            margin-right: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .search-container {
            flex-grow: 1;
            position: relative;
        }
        .search-container input {
            width: 100%;
            padding: 8px 12px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
        }

        /* INTEGRATED VIDEO PLAYER CONSOLE CONTAINER */
        .player-section {
            width: 100%;
            background-color: #050505;
            border-bottom: 1px solid #1a1a1a;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-wrapper {
            width: 90%;
            max-width: 800px;
            position: relative;
            padding-top: 56.25%; /* Fixed 16:9 ratio aspect */
            background-color: #0c0c0c;
            border: 2px solid #222;
            border-radius: 6px;
            overflow: hidden;
        }
        .player-wrapper iframe, .player-wrapper .player-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* PLAYER PLACEHOLDER GRAPHICS */
        .player-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #111 0%, #050505 100%);
            color: #666;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #222;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            margin-bottom: 15px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .player-details {
            width: 90%;
            max-width: 800px;
            padding: 10px 0 0 0;
            text-align: left;
        }
        .player-details h2 {
            font-size: 1.1rem;
            color: #ff0000;
            margin-bottom: 4px;
        }
        .player-details p {
            font-size: 0.85rem;
            color: #888;
        }

        /* MAIN CONTENT LAYOUT */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 4px solid #ff0000;
            padding-left: 10px;
        }

        /* CARDS GRID SYSTEM */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        /* INDIVIDUAL ANIME CARD */
        .anime-card {
            background-color: #0d0d0d;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
        }
        .anime-poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .poster-fallback-text {
            position: absolute;
            color: #ff0000;
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            padding: 10px;
        }
        .anime-card-info {
            padding: 10px;
        }
        .anime-card-info h3 {
            font-size: 0.85rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-card-info p {
            font-size: 0.75rem;
            color: #ff0000;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR HEADER -->
    <header>
        <div class="logo-box">AH</div>
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search Anime...">
        </div>
    </header>

    <!-- CORE INTEGRATED PLAYER CONSOLE -->
    <section class="player-section">
        <div class="player-wrapper" id="video-container">
            <div class="player-placeholder">
                <div class="spinner"></div>
                <p style="font-size: 0.9rem; font-weight: bold; color: #aaa;">Ready to Stream</p>
                <p style="font-size: 0.75rem; margin-top: 4px;">Tap a card below to load the streaming container</p>
            </div>
        </div>
        <div class="player-details">
            <h2 id="current-title">Playing: Welcome to Anime Heaven</h2>
            <p id="current-status">Streaming Client: Ready</p>
        </div>
    </section>

    <!-- TRENDING GRID LAYOUT SECTION -->
    <main class="container">
        <h2 class="section-title">Trending Anime</h2>
        <div class="anime-grid" id="trending-grid">
            
            <!-- SELECTION CARD 1: ONE PIECE -->
            <div class="anime-card" onclick="playStream('21', 'One Piece')">

                <div class="anime-card-info">
                    <h3>One Piece</h3>

                <div class="anime-card-info">

            <!-- SELECTION CARD 4: ATTACK ON TITAN -->
            <div class="anime-card" onclick="playStream('40028', 'Attack on Titan')">
                <div class="anime-poster-wrapper">
                    <div class="poster-fallback-text">AOT</div>
                </div>
                <div class="anime-card-info">
                    <h3>Attack on Titan</h3>
                    <p>★ 8.81</p>
                </div>
            </div>

        </div>
    </main>

    <!-- CONTROLLER LAYOUT SCRIPT -->
    <script>
        // Programmatically hot-swaps player layouts seamlessly when choosing a stream target
        function playStream(malId, title) {
            const container = document.getElementById('video-container');
            const currentTitle = document.getElementById('current-title');
            const currentStatus = document.getElementById('current-status');

            currentTitle.innerText = `Playing: ${title}`;
            currentStatus.innerText = `Streaming Client: Active (MAL ID: ${malId})`;
            
            // Open-access proxy endpoint configuration bypasses Vercel cross-domain restrictions
            const embedUrl = `https://vidsrc.xyz{malId}/1/1`;
            
            // Replaces the placeholder graphics with a secured responsive iframe element
            container.innerHTML = `
                <iframe 
                    src="${embedUrl}" 
                    style="position: absolute; top:0; left:0; width:100%; height:100%; border:none;" 
                    allowfullscreen 
                    scrolling="no"
                    allow="autoplay; encrypted-media; picture-in-picture">
                </iframe>
            `;
            
            // Scrolls view smoothly to the video screen layout on mobile displays
            document.querySelector('.player-section').scrollIntoView({ behavior: 'smooth' });
        }

        // Handles local filter actions for your search bar input element
        document.getElementById('search-bar').addEventListener('input', function(e) {
            const value = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.anime-card');
            
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
