<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free Anime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #050505; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 60px; }
        header { background-color: #0f0f0f; border-bottom: 2px solid #ff1a1a; display: flex; align-items: center; padding: 8px 12px; height: 56px; position: sticky; top: 0; z-index: 1000; }
        .logo-box { background-color: #d61c1c; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 4px; margin-right: 12px; cursor: pointer; }
        .logo-box svg { width: 28px; height: 28px; fill: #fff; }
        .search-wrapper { flex: 1; position: relative; max-width: 600px; display: flex; align-items: center; }
        .search-input { width: 100%; height: 36px; background-color: #1a1a1a; border: 1px solid #d61c1c; border-radius: 4px; color: #fff; padding: 0 40px 0 12px; font-size: 15px; }
        .collection-tabs { display: flex; background-color: #0f0f0f; border-bottom: 1px solid #222; margin-top: 2px; }
        .tab-btn { flex: 1; padding: 14px 5px; background: none; border: none; color: #aaa; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #fff; border-bottom-color: #ff1a1a; background-color: #151515; }
        #player-section { display: none; max-width: 800px; margin: 15px auto; background: #0f0f0f; padding: 8px; border-bottom: 3px solid #ff1a1a; }
        #player-section iframe { width: 100%; height: 400px; border: none; background: #000; }
        #now-playing-title { padding: 10px 5px; font-size: 16px; font-weight: bold; color: #fff; border-bottom: 1px solid #222; }
        .section-heading { background-color: #0f0f0f; padding: 12px; font-size: 18px; font-weight: 500; border-bottom: 1px solid #222; margin-top: 5px; text-transform: uppercase; border-left: 4px solid #ff1a1a; }
        .catalog-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; min-height: 200px; }
        .anime-row-card { background-color: #0f0f0f; padding: 12px; border-bottom: 1px solid #1a1a1a; display: flex; flex-direction: column; cursor: pointer; }
        .image-banner-wrapper { position: relative; width: 100%; height: 210px; overflow: hidden; border-radius: 4px; background: #222; border: 1px solid #222; }
        .rank-badge { position: absolute; top: 0; left: 0; background-color: #ff1a1a; color: #fff; font-weight: bold; font-size: 18px; padding: 6px 14px; }
        .action-plus { position: absolute; top: 10px; right: 10px; background-color: rgba(255, 26, 26, 0.9); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; }
        .card-details { padding: 12px 2px 4px 2px; }
        .primary-title { font-size: 17px; font-weight: bold; color: #fff; }
        .secondary-title { font-size: 14px; color: #888; margin-bottom: 8px; }
        .status-released { color: #ff1a1a; font-size: 14px; font-weight: bold; text-align: center; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background-color: #0f0f0f; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #666; display: flex; align-items: center; justify-content: center; width: 25%; height: 100%; cursor: pointer; }
        .nav-item.active { color: #ff1a1a; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        
        /* ONSCREEN DEBUGGER PANEL */
        #debug-panel { background: #3a0000; color: #ff9999; padding: 10px; font-family: monospace; font-size: 12px; border: 2px solid red; margin: 10px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <!-- VISUAL SCREEN LOGGER FOR MOBILE TESTING -->
    <div id="debug-panel"><strong>Debug Monitor:</strong> <span id="debug-text">No errors.</span></div>

    <header>
        <div class="logo-box" id="logo-nav-home">
            <svg viewBox="0 0 24 24"><path d="M12,2A9,9 0 0,0 3,11C3,14.03 4.53,16.7 6.87,18.26L6,21a1,1 0 0,0 1,1H17a1,1 0 0,0 1-1l-0.87-2.74C19.47,16.7 21,14.03 21,11A9,9 0 0,0 12,2M8,11A2,2 0 0,1 10,9A2,2 0 0,1 12,11A2,2 0 0,1 10,13A2,2 0 0,1 8,11M16,11A2,2 0 0,1 18,13A2,2 0 0,1 16,15A2,2 0 0,1 14,11A2,2 0 0,1 16,11M12,16C14.33,16 16.31,17.27 17,19H7C7.69,17.27 9.67,16 12,16Z"/></svg>
        </div>
        <div class="search-wrapper">
            <input type="text" id="search-box" class="search-input" placeholder="Search content...">
        </div>
    </header>

    <div id="player-section">
        <div id="now-playing-title">Loading Player...</div>
        <div id="video-frame-target"></div>
    </div>

    <div class="collection-tabs">
        <button class="tab-btn active" id="tab-schedule">Schedule</button>
        <button class="tab-btn" id="tab-trending">Trending</button>
        <button class="tab-btn" id="tab-movies">Movies</button>
        <button class="tab-btn" id="tab-watchlist">Watchlist</button>
    </div>

    <div class="section-heading" id="hub-title-label">Subbed Anime Schedule</div>
    <div class="catalog-container" id="anime-render-list"></div>

    <div class="bottom-nav">
        <div class="nav-item active" id="foot-nav-schedule"><svg viewBox="0 0 16 16"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5Z"/></svg></div>
        <div class="nav-item" id="foot-nav-trending"><svg viewBox="0 0 16 16"><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm3.51-11.857a.25.25 0 0 1 .184.417l-3.51 3.51a.25.25 0 0 1-.354 0l-1.51-1.51a.25.25 0 0 1 .354-.354l1.333 1.332 3.32-3.32a.25.25 0 0 1 .183-.075z"/></svg></div>
        <div class="nav-item" id="foot-nav-movies"><svg viewBox="0 0 16 16"><path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5V2z"/></svg></div>
    </div>

    <script>
        // Crash Prevention Logging Handler
        window.onerror = function(msg, url, line) {
            const panel = document.getElementById('debug-panel');
            const txt = document.getElementById('debug-text');
            if(panel && txt) {
                panel.style.display = "block";
                txt.innerText = msg + " on line " + line;
            }
            return false;
        };

        const animeDatabase = {
            schedule: [
                { title: "Kaiju No. 8", alternative: "Kaijuu 8-gou", id: "kaiju-no-8", embedId: "dQw4w9WgXcQ" },
                { title: "The Iceblade Sorcerer", alternative: "Hyouken no Majutsushi", id: "the-iceblade", embedId: "dQw4w9WgXcQ" },
                { title: "Demon Slayer: Hashira", alternative: "Kimetsu no Yaiba", id: "demon-slayer", embedId: "dQw4w9WgXcQ" }
            ],
            trending: [
                { title: "One Piece", alternative: "Wan Piisu", id: "one-piece", embedId: "dQw4w9WgXcQ" },
                { title: "Jujutsu Kaisen", alternative: "Jujutsu Kaisen", id: "jujutsu-kaisen", embedId: "dQw4w9WgXcQ" }
            ],
            movies: [
                { title: "Your Name", alternative: "Kimi no Na wa", id: "your-name", embedId: "dQw4w9WgXcQ" }
            ],
            watchlist: []
        };

        let currentCategory = 'schedule';

        const renderList = (category, filter = "") => {
            const container = document.getElementById('anime-render-list');
            if (!container) return;
            container.innerHTML = "";
            
            const items = (animeDatabase[category] || []).filter(item => 
                item.title.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (items.length === 0) {
                container.innerHTML = `<div style="padding:40px; text-align:center; color:#666;">No items found.</div>`;
                return;
            }

            items.forEach((anime, index) => {
                const card = document.createElement('div');
                card.className = 'anime-row-card';
                card.innerHTML = `
                    <div class="image-banner-wrapper">
                        <span class="rank-badge">#${index + 1}</span>
                        <div style="width:100%; height:100%; background:#161616; display:flex; align-items:center; justify-content:center; color:#ff1a1a; font-weight:bold;">
                            ${anime.title}
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="primary-title">${anime.title}</div>
                        <div class="secondary-title">${anime.alternative}</div>
                        <div class="status-released">AVAILABLE</div>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    const player = document.getElementById('player-section');
                    const title = document.getElementById('now-playing-title');
                    const target = document.getElementById('video-frame-target');
                    if(player && title && target) {
                        player.style.display = 'block';
                        title.innerText = anime.title;
                        target.innerHTML = `<iframe src="https://youtube.com{anime.embedId}"></iframe>`;
                    }
                });
                container.appendChild(card);
            });
        };
