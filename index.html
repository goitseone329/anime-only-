<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free</title>
    <style>
        /* GLOBAL RESET & THEME */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* HEADER BAR SETTINGS */
        header {
            background-color: #0d0d0d;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 2px solid #ff0000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-box {
            background-color: #ff0000;
            padding: 8px;
            border-radius: 5px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .logo-box svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        /* SEARCH BAR SYSTEM */
        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px 40px 10px 15px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #ff0000;
        }
        .search-icon-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .search-icon-btn svg {
            width: 16px;
            height: 16px;
            fill: #ff0000;
        }

        /* INTEGRATED VIDEO PLAYER CONSOLE CONTAINER */
        .player-section {
            width: 100%;
            background-color: #050505;
            border-bottom: 1px solid #1a1a1a;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-wrapper {
            width: 90%;
            max-width: 800px;
            position: relative;
            padding-top: 56.25%; /* Fixed 16:9 ratio layout */
            background-color: #0c0c0c;
            border: 2px solid #222;
            border-radius: 6px;
            overflow: hidden;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .player-details {
            width: 90%;
            max-width: 800px;
            padding: 10px 0 0 0;
            text-align: left;
        }
        .player-details h2 {
            font-size: 1.1rem;
            color: #ff0000;
            margin-bottom: 4px;
        }
        .player-details p {
            font-size: 0.85rem;
            color: #888;
        }

        /* MAIN CONTENT LAYOUT */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 15px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 4px solid #ff0000;
            padding-left: 10px;
        }

        /* CARDS GRID SYSTEM */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        /* INDIVIDUAL ANIME CARD */
        .anime-card {
            background-color: #0d0d0d;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #222;
            cursor: pointer;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
            box-shadow: 0 5px 15px rgba(250, 0, 0, 0.2);
        }
        .anime-poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .anime-poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .anime-card-info {
            padding: 10px;
        }
        .anime-card-info h3 {
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-card-info p {
            font-size: 0.75rem;
            color: #ff0000;
        }

        /* ADSTERRA PLACEHOLDER BLOCKS */
        .ad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            width: 100%;
            min-height: 90px;
        }
    </style>
</head>
<body>

    <!-- ADSTERRA SLOT 1: POPUNDER CODE PLACEHOLDER -->

    <!-- NAVIGATION BAR HEADER -->
    <header>
        <div class="logo-box" onclick="window.location.reload();">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-5h2v5zm0-6h-2V7h2v3z"/>
            </svg>
        </div>
        <div class="search-wrapper">
            <input type="text" class="search-input" id="anime-search" placeholder="Search Anime...">
            <button class="search-icon-btn" id="search-button">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- INTEGRATED CONSOLE PLAYER SECTION -->
    <section class="player-section">
        <div class="player-wrapper">
            <!-- FIXED STARTUP URL: Formatted correctly to completely clear the VidSrc notice block -->
            <iframe id="video-stream" src="https://vidsrc.sh" allowfullscreen></iframe>
        </div>
        <div class="player-details">
            <h2>Playing: Naruto</h2>
            <p>Streaming Client: Active</p>
        </div>
    </section>

    <!-- MAIN DISPLAY AREA -->
    <main class="container">
        <div class="section-title">Trending Anime</div>
        <div class="anime-grid" id="trending-grid">
            <!-- Cards rendered dynamically on initialization -->
        </div>
    </main>

    <!-- JIKAN & TMDB CONVERSION DATA GENERATOR CONTEXT SCRIPT -->
    <script>
        const JIKAN_BASE_URL = 'https://jikan.moe';
        const FALLBACK_IMAGE = 'data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231a1a1a"/><text x="50" y="55" font-family="Arial" font-size="10" fill="%23888" text-anchor="middle">No Poster</text></svg>';

        // 1. POPULATE LANDING GRID DYNAMICALLY
        async function fetchTrendingCatalog() {
            const container = document.getElementById('trending-grid');
            if (!container) return;

            try {
                const res = await fetch(`${JIKAN_BASE_URL}/top/anime?filter=bypopularity&limit=12`);
                const parsed = await res.json();
                const animeData = parsed.data;

                container.innerHTML = ''; 

                animeData.forEach(anime => {
                    const thumbnail = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || FALLBACK_IMAGE;
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    
                    // Pass type to separate movies from series mapping routines
                    card.onclick = () => launchVideoPlayer(anime.mal_id, anime.title, anime.type);

                    card.innerHTML = `
                        <div class="anime-poster-wrapper">
                            <img src="${thumbnail}" alt="${anime.title}" loading="lazy">
                        </div>
                        <div class="anime-card-info">
                            <h3>${anime.title}</h3>
                            <p>⭐ Score: ${anime.score || 'N/A'}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Failed to acquire trending resources:", err);
                container.innerHTML = `<p style="padding: 20px; color: #ff0000; width: 100%; text-align: center;">Unable to pull down catalog.</p>`;
            }
        }

        // 2. SEARCH HANDLER COMPONENT
        async function executeSearchAction() {
            const input = document.getElementById('anime-search');
            const container = document.getElementById('trending-grid');
            const heading = document.querySelector('.section-title');

            if (!input || !container) return;
            const phrase = input.value.trim();
            if (!phrase) return;

            if (heading) heading.textContent = `Search Results for: "${phrase}"`;
