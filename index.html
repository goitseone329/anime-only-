<!DOCTYPE html>
<html lang="en">

    <style>
        :root {
            --bg: #0b0b0c;
            --panel: #141416;
            --panel-light: #1c1c21;
            --blue: #2563eb;
            --blue-light: #3b82f6;
            --gold: #ffb703;
            --text: #ffffff;
            --muted: #7a7a85;
            --sub-badge: #00b4d8;
            --dub-badge: #9b5de5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding-top: 70px;
        }
        header {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 70px;
            background: #000000;
            border-bottom: 2px solid var(--blue);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 1000;
        }
        .brand { font-size: 20px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .brand span { background: var(--blue); color: #fff; padding: 2px 6px; border-radius: 4px; margin-left: 2px; }
        .search-container { flex: 1; max-width: 450px; margin: 0 16px; }
        .search-bar { width: 100%; padding: 10px 16px; background: var(--panel-light); border: 1px solid #292933; border-radius: 20px; color: #fff; outline: none; }
        .search-bar:focus { border-color: var(--blue-light); }
        .pro-trigger { background: linear-gradient(45deg, var(--gold), #ff8500); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .ad-zone { background: #101014; border: 1px dashed #3a3a4f; color: var(--muted); text-align: center; padding: 15px; margin: 16px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .ad-zone::before { content: "ADVERTISEMENT"; display: block; color: var(--blue-light); font-size: 9px; margin-bottom: 4px; }
        .nav-ribbon { display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto; }
        .ribbon-btn { background: var(--panel); color: var(--muted); border: 1px solid #23232a; padding: 8px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .ribbon-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
        main { padding: 0 16px 40px; }
        .shelf-container { margin-bottom: 30px; }
        .shelf-title { font-size: 18px; font-weight: 800; border-left: 4px solid var(--blue); padding-left: 10px; margin-bottom: 16px; text-transform: uppercase; }
        .catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        @media (min-width: 768px) { .catalog-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        .anime-card { background: var(--panel); border: 1px solid #1f1f26; border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; }
        .card-cover { height: 160px; background: #252533; display: flex; align-items: center; justify-content: center; font-size: 36px; }
        .stream-tag { position: absolute; top: 130px; left: 6px; padding: 2px 6px; font-size: 10px; font-weight: bold; border-radius: 3px; color: #fff; }
        .tag-sub { background: var(--sub-badge); }
        .tag-dub { background: var(--dub-badge); }
        .card-info { padding: 10px; }
        .card-info h3 { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hidden { display: none !important; }
        #theaterView { background: var(--panel); border-radius: 8px; padding: 16px; border: 1px solid #23232a; }
        .back-link { color: var(--blue-light); font-size: 13px; font-weight: bold; cursor: pointer; display: inline-block; margin-bottom: 14px; }
        .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden; }
        video { width: 100%; height: 100%; }
        .control-ribbon { display: flex; justify-content: space-between; background: var(--panel-light); padding: 12px; margin: 12px 0; border-radius: 6px; }
        .w2g-anchor { color: var(--blue-light); font-weight: bold; text-decoration: none; }
        .episode-deck { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .ep-node { background: var(--panel-light); color: #fff; border: 1px solid #292933; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .ep-node.active { background: var(--blue); border-color: var(--blue); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .modal-card { background: var(--panel); padding: 24px; border-radius: 12px; text-align: center; max-width: 380px; width: 100%; }
        .checkout-btn { background: var(--blue); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; margin-top: 16px; font-weight: bold; cursor: pointer; }
        .cancel-btn { background: transparent; color: var(--muted); border: none; margin-top: 12px; cursor: pointer; }
    </style>
</head>
