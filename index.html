<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeOnly - Streaming Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #0d0202; /* Ultra dark red-tinted black */
            color: #e5e5e5;
        }
        /* Navigation Header */
        header {
            background-color: #1a0505;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff0022;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            color: #ff0022;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 34, 0.5);
            text-decoration: none;
        }
        .search-container {
            flex-grow: 1;
            max-width: 400px;
        }
        .search-box {
            width: 100%;
            padding: 8px 15px;
            background-color: #0d0202;
            border: 1px solid #ff0022;
            border-radius: 20px;
            color: #fff;
            outline: none;
        }
        .nav-links a {
            color: #b3b3b3;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .nav-links a:hover { color: #ff0022; }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        
        .ad-space {
            background-color: #1a0909;
            border: 1px dashed #ff0022;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 6px;
            color: #802020;
            font-size: 0.85rem;
        }

        /* Catalog Grid Home Panel */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .anime-card {
            background-color: #1a0505;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #2d0c0c;
            cursor: pointer;
        }
        .anime-card:hover { border-color: #ff0022; }
        .poster-placeholder {
            width: 100%;
            height: 230px;
            background-size: cover !important;
        }
        .anime-details { padding: 12px; }

        /* Dynamic Details Screen Panels */
        .hidden { display: none; }
        .back-btn {
            background: none;
            border: 1px solid #ff0022;
            color: #ff0022;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .details-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .details-title {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 15px;
        }
        .tag-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tag {
            background-color: #ff0022;
            color: #fff;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .meta-info {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .meta-info span { color: #ff0022; font-weight: bold; }
        .action-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .btn-action {
            background-color: #ff0022;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,0,34,0.3);
        }
        
        /* Interactive Countdown Timer Dashboard */
        .countdown-box {
            border-top: 1px solid #2d0c0c;
            border-bottom: 1px solid #2d0c0c;
            padding: 20px 0;
            text-align: center;
            margin: 25px 0;
        }
        .countdown-box h3 {
            color: #b3b3b3;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: normal;
        }
        .timer-display {
            color: #ff0022;
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Responsive Episode Grid Layout */
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .episode-card {
            background-color: #0d0202;
            border: 1px solid #ff0022;
            border-radius: 6px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
        }
        .episode-card div { font-size: 0.75rem; color: #777; margin-top: 4px; }
        .episode-card strong { font-size: 1.3rem; color: #fff; display: block; }
        
        .episode-card-wide {
            grid-column: span 1.5;
        }

        .section-heading {
            color: #fff;
            margin: 30px 0 15px 0;
            border-left: 4px solid #ff0022;
            padding-left: 10px;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <span class="logo-icon"></span> 
            <a href="#" class="logo" onclick="showHome()">AnimeOnly</a>
        </div>
        <div class="search-container">
            <input type="text" id="animeSearch" class="search-box" placeholder="Search anime titles..." onkeyup="searchAnime()">
        </div>
        <nav class="nav-links">
            <a onclick="showHome()">Home</a>
            <a href="#">Trending</a>
        </nav>
    </header>

    <div class="container">
        <div class="ad-space" id="monetization-zone">
            ADVERTISEMENT SPACE (MONETIZATION ZONE)
        </div>

        <!-- HOME PAGE SCREEN PANEL -->
        <div id="home-view">
            <h2 class="section-heading" id="section-title">Trending Releases</h2>
            <div class="anime-grid" id="anime-grid-container">
                <p style="padding: 20px; color: #a6a6a6;">Loading catalog database...</p>
            </div>
        </div>

        <!-- DETAILED ANIME WATCH VIEW SCREEN (Matching layout context reference style) -->
        <div id="details-view" class="hidden">
            <button class="back-btn" onclick="showHome()">← Back to Catalog</button>
            
            <div class="details-header">
                <div class="details-title" id="det-title">Anime Title</div>
                
                <div class="tag-container" id="det-genres">
                    <!-- Dynamic genre badges loaded here -->
                </div>

                <div class="meta-info">Episodes: <span id="det-episodes">5+</span></div>
                <div class="meta-info">Year: <span id="det-year">2026</span></div>
                <div class="meta-info">Score: <span id="det-score">?</span></div>

                <div class="action-container">
                    <button class="btn-action">Bookmark +</button>
                    <button class="btn-action">Rate +</button>
                </div>
            </div>

            <!-- Dynamic Countdown Display Block -->
            <div class="countdown-box">
                <h3 id="countdown-label">Countdown to Next Episode</h3>
                <div class="timer-display" id="timer-clock">6 Days 21 Hours 51 Min</div>
            </div>

            <h3 class="section-heading">Available Episodes</h3>
            <div class="episode-grid" id="episode-container">
                <!-- Generated clickable episode selector items block -->
            </div>

            <h3 class="section-heading">Similar Shows</h3>
            <div class="anime-grid" id="similar-container">
                <!-- Similar shows recommendations items block -->
            </div>
        </div>
    </div>

    <script>
        let countdownInterval;

        // Initialize Home Dashboard view
        async function loadTrendingAnime() {
            const grid = document.getElementById('anime-grid-container');
            try {
                const response = await fetch('https://jikan.moe');
                const data = await response.json();
                renderCards(data.data, grid);
            } catch (error) {
                grid.innerHTML = '<p style="padding: 20px; color: #ff0022;">Failed to load live catalog listings.</p>';
            }
        }

        // Live Search Filter Integration Panel
        async function searchAnime() {
            const query = document.getElementById('animeSearch').value.trim();
            const grid = document.getElementById('anime-grid-container');
            if (query.length < 3) { if (query.length === 0) loadTrendingAnime(); return; }
            try {
                const response = await fetch(`https://jikan.moe{encodeURIComponent(query)}&limit=12`);
                const data = await response.json();
                renderCards(data.data, grid);
            } catch (error) { console.error(error); }
        }

        // Render generic home cards list block
        function renderCards(list, container) {
            container.innerHTML = '';
