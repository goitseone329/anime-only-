<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Streaming Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #111; color: #fff; font-family: sans-serif; padding: 20px; }
        h1, h2 { text-align: center; margin-bottom: 20px; color: #ff3e3e; }
        
        /* Search Box Layout */
        .search-container { max-width: 500px; margin: 0 auto 30px auto; display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; }
        .search-input:focus { border-color: #ff3e3e; outline: none; }
        .search-button { padding: 12px 24px; background: #ff3e3e; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .search-button:hover { background: #cc3232; }

        /* Video Section UI */
        #player-container { display: none; max-width: 800px; margin: 0 auto 40px auto; background: #000; padding: 10px; border-radius: 8px; border: 2px solid #ff3e3e; }
        iframe { width: 100%; height: 450px; border: none; border-radius: 4px; }
        
        /* Grid UI for Anime List */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #222; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border 0.2s; border: 1px solid #333; }
        .card:hover { transform: scale(1.05); border-color: #ff3e3e; }
        .card img { width: 100%; height: 260px; object-fit: cover; display: block; }
        .card-info { padding: 10px; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Anime Hub Marketplace</h1>

    <!-- REAL-TIME SEARCH BOX BAR -->
    <div class="search-container">
        <input type="text" id="search-box" class="search-input" placeholder="Search thousands of anime or movies...">
        <button id="search-btn" class="search-button">Search</button>
    </div>

    <!-- 1. DYNAMIC VIDEO PLAYER INJECTOR -->
    <div id="player-container">
        <h2 id="now-playing">Loading Player...</h2>
        <div id="video-wrapper"></div>
    </div>

    <h2 id="catalog-title">Trending Anime Catalog</h2>
    
    <!-- 2. AUTOMATIC GRID CATALOG -->
    <div class="grid" id="anime-grid"></div>

    <script>
        const STREAM_PROVIDER_URL = "https://consumet.org";

        // Step 1: Automatically fetch trending listing configurations from Jikan API
        async function loadTrendingCatalog() {
            document.getElementById('catalog-title').innerText = "Trending Anime Catalog";
            try {
                const response = await fetch('https://jikan.moe');
                const data = await response.json();
                renderGrid(data.data);
            } catch (error) {
                console.error("Failed to load catalog data:", error);
            }
        }

        // Step 2: Global Database Search Action Logic
        async function searchAnimeCatalog() {
            const query = document.getElementById('search-box').value.trim();
            if (!query) return; // Ignore blank spaces

            document.getElementById('catalog-title').innerText = `Search Results for: "${query}"`;
            const grid = document.getElementById('anime-grid');
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Searching global library database...</p>";

            try {
                // Call global search query parameter on Jikan core framework
                const response = await fetch(`https://jikan.moe{encodeURIComponent(query)}&limit=24`);
                const data = await response.json();
                renderGrid(data.data);
            } catch (error) {
                console.error("Search endpoint routing exception error:", error);
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#ff3e3e;'>Error fetching search configurations.</p>";
            }
        }

        // Helper Function to Render Cards on UI view grid layout boards
        function renderGrid(animeList) {
            const grid = document.getElementById('anime-grid');
            grid.innerHTML = ''; 

            if (!animeList || animeList.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>No matching titles located. Try another title.</p>";
                return;
            }

            animeList.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'card';
                const customSearchId = anime.title.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, '-');
                
                card.innerHTML = `
                    <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
                    <div class="card-info">${anime.title}</div>
                `;
                
                card.onclick = () => fetchAndPlayEpisode(customSearchId, anime.title);
                grid.appendChild(card);
            });
        }

        // Step 3: Fetch video streaming resources
        async function fetchAndPlayEpisode(animeId, title) {
            const container = document.getElementById('player-container');
            const heading = document.getElementById('now-playing');
            const wrapper = document.getElementById('video-wrapper');
            
            heading.innerText = `Streaming: ${title} (Episode 1)`;
            container.style.display = "block";
            wrapper.innerHTML = "<p style='text-align:center; padding: 20px;'>Resolving streaming links...</p>";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const targetWatchUrl = `${STREAM_PROVIDER_URL}/watch/${animeId}-episode-1`;
                const response = await fetch(targetWatchUrl);
                const streamData = await response.json();

                if (streamData && streamData.headers && streamData.headers.Referer) {
                    wrapper.innerHTML = `<iframe src="${streamData.headers.Referer}" allowfullscreen></iframe>`;
                } else {
                    wrapper.innerHTML = `<iframe src="https://vidsrc.to{animeId}/1/1" allowfullscreen></iframe>`;
                }
            } catch (err) {
                console.warn("Falling back to backup structural player link:", err);
                wrapper.innerHTML = `<iframe src="https://vidsrc.to{animeId}/1/1" allowfullscreen></iframe>`;
            }
        }

        // Add Search Event Listeners for click and keyboard 'Enter' keys
        document.getElementById('search-btn').addEventListener('click', searchAnimeCatalog);
        document.getElementById('search-box').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchAnimeCatalog();
        });

        // Initialize default view catalog options
        loadTrendingCatalog();
    </script>
</body>
</html>
