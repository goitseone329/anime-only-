    <!-- Main Application Script -->
    <script>
        // 1. Data Store: Add your own anime streaming catalog items here
        const animeCatalog = [
            {
                id: "naruto-shippuden",
                title: "Naruto Shippuden",
                type: "ongoing",
                tag: "SUB",
                tagClass: "tag-sub",
                episodes: [
                    { title: "Episode 1", url: "https://w3schools.com" },
                    { title: "Episode 2", url: "https://w3schools.com" }
                ]
            },
            {
                id: "demon-slayer",
                title: "Demon Slayer",
                type: "ongoing",
                tag: "DUB",
                tagClass: "tag-dub",
                episodes: [
                    { title: "Episode 1", url: "https://w3schools.com" }
                ]
            },
            {
                id: "your-name",
                title: "Your Name",
                type: "movies",
                tag: "SUB",
                tagClass: "tag-sub",
                episodes: [
                    { title: "Full Movie", url: "https://w3schools.com" }
                ]
            }
        ];

        let watchlist = JSON.parse(localStorage.getItem('animeWatchlist')) || [];
        let currentAnime = null;

        // 2. DOM Elements
        const latestGrid = document.getElementById('latestGrid');
        const popularGrid = document.getElementById('popularGrid');
        const shelfRowA = document.getElementById('shelfRowA');
        const shelfRowB = document.getElementById('shelfRowB');
        const adSlotA = document.getElementById('adSlotA');
        const adSlotB = document.getElementById('adSlotB');
        const theaterView = document.getElementById('theaterView');
        const searchBar = document.getElementById('searchBar');
        
        // Video View Elements
        const videoPlayer = document.getElementById('videoCorePlayer');
        const mediaTitle = document.getElementById('mediaTitle');
        const nodeEpisodeGrid = document.getElementById('nodeEpisodeGrid');
        const btnBack = document.getElementById('btnBack');
        const btnSaveFavorite = document.getElementById('btnSaveFavorite');
        
        // Modal & Ribbon Elements
        const billingModal = document.getElementById('billingModal');
        const proBtn = document.getElementById('proBtn');
        const btnCancelPaywall = document.getElementById('btnCancelPaywall');
        const btnConfirmPurchase = document.getElementById('btnConfirmPurchase');
        const logoHome = document.getElementById('logoHome');

        // 3. Render Cards Function
        function renderGrid(items, targetGrid) {
            targetGrid.innerHTML = '';
            if (items.length === 0) {
                targetGrid.innerHTML = '<p style="color: var(--muted); padding: 10px;">No entries found.</p>';
                return;
            }
            
            items.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="card-cover">📺
                        <span class="stream-tag ${anime.tagClass}">${anime.tag}</span>
                    </div>
                    <div class="card-info">
                        <h3>${anime.title}</h3>
                        <p>${anime.episodes.length} ${anime.episodes.length === 1 ? 'Episode' : 'Episodes'}</p>
                    </div>
                `;
                card.addEventListener('click', () => openTheater(anime));
                targetGrid.appendChild(card);
            });
        }

        function initCatalog(filter = 'all', searchQuery = '') {
            let filtered = animeCatalog;

            // Apply Navigation Filters
            if (filter !== 'all') {
                if (filter === 'watchlist') {
                    filtered = animeCatalog.filter(item => watchlist.includes(item.id));
                } else {
                    filtered = animeCatalog.filter(item => item.type === filter);
                }
            }

            // Apply Search Query
            if (searchQuery.trim() !== '') {
                filtered = filtered.filter(item => item.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            // Populate both shelves for visual balance
            renderGrid(filtered, latestGrid);
            renderGrid(filtered.reverse(), popularGrid); // Simulates different sorting algorithms
        }

        // 4. Theater View Navigation & Video Operations
        function openTheater(anime) {
            currentAnime = anime;
            
            // Toggle Layout Visibility
            shelfRowA.classList.add('hidden');
            shelfRowB.classList.add('hidden');
            adSlotA.classList.add('hidden');
            adSlotB.classList.add('hidden');
            theaterView.classList.remove('hidden');
            
            // Set Titles & Media Elements
            mediaTitle.textContent = anime.title;
            updateFavoriteButtonState(anime.id);
            
            // Render Episode Nodes
            nodeEpisodeGrid.innerHTML = '';
            anime.episodes.forEach((ep, index) => {
                const btn = document.createElement('button');
                btn.className = `ep-node ${index === 0 ? 'active' : ''}`;
                btn.textContent = ep.title;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.ep-node').forEach(n => n.classList.remove('active'));
                    btn.classList.add('active');
                    playVideo(ep.url);
                });
                nodeEpisodeGrid.appendChild(btn);
            });

            // Start playing the first episode by default
            if (anime.episodes.length > 0) {
                playVideo(anime.episodes[0].url);
            }
        }

        function playVideo(url) {
            videoPlayer.src = url;
            videoPlayer.load();
            videoPlayer.play().catch(err => console.log("Autoplay blocked or stream pending initialization."));
        }

        function closeTheater() {
            videoPlayer.pause();
            videoPlayer.src = '';
            theaterView.classList.add('hidden');
            
            shelfRowA.classList.remove('hidden');
            shelfRowB.classList.remove('hidden');
            adSlotA.classList.remove('hidden');
            adSlotB.classList.remove('hidden');
        }

        // 5. Watchlist System Logic
        function updateFavoriteButtonState(id) {
            if (watchlist.includes(id)) {
                btnSaveFavorite.textContent = '💔 Remove from List';
                btnSaveFavorite.style.background = '#e63946';
            } else {
                btnSaveFavorite.textContent = '❤ Add to List';
                btnSaveFavorite.style.background = 'var(--panel)';
            }
        }

        btnSaveFavorite.addEventListener('click', () => {
            if (!currentAnime) return;
            const index = watchlist.indexOf(currentAnime.id);
            if (index > -1) {
                watchlist.splice(index, 1);
            } else {
                watchlist.push(currentAnime.id);
            }
            localStorage.setItem('animeWatchlist', JSON.stringify(watchlist));
            updateFavoriteButtonState(currentAnime.id);
        });

        // 6. Navigation Ribbon Engine
        document.querySelectorAll('.ribbon-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                // Ensure we handle target filtering only if it has the attribute
                if (!button.hasAttribute('data-filter')) return;
                
                document.querySelectorAll('.ribbon-btn').forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                
                closeTheater();
                initCatalog(button.getAttribute('data-filter'), searchBar.value);
            });
        });

        // 7. Event Binding Infrastructure
        searchBar.addEventListener('input', (e) => {
            const activeRibbon = document.querySelector('.ribbon-btn.active');
            const activeFilter = activeRibbon ? activeRibbon.getAttribute('data-filter') : 'all';
            initCatalog(activeFilter, e.target.value);
        });

        btnBack.addEventListener('click', closeTheater);
        logoHome.addEventListener('click', () => {
            closeTheater();
            searchBar.value = '';
            document.querySelector('[data-filter="all"]').click();
        });

        // Paywall Interstitials
        proBtn.addEventListener('click', () => billingModal.classList.remove('hidden'));
        btnCancelPaywall.addEventListener('click', () => billingModal.classList.add('hidden'));
        btnConfirmPurchase.addEventListener('click', () => {
            alert("Thank you for upgrading! Premium features unlocked.");
            billingModal.classList.add('hidden');
        });

        // Initial App Mount
        initCatalog();
    </script>
</body>
</html>
