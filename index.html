<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeOnly - Streaming Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #0d0202; /* Ultra dark red-tinted black */
            color: #e5e5e5;
        }
        /* Top Navigation Header */
        header {
            background-color: #1a0505;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff0022; /* Vibrant red accent */
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            color: #ff0022;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 34, 0.5);
            text-decoration: none;
        }
        /* Placeholder for a Ghost Rider / Skull themed logo graphic later */
        .logo-icon {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ff5500, #ff0022);
            border-radius: 50%;
            display: inline-block;
        }
        /* Search Box styling */
        .search-container {
            flex-grow: 1;
            max-width: 400px;
            margin: 0 10px;
        }
        .search-box {
            width: 100%;
            padding: 8px 15px;
            background-color: #0d0202;
            border: 1px solid #ff0022;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }
        .search-box::placeholder {
            color: #777;
        }
        .nav-links a {
            color: #b3b3b3;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
        }
        .nav-links a:hover {
            color: #ff0022;
        }
        /* Main Container */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }
        /* Monetization / Ad Placement Banner Holder */
        .ad-space {
            background-color: #1a0909;
            border: 1px dashed #ff0022;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 6px;
            color: #802020;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        /* Content Catalog Grid */
        h2 {
            color: #fff;
            margin-bottom: 20px;
            border-left: 4px solid #ff0022;
            padding-left: 10px;
        }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .anime-card {
            background-color: #1a0505;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #2d0c0c;
        }
        .anime-card:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(255, 0, 34, 0.3);
            border-color: #ff0022;
        }
        .poster-placeholder {
            width: 100%;
            height: 230px;
            background-color: #2d0c0c;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff0022;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .anime-details {
            padding: 12px;
        }
        .anime-details h3 {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-details p {
            font-size: 0.8rem;
            color: #a6a6a6;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <span class="logo-icon"></span> 
            <a href="#" class="logo">AnimeOnly</a>
        </div>
        
        <!-- Live Title Search Box integration -->
        <div class="search-container">
            <input type="text" id="animeSearch" class="search-box" placeholder="Search anime titles..." onkeyup="searchAnime()">
        </div>

        <nav class="nav-links">
            <a href="#" onclick="loadTrendingAnime()">Home</a>
            <a href="#">Trending</a>
            <a href="#">Movies</a>
        </nav>
    </header>

    <div class="container">
        <!-- Placeholder for pop-ads / display integration -->
        <div class="ad-space" id="monetization-zone">
            ADVERTISEMENT SPACE (MONETIZATION ZONE)
            <!-- Future PopAds network script code can be placed inside here safely -->
        </div>

        <h2 id="section-title">Trending Releases</h2>
        
        <!-- Fixed layout container ID linked directly to script below -->
        <div class="anime-grid" id="anime-grid-container">
            <p style="padding: 20px; color: #a6a6a6;">Loading latest anime updates...</p>
        </div>
    </div>

    <script>
        // Global storage for anime data results to enable instant filtering
        let currentAnimeList = [];

        // Fetch top trending anime automatically from public MyAnimeList API
        async function loadTrendingAnime() {
            const grid = document.getElementById('anime-grid-container');
            const heading = document.getElementById('section-title');
            if(!grid) return;

            heading.innerText = "Trending Releases";
            grid.innerHTML = '<p style="padding: 20px; color: #a6a6a6;">Loading latest anime updates...</p>';

            try {
                const response = await fetch('https://jikan.moe');
                const data = await response.json();
                
                currentAnimeList = data.data;
                renderCards(currentAnimeList);
            } catch (error) {
                console.error('Error fetching live anime data:', error);
                grid.innerHTML = '<p style="padding: 20px; color: #ff0022;">Failed to load live data. Try refreshing!</p>';
            }
        }

        // Search algorithm to handle input query changes dynamically
        async function searchAnime() {
            const query = document.getElementById('animeSearch').value.trim();
            const grid = document.getElementById('anime-grid-container');
            const heading = document.getElementById('section-title');
            
            if (query.length < 3) {
                if (query.length === 0) {
                    loadTrendingAnime();
                }
                return;
            }

            heading.innerText = `Search Results for "${query}"`;
            grid.innerHTML = '<p style="padding: 20px; color: #a6a6a6;">Searching database...</p>';

            try {
                const response = await fetch(`https://jikan.moe{encodeURIComponent(query)}&limit=12`);
                const data = await response.json();
                renderCards(data.data);
            } catch (error) {
                console.error('Error searching anime:', error);
            }
        }

        // Helper framework script to inject generated cards into the DOM
        function renderCards(list) {
            const grid = document.getElementById('anime-grid-container');
            grid.innerHTML = '';

            if(!list || list.length === 0) {
                grid.innerHTML = '<p style="padding: 20px; color: #a6a6a6;">No matching anime titles found.</p>';
                return;
            }

            list.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="poster-placeholder" style="background: url('${anime.images.jpg.image_url}') no-repeat center/cover; height: 230px; font-size:0;">
                        ${anime.title}
                    </div>
                    <div class="anime-details">
                        <h3>${anime.title}</h3>
                        <p>Episodes: ${anime.episodes || 'Ongoing'}</p>
                        <p style="font-size: 0.75rem; color: #ff0022; margin-top: 5px;">★ ${anime.score || 'N/A'}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Initialize execution setup right when site loads up
        window.onload = loadTrendingAnime;
    </script>

</body>
</html>
