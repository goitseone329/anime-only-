<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <!-- Font Awesome for clean interface icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Base Reset & Design Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --primary-red: #e50914;
            --text-light: #ffffff;
            --text-gray: #c5c6c7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* Header & Navigation Layout */
        header {
            background-color: #000000;
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--primary-red);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .logo span {
            color: var(--text-light);
        }

        /* Search input bar styling matching your layout */
        .search-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1.5rem;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 25px;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
        }

        /* Main Workspace Container Layout */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            border-left: 5px solid var(--primary-red);
            padding-left: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        /* High-density grid for quick scanning like Anime Heaven */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border: 1px solid #2d3748;
            position: relative;
        }

        .anime-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
            border-color: var(--primary-red);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%; /* Perfect 1:1.4 scale dimension for posters */
            background-color: #121212;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Badges overlaying the poster graphics */
        .status-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background-color: rgba(0, 0, 0, 0.8);
            border-left: 3px solid var(--primary-red);
            color: #ffffff;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 2px;
        }

        .ep-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background-color: var(--primary-red);
            color: #ffffff;
            padding: 0.1rem 0.5rem;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 2px;
        }

        .anime-info {
            padding: 0.8rem;
        }

        .anime-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-light);
        }

        /* Video Streaming Pop-up Overlay Setup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            border: 2px solid var(--primary-red);
            overflow: hidden;
            position: relative;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Fixed widescreen 16:9 box container window */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .close-modal {
            position: absolute;
            top: -45px;
            right: 0;
            color: white;
            font-size: 2.2rem;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
        }

        /* Responsive Breakpoint Scalers for Android Screen Displays */
        @media (max-width: 480px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
                gap: 0.8rem;
            }
            .section-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
