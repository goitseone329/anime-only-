<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <style>
        :root {
            --bg: #0b0b0f;
            --panel: #17171f;
            --red: #ef233c;
            --gold: #ffb703;
            --text: #f7f7fb;
            --muted: #aaaab8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }
        header {
            background: #111116;
            border-bottom: 1px solid #292933;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: var(--red);
            font-size: 23px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin: 0;
        }
        .logo span { color: white; }
        .go-pro-btn {
            background: linear-gradient(45deg, var(--gold), #ff8500);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .search {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #292933;
            background: #1c1c24;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .filter-row {
            display: flex;
            gap: 8px;
            padding: 16px;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #1c1c24;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: #1c1c24;
            color: var(--text);
            border: 1px solid #292933;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
        }
        .ad-banner {
            background: #1a1a24;
            border: 2px dashed #3a3a4f;
            color: var(--muted);
            text-align: center;
            padding: 20px;
            margin: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }
        main { padding: 16px; }
        .section-title { margin: 8px 0 20px; font-size: 24px; font-weight: bold; }
        .catalog {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .anime-card {
            background: var(--panel);
            border: 1px solid #242430;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .watchlist-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(239, 35, 60, 0.9);
            color: white;
            padding: 4px 6px;
            border-radius: 5px;
            font-size: 11px;
            z-index: 2;
        }
        .poster-placeholder {
            height: 180px;
            background: #252538;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .card-info { padding: 10px; }
        .card-info h3 { font-size: 14px; margin: 0 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-info p { color: var(--muted); font-size: 12px; margin: 0; }
        .hidden { display: none !important; }
        
        #watchView { background: var(--panel); border: 1px solid #242430; border-radius: 12px; padding: 16px; }
        .back-btn { background: #242430; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 16px; }
        .action-tray { margin-bottom: 15px; }
        .watchlist-btn { background: var(--red); color: white; border: 0; border-radius: 7px; padding: 11px 14px; font-weight: bold; cursor: pointer; }
        .watchlist-btn.in-list { background: #30303b; }
        .player { width: 100%; background: black; border-radius: 8px; overflow: hidden; margin: 12px 0; }
        video { width: 100%; display: block; }
        
        .player-toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            background: #111116;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #292933;
        }
        .w2g-link { color: #ef233c; text-decoration: none; font-weight: bold; font-size: 14px; }
        .toolbar-right { display: flex; align-items: center; gap: 10px; }
        .nav-arrow { background: #252530; border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .episode-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .episode-btn { background: #242430; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .episode-btn.active { background: var(--red); }
        
        .paywall-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .paywall-content {
            background: #171724;
            border: 1px solid #2b2b3d;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .pay-now-btn { background: linear-gradient(45deg, #ef233c, #ff4d6d); color: white; border: none; padding: 12px 24px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .close-paywall { background: transparent; color: var(--muted); border: none; margin-top: 12px; cursor: pointer; }
        footer { text-align: center; padding: 30px 16px; margin-top: 40px; border-top: 1px solid #292933; color: var(--muted); }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo" id="logoHome">Anime <span>Only</span></div>
            <button class="go-pro-btn" id="goProBtn">👑 Go Pro</button>
        </div>
        <input class="search" id="animeSearch" type="search" placeholder="Search anime...">
    </header>

    <div class="ad-banner" id="topAdSlot">Premium Sponsor Layout Slot</div>

    <div class="filter-row">
        <button class="filter-btn active" data-genre="all">All Items</button>
        <button class="filter-btn" data-genre="Action">Action</button>
        <button class="filter-btn" data-genre="Adventure">Adventure</button>
        <button class="filter-btn" data-genre="watchlist" id="watchlistTabBtn">❤ Watchlist</button>
    </div>

    <main>
        <section id="homeView">
            <h2 class="section-title" id="viewHeading"># Local Experiment Catalog</h2>
            <div class="catalog" id="catalogGrid"></div>
        </section>

        <section id="watchView" class="hidden">
            <button class="back-btn" id="btnBack">← Back to Catalog</button>
            <h2 id="streamTitle">Loading Title...</h2>
            
            <div class="action-tray">
                <button class="watchlist-btn" id="toggleWatchlistBtn">❤ Add to Watchlist</button>
            </div>

            <div class="player">
                <video id="mainVideoPlayer" controls playsinline></video>
            </div>

            <div class="player-toolbar">
                <div><a href="#" class="w2g-link" id="w2gLink">Watch2Gether Room ↗</a></div>
                <div class="toolbar-right">
                    <button id="prevEpisodeBtn" class="nav-arrow">◀ Prev</button>
                    <button id="nextEpisodeBtn" class="nav-arrow">Next ▶</button>
                </div>
            </div>

            <h3>Episodes</h3>
            <div id="episodeGrid" class="episode-list"></div>
        </section>
    </main>

    <div class="paywall-modal hidden" id="paywallModal">
        <div class="paywall-content">
            <h2>Unlock Premium Mode</h2>
            <p>Upgrade to access custom watchlists and shared watch rooms.</p>
            <button class="pay-now-btn" id="purchasePremiumBtn">Upgrade for $2.99</button>
            <button class="close-paywall" id="closePaywallBtn">Continue Basic</button>
        </div>
    </div>

    <footer>Anime Only · Pure Experimental Core</footer>

    <script>
        "use strict";

        // =======================================================
        // 1. CLEAN SLATE TESTING SUITE
        // =======================================================
        (function runCleanSlateEngine() {
            localStorage.clear();
            sessionStorage.clear();
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('nocache')) {
                urlParams.set('nocache', Date.now());
                window.location.search = urlParams.toString();
            }
        })();

        // =======================================================
        // 2. INTERNAL DATABASE (NO INTERNET REQUIRED)
