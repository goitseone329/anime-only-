<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only - Stream Free Anime</title>
    <!-- Font Awesome for clean interface icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Base Reset & Anime Heaven Layout Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --main-dark: #0f172a;       /* Dark base background */
            --panel-bg: #1e293b;        /* Lighter background panels */
            --anime-blue: #3b82f6;      /* Classic Anime Heaven layout brand color (Cyan/Blue variant) */
            --bright-blue: #60a5fa;     /* Hover highlight accent blue */
            --text-main: #f8fafc;       /* Off-white text */
            --text-muted: #94a3b8;      /* Structural metadata text */
        }

        body {
            background-color: var(--main-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Top Header Utility Area */
        header {
            background-color: #0b0f19;
            border-bottom: 3px solid var(--anime-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-wrap {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        /* Branding inspired by Anime Heaven's block signature */
        .brand {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .brand span {
            background-color: var(--anime-blue);
            color: #ffffff;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            margin-left: 4px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        /* Centered Filter/Search Bar block */
        .search-area {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-area input {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 0.6rem 2.5rem 0.6rem 1rem;
            border-radius: 20px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-area input:focus {
            border-color: var(--anime-blue);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
        }

        .search-area i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Core Section Grid Setup */
        .container {
            max-width: 1300px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 320px; /* Main layout feed + classic sidebar panel */
            gap: 1.5rem;
        }

        .main-feed {
            min-width: 0; /* Prevents flex/grid blowouts */
        }

        /* Headings mimicking old-school content streams */
        .block-heading {
            background-color: var(--panel-bg);
            border-left: 5px solid var(--anime-blue);
            padding: 0.6rem 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* High-density grid for quick scanning like Anime Heaven */
        .anime-stream {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .anime-item {
            background-color: var(--panel-bg);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .anime-item:hover {
            transform: translateY(-4px);
        }

        .thumb-box {
            position: relative;
            width: 100%;
            padding-top: 140%; /* Perfect standard anime poster scale */
            background-color: #0b0f19;
        }

        .thumb-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Sub/Dub status badge tags overlaying the poster graphics */
        .status-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background-color: rgba(15, 23, 42, 0.85);
            border-left: 3px solid var(--anime-blue);
            padding: 0.2rem 0.4rem;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 2px;
        }

        .ep-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: var(--anime-blue);
            color: #ffffff;
            padding: 0.1rem 0.4rem;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 2px;
        }

        .item-details {
            padding: 0.6rem;
        }

        .item-title {
            font-size: 0.85rem;
            font-weight: bold;
            line-height: 1.3;
            height: 2.6rem; /* Restricts overflow across variable names */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-main);
        }

        .item-title:hover {
            color: var(--bright-blue);
        }

        /* Classic right-side scheduling panel details */
        .sidebar-panel {
            background-color: var(--panel-bg);
            padding: 1rem;
            border-radius: 4px;
            height: fit-content;
        }

        .sidebar-title {
            font-size: 1rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--anime-blue);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .ranking-list {
            list-style: none;
        }

        .ranking-row {
            display: flex;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
        }

        .ranking-num {
            font-weight: bold;
            color: var(--anime-blue);
            width: 25px;
        }

        .ranking-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 5px;
        }

        /* Compact Streaming Modal Layer */
        .stream-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .player-frame {
            background-color: var(--main-dark);
            width: 100%;
            max-width: 860px;
            border: 2px solid var(--anime-blue);
            border-radius: 6px;
            position: relative;
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%; /* Fixed widescreen 16:9 box window */
            height: 0;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .close-overlay {
            position: absolute;
            top: -45px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 2.2rem;
            cursor: pointer;
        }

        /* Screen Scaling adjustments for clean rendering on Android Phones */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar-panel {
                display: none; /* Drop sidebar on narrow mobile profiles to prioritize media index */
            }
        }

        @media (max-width: 480px) {
            .header-wrap {
                flex-direction: column;
                align-items: stretch;
            }
            .brand {
                justify-content: center;
            }
            .anime-stream {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Section -->
    <header>
        <div class="header-wrap">
            <a href="#" class="brand">Anime<span>Only</span></a>
            <div class="search-area">
                <input type="text" id="directorySearch" placeholder="Search anime index...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
    </header>

    <!-- Content Workspace Wrapper -->
    <div class="container">
        
        <!-- Left Side: Interactive Directory Feed -->
        <main class="main-feed">
