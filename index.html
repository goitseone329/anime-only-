<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free</title>
    <style>
        /* GLOBAL RESET & THEME */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* HEADER BAR SETTINGS */
        header {
            background-color: #0d0d0d;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 2px solid #ff0000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-box {
            background-color: #ff0000;
            padding: 8px;
            border-radius: 5px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .logo-box svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        /* SEARCH BAR SYSTEM */
        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px 40px 10px 15px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #ff0000;
        }
        .search-icon-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .search-icon-btn svg {
            width: 16px;
            height: 16px;
            fill: #ff0000;
        }

        /* MAIN CONTENT LAYOUT */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 15px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 4px solid #ff0000;
            padding-left: 10px;
        }

        /* CARDS GRID SYSTEM */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        /* INDIVIDUAL ANIME CARD */
        .anime-card {
            background-color: #0d0d0d;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #222;
            cursor: pointer;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
            box-shadow: 0 5px 15px rgba(250, 0, 0, 0.2);
        }
        .anime-poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%; 
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .anime-poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .anime-card-info {
            padding: 12px;
        }
        .anime-card-info h3 {
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-card-info p {
            font-size: 0.8rem;
            color: #b3b3b3;
        }
        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* ADSTERRA LAYOUT PLACEMENT HOLDER */
        .ad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            width: 100%;
            min-height: 90px;
        }
    </style>
</head>
<body>

    <!-- ADSTERRA ANCHOR 1: POPUNDER CODE -->
    <!-- (If you have an Adsterra Popunder script, paste it right here below) -->


    <!-- STICKY NAVIGATION HEADER -->
    <header>
        <div class="logo-box" onclick="loadTrendingAnime()">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
        </div>
        
        <div class="search-wrapper">
            <input type="text" id="search-bar" class="search-input" placeholder="Search Anime...">
            <button class="search-icon-btn" onclick="searchAnime()">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ADSTERRA ANCHOR 2: TOP BANNER -->
    <div class="ad-container">
        <!-- Paste your 728x90 or 468x60 Adsterra Banner Script right here -->
    </div>

    <!-- MAIN BODY GRID CONTAINER -->
    <main class="container">
        <h2 class="section-title" id="grid-title">Trending Anime</h2>
        
        <!-- Jikan API handles populating cards directly inside this box -->
        <div class="anime-grid" id="anime-container">
            <div class="status-msg">Loading content...</div>
        </div>
    </main>

    <!-- ADSTERRA ANCHOR 3: BOTTOM BANNER -->
    <div class="ad-container">
        <!-- Paste your secondary Adsterra Native or Banner ad code here -->
    </div>

    <!-- DYNAMIC ENGINE SCRIPT (Jikan API integration) -->
    <script>
        const container = document.getElementById('anime-container');
        const gridTitle = document.getElementById('grid-title');
        const searchBar = document.getElementById('search-bar');

        // Fetch Top trending Lists from MAL Database
        async function loadTrendingAnime() {
            gridTitle.innerText = "Trending Anime";
            container.innerHTML = '<div class="status-msg">Loading trending titles...</div>';
            searchBar.value = '';
            try {
                const response = await fetch('https://jikan.moe');
                const result = await response.json();
                renderCards(result.data);
            } catch (error) {
                container.innerHTML = '<div class="status-msg">Failed to contact database. Try refreshing.</div>';
            }
        }

        // Query Jikan database based on search box entry strings
        async function searchAnime() {
            const query = searchBar.value.trim();
            if (!query) return;

            gridTitle.innerText = `Search Results: "${query}"`;
            container.innerHTML = '<div class="status-msg">Searching catalog...</div>';
            try {
                const response = await fetch(`https://jikan.moe{encodeURIComponent(query)}&limit=12`);
                const result = await response.json();
                if (result.data.length === 0) {
                    container.innerHTML = '<div class="status-msg">No titles found for that keyword.</div>';
                } else {
                    renderCards(result.data);
                }
            } catch (error) {
                container.innerHTML = '<div class="status-msg">Search failed. Please try again.</div>';
            }
        }

        // Card Renderer Logic
        function renderCards(animeList) {
            container.innerHTML = '';
            animeList.forEach(anime => {
                container.innerHTML += `
                    <div class="anime-card" onclick="window.open('${anime.url}', '_blank')">
                        <div class="anime-poster-wrapper">
                            <img src="${anime.images.jpg.large_image_url || anime.images.jpg.image_url}" alt="${anime.title}">
                        </div>
                        <div class="anime-card-info">
                            <h3>${anime.title}</h3>
                            <p>⭐ Score: ${anime.score || 'N/A'}</p>
                        </div>
                    </div>
                `;
            });
        }

        // Form submission capture event matching for desktop keyboards
        searchBar.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchAnime();
            }
        });

        // Initialize target data loop on document render
        window.onload = loadTrendingAnime;
    </script>

    <!-- ADSTERRA ANCHOR 4: SOCIAL BAR OR IN-PAGE PUSH CHIPS -->
    <!-- (Paste your Social Bar code or active push triggers here right before body closes) -->

</body>
</html>
