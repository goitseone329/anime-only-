<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free</title>
    <style>
        /* GLOBAL RESET & THEME */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* HEADER BAR SETTINGS */
        header {
            background-color: #0d0d0d;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 2px solid #ff0000;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-box {
            background-color: #ff0000;
            padding: 8px;
            border-radius: 5px;
            margin-right: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .search-container {
            flex-grow: 1;
            position: relative;
        }
        .search-container input {
            width: 100%;
            padding: 8px 12px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
        }

        /* INTEGRATED VIDEO PLAYER CONSOLE CONTAINER */
        .player-section {
            width: 100%;
            background-color: #050505;
            border-bottom: 1px solid #1a1a1a;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-wrapper {
            width: 90%;
            max-width: 800px;
            position: relative;
            padding-top: 56.25%; /* Fixed 16:9 ratio aspect */
            background-color: #0c0c0c;
            border: 2px solid #222;
            border-radius: 6px;
            overflow: hidden;
        }
        /* UPGRADED: Handles responsive multi-source iframes or videos flawlessly */
        .player-wrapper iframe, .player-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .player-details {
            width: 90%;
            max-width: 800px;
            padding: 10px 0 0 0;
            text-align: left;
        }
        .player-details h2 {
            font-size: 1.1rem;
            color: #ff0000;
            margin-bottom: 4px;
        }
        .player-details p {
            font-size: 0.85rem;
            color: #888;
        }

        /* MAIN CONTENT LAYOUT */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 4px solid #ff0000;
            padding-left: 10px;
        }

        /* CARDS GRID SYSTEM */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        /* INDIVIDUAL ANIME CARD */
        .anime-card {
            background-color: #0d0d0d;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #222;
            cursor: pointer;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
            box-shadow: 0 5px 15px rgba(250, 0, 0, 0.3);
        }
        .anime-poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%; /* Strict aspect ratio for posters */
        }
        .anime-poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .anime-card-info {
            padding: 10px;
        }
        .anime-card-info h3 {
            font-size: 0.85rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-card-info p {
            font-size: 0.75rem;
            color: #ff0000;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR HEADER -->
    <header>
        <div class="logo-box">AH</div>
        <div class="search-container">
            <input type="text" placeholder="Search Anime...">
        </div>
    </header>

    <!-- CORE INTEGRATED PLAYER CONSOLE -->
    <section class="player-section">
        <div class="player-wrapper" id="player-container">
            <!-- Default fallback message content or default trailer frame -->
            <iframe id="video-frame" src="https://youtube.com" allowfullscreen></iframe>
        </div>
        <div class="player-details">
            <h2 id="current-title">Playing: Welcome to Anime Heaven</h2>
            <p id="current-status">Streaming Client: Active (Select an anime below to watch)</p>
        </div>
    </section>

    <!-- TRENDING GRID LAYOUT SECTION -->
    <main class="container">
        <h2 class="section-title">Trending Anime</h2>
        <div class="anime-grid" id="trending-grid">
            <!-- Dynamic Jikan API content injects cards here automatically -->
        </div>
    </main>

    <!-- JIKAN METADATA & STREAM LINK COMBINATION LAYER Script -->
    <script>
        const JIKAN_API_URL = 'https://jikan.moe';
        
        // Dynamic streaming path configuration 
        // Maps Jikan MAL IDs to free embeddable delivery players
        function getStreamingSourceUrl(malId) {
            // Using a standard embedded aggregator mirror path
            return `https://vidsrc.to{malId}/1/1`;
        }

        // Fetch Top Airing Items directly via live API handshakes
        async function fetchTrendingAnime() {
            try {
                const response = await fetch(JIKAN_API_URL);
                const result = await response.json();
                
                if (result && result.data) {
                    renderAnimeGrid(result.data);
                }
            } catch (error) {
                console.error("Error pulling database profiles from Jikan:", error);
                document.getElementById('trending-grid').innerHTML = '<p style="color:#ff0000; padding:20px;">Failed to load catalog. Please refresh.</p>';
            }
        }

        // Programmatically generate individual cards inside the responsive layout grid
        function renderAnimeGrid(animeList) {
            const gridContainer = document.getElementById('trending-grid');
            gridContainer.innerHTML = ''; // Sanitize initial setup loading string

            animeList.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                
                // Build internal template content block
                card.innerHTML = `
                    <div class="anime-poster-wrapper">
                        <img src="${anime.images.jpg.large_image_url}" alt="${anime.title}" loading="lazy">
                    </div>
                    <div class="anime-card-info">
                        <h3>${anime.title}</h3>
                        <p>★ ${anime.score || 'N/A'}</p>
                    </div>
                `;

                // Add active click-event node properties to update the player console dynamically
                card.addEventListener('click', () => {
                    loadAnimeStream(anime.mal_id, anime.title);
                });

                gridContainer.appendChild(card);
            });
        }

        // Handles hot-swapping stream sources safely when clicking a choice card item
        function loadAnimeStream(malId, title) {
            const videoFrame = document.getElementById('video-frame');
            const currentTitle = document.getElementById('current-title');
            const currentStatus = document.getElementById('current-status');

            // Generate the dynamic play link 
            const sourceUrl = getStreamingSourceUrl(malId);

            // Update UI components simultaneously 
            currentTitle.innerText = `Playing: ${title}`;
            currentStatus.innerText = `Streaming Client: Active (ID: ${malId} - Episode 1)`;
            
            // Swap out the underlying source frame cleanly
            videoFrame.src = sourceUrl;
            
            // Scroll user smoothly to the video screen layout container on mobile viewports
            document.querySelector('.player-section').scrollIntoView({ behavior: 'smooth' });
        }

        // Bootstraps runtime loops upon loading context windows successfully
        window.addEventListener('DOMContentLoaded', fetchTrendingAnime);
    </script>
</body>
</html>
