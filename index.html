<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Only</title>
<style>
:root {
  --bg: #0b0b0f;
  --panel: #17171f;
  --red: #ef233c;
  --text: #f7f7fb;
  --muted: #aaaab8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  background: #111116;
  border-bottom: 1px solid #292933;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo {
  color: var(--red);
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}
.logo span { color: white; }
.search {
  width: min(100%, 320px);
  padding: 11px 13px;
  border-radius: 8px;
  border: 1px solid #373742;
  background: #20202a;
  color: white;
  outline: none;
}
.search:focus { border-color: var(--red); }
main { max-width: 1200px; margin: auto; padding: 20px; }
.hero {
  padding: 30px 22px;
  border-radius: 14px;
  margin-bottom: 26px;
  background: linear-gradient(120deg, #50101e, #19111f 65%, #101015);
}
.hero h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 44px); }
.hero p { color: #ddd; line-height: 1.5; margin-bottom: 0; }
.section-title { margin: 24px 0 16px; font-size: 22px; }
.catalog {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 17px;
}
.anime-card {
  background: var(--panel);
  border: 1px solid #282832;
  border-radius: 11px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, border-color .2s;
}
.anime-card:hover {
  transform: translateY(-4px);
  border-color: var(--red);
}
.poster {
  height: 205px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(145deg, #4b1025, #21142e, #101018);
  overflow: hidden;
}
.poster span { text-shadow: 0 2px 10px #000; }
.card-info { padding: 12px; }
.card-info h3 { font-size: 15px; margin: 0 0 7px; }
.card-info p { color: var(--muted); font-size: 12px; margin: 0; }
.tag {
  display: inline-block;
  margin-top: 9px;
  color: #ff9ca8;
  background: #40131e;
  border-radius: 5px;
  padding: 4px 7px;
  font-size: 11px;
}
button, .download {
  background: var(--red);
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 11px 14px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
button:hover, .download:hover { filter: brightness(1.12); }
button:disabled { opacity: .4; cursor: not-allowed; }
.secondary { background: #30303b; }
.hidden { display: none !important; }
#watchView {
  background: var(--panel);
  border: 1px solid #2b2b36;
  border-radius: 12px;
  padding: 17px;
}
.back-button { margin-bottom: 18px; }
#watchTitle { margin: 5px 0 10px; }
.player {
  width: 100%;
  background: black;
  border-radius: 9px;
  overflow: hidden;
}
video {
  width: 100%;
  display: block;
  max-height: 70vh;
  background: black;
}
#playerMessage {
  color: #ddd;
  background: #101015;
  padding: 16px;
  line-height: 1.6;
  font-size: 14px;
}
.player-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin: 15px 0;
}
#episodeLabel { color: var(--muted); }
.episode-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.episode-button {
  background: #30303b;
  min-width: 46px;
}
.episode-button.active { background: var(--red); }
.empty {
  color: var(--muted);
  padding: 25px 0;
  text-align: center;
  grid-column: 1 / -1;
}
footer {
  text-align: center;
  color: var(--muted);
  padding: 28px 16px;
  border-top: 1px solid #292933;
  margin-top: 35px;
  font-size: 13px;
}
@media (max-width: 450px) {
  header { padding: 12px; }
  main { padding: 13px; }
  .catalog { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
  .poster { height: 180px; font-size: 19px; }
  #watchView { padding: 12px; }
}
</style>
</head>
<body>

<header>
  <div class="logo" id="homeButton">ANIME <span>ONLY</span></div>
  <input
    class="search"
    id="searchInput"
    type="search"
    placeholder="Search anime..."
    aria-label="Search anime"
  >
</header>

<main>
  <section id="homeView">
    <div class="hero">
      <h1>Anime Only</h1>
      <p>Your anime corner. Discover titles, open a show, and choose an episode.</p>
    </div>

    <h2 class="section-title">Anime Collection</h2>
    <div class="catalog" id="animeCatalog"></div>
  </section>

  <section id="watchView" class="hidden">
    <button class="secondary back-button" id="backButton">← Back to Anime</button>

    <h2 id="watchTitle">Anime Title</h2>
    <p id="watchDescription" style="color:#aaaab8;line-height:1.6"></p>

    <div class="player">
      <video id="videoPlayer" controls playsinline preload="metadata">
        Your browser does not support video playback.
      </video>
      <div id="playerMessage">
        Choose an episode below. A playable video source must be added by the site owner.
      </div>
    </div>

    <div class="player-controls">
      <button id="previousButton" class="secondary">← Previous</button>
      <span id="episodeLabel">Episode 1</span>
      <button id="nextButton">Next →</button>
      <a id="downloadLink" class="download" href="#" aria-disabled="true">Download</a>
    </div>

    <h3>Episodes</h3>
    <div id="episodeList" class="episode-list"></div>
  </section>
</main>

<footer>
  Anime Only · Fan-made demo website
</footer>
