<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free Anime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 70px; }
        
        /* FIXED BRAND HEADER NAVBAR */
        header { background-color: #000; border-bottom: 2px solid #ff1a1a; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; height: 60px; position: sticky; top: 0; z-index: 1000; }
        .brand-box { display: flex; align-items: center; text-decoration: none; }
        .brand-logo { background-color: #d61c1c; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 900; color: #fff; font-size: 22px; margin-right: 12px; font-style: italic; box-shadow: 0 0 8px #ff1a1a; }
        .search-container { flex: 1; max-width: 500px; position: relative; margin-right: 15px; }
        .search-bar-input { width: 100%; height: 38px; background-color: #111; border: 1px solid #d61c1c; border-radius: 4px; color: #fff; padding: 0 40px 0 12px; font-size: 15px; }
        .search-action-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #d61c1c; font-size: 14px; cursor: pointer; }
        .hamburger-menu { display: flex; flex-direction: column; justify-content: space-between; width: 26px; height: 18px; cursor: pointer; }
        .hamburger-menu span { height: 2.5px; width: 100%; background-color: #d61c1c; border-radius: 2px; }

        /* MONETIZATION PLACEMENT BOX */
        .top-advertisement-block { width: 100%; max-width: 728px; margin: 0 auto; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #000; border-bottom: 1px solid #222; }

        /* VIEW CONTAINER SYSTEM SWITCHER */
        .app-view-panel { display: none; max-width: 800px; margin: 0 auto; padding: 12px; }
        .app-view-panel.active-view { display: block; }

        /* SCREEN 1: HOMEPAGE ANIME BANNER ROW TILES */
        .section-headline-title { color: #ccc; text-align: center; font-size: 20px; font-weight: bold; margin: 15px 0; letter-spacing: 0.5px; }
        .anime-poster-card { background-color: #121212; border-bottom: 4px solid #1a1a1a; margin-bottom: 20px; display: flex; flex-direction: column; cursor: pointer; border-radius: 6px; overflow: hidden; }
        .visual-thumbnail-area { position: relative; width: 100%; height: 230px; background: #222; }
        .visual-thumbnail-area img { width: 100%; height: 100%; object-fit: cover; }
        .ranking-overlay-number { position: absolute; top: 0; left: 0; background-color: #ff1a1a; color: #fff; font-weight: bold; font-size: 24px; padding: 8px 18px; border-bottom-right-radius: 6px; z-index: 10; font-style: italic; }
        .quick-watchlist-add-trigger { position: absolute; top: 10px; right: 10px; background-color: rgba(255, 26, 26, 0.9); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; z-index: 10; font-weight: bold; }
        .card-metadata-info-box { padding: 15px 10px; text-align: center; background: #111; }
        .anime-title-heading { font-size: 19px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .anime-sub-alias { font-size: 15px; color: #aaa; margin-bottom: 10px; }
        .episode-release-badge-text { color: #ff1a1a; font-weight: bold; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* SCREEN 3: DETAILS & INFO PANEL SCREEN SHEET */
        .anime-meta-details-grid { text-align: center; margin-bottom: 20px; font-size: 18px; color: #aaa; }
        .anime-meta-details-grid span { color: #ff1a1a; font-weight: bold; }
        .action-button-row { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .action-btn-pill { background-color: #ff1a1a; color: #fff; font-weight: bold; padding: 10px 24px; border-radius: 20px; border: none; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .countdown-timer-container { text-align: center; border-top: 1px solid #222; border-bottom: 1px solid #222; padding: 15px 0; margin-bottom: 25px; }
        .countdown-label-title { color: #aaa; font-size: 18px; margin-bottom: 8px; }
        .countdown-digits-text { color: #ff1a1a; font-size: 22px; font-weight: bold; }
        .episode-grid-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background-color: #ff1a1a; border: 1px solid #ff1a1a; }
        .episode-selection-tile-btn { background-color: #000; padding: 15px 5px; text-align: center; color: #fff; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .episode-selection-tile-btn:active { background-color: #1a1a1a; }
        .episode-num-label-title { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .episode-time-elapsed-stamp { font-size: 12px; color: #888; }

        /* SCREEN 2: NATIVE STREAM VIDEO COMPONENT VIEW PANEL */
        .video-mount-player-box { width: 100%; background-color: #000; position: relative; margin-bottom: 20px; border: 1px solid #222; aspect-ratio: 16/9; }
        .video-mount-player-box video { width: 100%; height: 100%; object-fit: contain; }
        .stream-title-meta-header { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 20px; color: #fff; }
        .media-controller-action-button-strip { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .strip-btn-action { background-color: #ff1a1a; color: #fff; border: none; width: 50px; height: 40px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; cursor: pointer; }
        .strip-btn-action.large-text-action { width: 70px; }
        .direct-download-action-trigger-btn { width: 100%; max-width: 320px; margin: 0 auto 25px auto; background-color: #ff1a1a; color: #fff; text-align: center; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 4px; cursor: pointer; display: block; text-decoration: none; }
        .community-social-icon-grid-strip { display: flex; justify-content: center; gap: 15px; padding: 15px; background-color: #111; max-width: 320px; margin: 0 auto; border-radius: 4px; }
        .social-network-icon-anchor { color: #fff; background-color: #222; border-radius: 4px; padding: 8px 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .social-network-icon-anchor svg { width: 24px; height: 24px; fill: #fff; }

        /* FIXED STICKY MOBILE NAVIGATION FOOTER NAVBAR BLOCK */
        .fixed-sticky-footer-tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background-color: #000; border-top: 2px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .footer-tab-item-link-btn { color: #888; display: flex; align-items: center; justify-content: center; width: 25%; height: 100%; cursor: pointer; }
        .footer-tab-item-link-btn.active-tab { color: #fff; }
        .footer-tab-item-link-btn svg { width: 26px; height: 26px; fill: currentColor; }
    </style>
    <!-- ACTIVE ADSTERRA SOCIAL BAR AD UNIT SCRIPT CODE -->
    <script data-cfasync="false" src="https://abscloud.org"></script>
</head>

                <input type="text" class="search-bar-input" placeholder="Search">
