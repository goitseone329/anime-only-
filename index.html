<script>
    const animeDatabase = {
        schedule: [
            { title: "Kaiju No. 8", alternative: "Kaijuu 8-gou", id: "kaiju-no-8", embedId: "dQw4w9WgXcQ" },
            { title: "The Iceblade Sorcerer Shall Rule the World", alternative: "Hyouken no Majutsushi ga Sekai o Suberu", id: "the-iceblade-sorcerer", embedId: "dQw4w9WgXcQ" },
            { title: "Demon Slayer: Hashira Training Arc", alternative: "Kimetsu no Yaiba: Hashira Geiko-hen", id: "demon-slayer-hashira", embedId: "dQw4w9WgXcQ" },
            { title: "My Hero Academia Season 7", alternative: "Boku no Hero Academia 7th Season", id: "my-hero-academia-7", embedId: "dQw4w9WgXcQ" }
        ],
        trending: [
            { title: "One Piece", alternative: "Wan Piisu", id: "one-piece", embedId: "dQw4w9WgXcQ" },
            { title: "Naruto Shippuden", alternative: "Naruto: Shippuuden", id: "naruto-shippuden", embedId: "dQw4w9WgXcQ" },
            { title: "Jujutsu Kaisen", alternative: "Jujutsu Kaisen", id: "jujutsu-kaisen", embedId: "dQw4w9WgXcQ" },
            { title: "Attack on Titan", alternative: "Shingeki no Kyojin", id: "attack-on-titan", embedId: "dQw4w9WgXcQ" }
        ],
        movies: [
            { title: "Spirited Away", alternative: "Sen to Chihiro no Kamikakushi", id: "spirited-away", embedId: "dQw4w9WgXcQ" },
            { title: "Your Name", alternative: "Kimi no Na wa", id: "your-name", embedId: "dQw4w9WgXcQ" },
            { title: "Demon Slayer: Mugen Train", alternative: "Kimetsu no Yaiba: Mugen Ressha-hen", id: "mugen-train", embedId: "dQw4w9WgXcQ" },
            { title: "Jujutsu Kaisen 0", alternative: "Jujutsu Kaisen 0 Movie", id: "jujutsu-kaisen-0", embedId: "dQw4w9WgXcQ" }
        ],
        watchlist: []
    };

    let currentCategory = 'schedule';

    // Safely load watchlist from local storage
    try {
        const storedWatchlist = localStorage.getItem('animeWatchlist');
        if (storedWatchlist) {
            animeDatabase.watchlist = JSON.parse(storedWatchlist);
        }
    } catch(e) {
        console.error("Local storage error:", e);
    }

    const toggleWatchlist = (e, anime) => {
        e.stopPropagation();
        const index = animeDatabase.watchlist.findIndex(item => item.id === anime.id);
        
        if (index > -1) {
            animeDatabase.watchlist.splice(index, 1);
            e.target.classList.remove('added');
            e.target.innerText = "+";
        } else {
            animeDatabase.watchlist.push(anime);
            e.target.classList.add('added');
            e.target.innerText = "✓";
        }
        
        localStorage.setItem('animeWatchlist', JSON.stringify(animeDatabase.watchlist));
        if (currentCategory === 'watchlist') {
            renderList('watchlist');
        }
    };

    const renderList = (category, filter = "") => {
        const container = document.getElementById('anime-render-list');
        if (!container) return;
        
        container.innerHTML = "";
        const targetData = animeDatabase[category] || [];
        
        const items = targetData.filter(item => 
            (item.title && item.title.toLowerCase().includes(filter.toLowerCase())) || 
            (item.alternative && item.alternative.toLowerCase().includes(filter.toLowerCase()))
        );
        
        if (items.length === 0) {
            container.innerHTML = `<div style="padding: 40px; text-align: center; color: #666;">No media assets found here.</div>`;
            return;
        }

        items.forEach((anime, index) => {
            const isAdded = animeDatabase.watchlist.some(item => item.id === anime.id);
            const card = document.createElement('div');
            card.className = 'anime-row-card';
            card.innerHTML = `
                <div class="image-banner-wrapper">
                    <span class="rank-badge">#${index + 1}</span>
                    <span class="action-plus ${isAdded ? 'added' : ''}">${isAdded ? '✓' : '+'}</span>
                    <div style="width:100%; height:100%; background: #1a1a1a; display:flex; align-items:center; justify-content:center; color:#444; font-weight:bold;">
                        ${anime.title} Banner
                    </div>
                </div>
                <div class="card-details">
                    <div class="primary-title">${anime.title}</div>
                    <div class="secondary-title">${anime.alternative}</div>
                    <div class="status-released">STREAM AVAILABLE</div>
                </div>
            `;

            const plusBtn = card.querySelector('.action-plus');
            if (plusBtn) {
                plusBtn.addEventListener('click', (e) => toggleWatchlist(e, anime));
            }
            
            card.addEventListener('click', () => {
                const player = document.getElementById('player-section');
                const title = document.getElementById('now-playing-title');
                const target = document.getElementById('video-frame-target');
                if (player && title && target) {
                    player.style.display = 'block';
                    title.innerText = `Now Playing: ${anime.title}`;
                    target.innerHTML = `<iframe src="https://youtube.com{anime.embedId}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
            
            container.appendChild(card);
        });
    };

    function setActiveTab(tabId, headingText, category) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        
        const selectedTab = document.getElementById(tabId);
        if (selectedTab) selectedTab.classList.add('active');
        
        const lowerNav = document.getElementById(`foot-nav-${category}`);
        if (lowerNav) lowerNav.classList.add('active');

        const titleLabel = document.getElementById('hub-title-label');
        if (titleLabel) titleLabel.innerText = headingText;
        
        currentCategory = category;
        renderList(currentCategory);
    }

    // Listeners
    document.getElementById('tab-schedule')?.addEventListener('click', () => setActiveTab('tab-schedule', 'Subbed Anime Schedule', 'schedule'));
    document.getElementById('tab-trending')?.addEventListener('click', () => setActiveTab('tab-trending', 'Trending Anime Hub', 'trending'));
    document.getElementById('tab-movies')?.addEventListener('click', () => setActiveTab('tab-movies', 'Top Anime Movies', 'movies'));
    document.getElementById('tab-watchlist')?.addEventListener('click', () => setActiveTab('tab-watchlist', 'Your Saved Watchlist', 'watchlist'));

    document.getElementById('foot-nav-schedule')?.addEventListener('click', () => setActiveTab('tab-schedule', 'Subbed Anime Schedule', 'schedule'));
    document.getElementById('foot-nav-trending')?.addEventListener('click', () => setActiveTab('tab-trending', 'Trending Anime Hub', 'trending'));
    document.getElementById('foot-nav-movies')?.addEventListener('click', () => setActiveTab('tab-movies', 'Top Anime Movies', 'movies'));
    document.getElementById('logo-nav-home')?.addEventListener('click', () => setActiveTab('tab-schedule', 'Subbed Anime Schedule', 'schedule'));

    document.getElementById('search-box')?.addEventListener('input', (e) => {
        renderList(currentCategory, e.target.value);
    });

    // Fire application load
    document.addEventListener("DOMContentLoaded", () => {
        renderList('schedule');
    });
</script>
