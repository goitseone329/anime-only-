<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only - Stream</title>
    <style>
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #121212;
            --card-bg: #1f2833;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-secondary: #8a9aa7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding-bottom: 4rem;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
            cursor: pointer;
        }

        .logo span:first-child { color: var(--accent-color); }
        .logo span:last-child { color: var(--text-main); }

        .search-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .search-bar {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid #2a2a2a;
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
        }

        main {
            padding: 1.5rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Catalog Layout */
        #catalog-view { display: block; }

        .section-title {
            font-size: 1.4rem;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            font-weight: 700;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 1.4rem;
            background-color: var(--accent-color);
            margin-right: 10px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .anime-card:hover {
            transform: translateY(-4px);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 145%;
            background-color: #1a232e;
        }

        .anime-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-sub-dub {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: rgba(11, 12, 16, 0.85);
            border-left: 3px solid var(--accent-color);
            color: #ffffff;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 800;
            z-index: 2;
        }

        .badge-ep {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 2px 6px;
            font-size: 0.72rem;
            font-weight: 700;
            border-radius: 4px;
            z-index: 2;
        }

        .anime-details {
            background-color: var(--bg-secondary);
            padding: 10px 8px;
            text-align: left;
        }

        .anime-title {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ================= WATCH LAYOUT PLAYER ================= */
        #watch-view {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .stream-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stream-episode-indicator {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .btn-next-ep {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 24px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Screen standard ratio placement */
            background-color: #000;
            margin-bottom: 1.5rem;
        }

        .player-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .action-control-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            min-width: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-wide { padding: 12px 20px; }

        .btn-download {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            padding: 14px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-strip {
            background-color: var(--bg-secondary);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-radius: 4px;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="nav-logo"><span>Anime</span><span>Only</span></div>
        <div class="search-container" id="nav-search-box">
            <input type="text" id="anime-search" class="search-bar" placeholder="Search anime titles...">
        </div>
    </header>

    <main>
        <section id="catalog-view">
            <h1 class="section-title" id="display-title">Trending Anime</h1>
            <div id="anime-grid" class="anime-grid">
                <p class="status-msg">Loading direct catalog updates...</p>
            </div>
        </section>

        <section id="watch-view">
            <h2 id="stream-anime-title" class="stream-title">Anime Title</h2>
            <div id="stream-episode-num" class="stream-episode-indicator">Episode 1</div>
            <button id="next-ep-top-btn" class="btn-next-ep">Episode 2</button>

            <div class="player-container">
                <video id="main-video-player" controls>
                    <source src="https://googleapis.com" type="video/mp4">
                </video>
            </div>

            <div class="action-control-bar">
                <button class="action-btn btn-wide" id="btn-back-catalog">W2G</button>
                <button class="action-btn">🔗</button>
                <button class="action-btn" id="btn-prev-control">←</button>
                <button class="action-btn" id="btn-next-control">→</button>
                <button class="action-btn">📷</button>
            </div>

            <a href="#" id="download-link" class="btn-download">Download Episode 1</a>

            <div class="social-strip">
                <div>💬 Discord</div>
                <div>🐦 Twitter</div>
                <div>❤️ Support</div>
            </div>
        </section>
    </main>

    <script>
        const catalogView = document.getElementById('catalog-view');
        const watchView = document.getElementById('watch-view');
        const gridContainer = document.getElementById('anime-grid');
        const searchInput = document.getElementById('anime-search');
        const searchBoxWrapper = document.getElementById('nav-search-box');
        const displayTitle = document.getElementById('display-title');
        const navLogo = document.getElementById('nav-logo');

        const streamAnimeTitle = document.getElementById('stream-anime-title');
        const streamEpisodeNum = document.getElementById('stream-episode-num');
        const nextEpTopBtn = document.getElementById('next-ep-top-btn');
        const downloadLink = document.getElementById('download-link');
        const mainVideoPlayer = document.getElementById('main-video-player');
        const btnBackCatalog = document.getElementById('btn-back-catalog');

        let timeoutId = null;
        let currentActiveAnime = null;
