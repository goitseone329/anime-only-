<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <style>
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #121212;
            --card-bg: #1f2833;
            --accent-color: #e50914;
            --text-main: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding-bottom: 4rem;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.95);
            padding: 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(229, 9, 20, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
        }

        .logo span {
            color: var(--text-main);
        }

        .search-box {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 0.9rem 1.8rem;
            background-color: rgba(18, 18, 18, 0.8);
            border: 1px solid #333;
            border-radius: 30px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            background-color: var(--bg-secondary);
        }

        main {
            max-width: 1300px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 2rem;
            border-left: 5px solid var(--accent-color);
            padding-left: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Forces two items per row beautifully on mobile */
            gap: 1.5rem;
        }

        @media (min-width: 600px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(45, 55, 72, 0.7);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%; /* Creates a standard movie poster shape */
            background: linear-gradient(135deg, #2c3e50, #34495e);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poster-placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            width: 90%;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            border-left: 3px solid var(--accent-color);
            color: var(--text-main);
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 2px;
            z-index: 5;
        }

        .ep-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: var(--accent-color);
            color: var(--text-main);
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            z-index: 5;
        }

        .anime-info {
            padding: 1rem;
            background: #151d27;
            text-align: center;
        }

        .anime-title {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-primary);
            width: 100%;
            max-width: 850px;
            border-radius: 14px;
            border: 1px solid rgba(229, 9, 20, 0.5);
            position: relative;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .close-modal {
            position: absolute;
            top: -50px;
            right: 0;
            color: var(--text-main);
            font-size: 2.5rem;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Anime<span>Only</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search anime titles..." oninput="filterAnime()">
        </div>
    </header>

    <main>
        <h2 class="section-title">Trending Anime</h2>
        <div class="anime-grid" id="animeGrid">
            
            <!-- Card 1 -->
            <div class="anime-card" data-title="chainsaw man">
                <div class="poster-wrapper" onclick="openPlayer('https://youtube.com')">
                    <div class="poster-placeholder-text">Chainsaw Man</div>
                    <span class="status-badge">SUB</span>
                    <span class="ep-badge">Ep 12</span>
                </div>
                <div class="anime-info">
                    <div class="anime-title">Chainsaw Man</div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="anime-card" data-title="attack on titan">
                <div class="poster-wrapper" onclick="openPlayer('https://youtube.com')">
                    <div class="poster-placeholder-text">Attack On Titan</div>
                    <span class="status-badge">SUB</span>
                    <span class="ep-badge">Ep 87</span>
                </div>
                <div class="anime-info">
                    <div class="anime-title">Attack on Titan</div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="anime-card" data-title="demon slayer">
                <div class="poster-wrapper" onclick="openPlayer('https://youtube.com')">
                    <div class="poster-placeholder-text">Demon Slayer</div>
                    <span class="status-badge">DUB</span>
                    <span class="ep-badge">Ep 26</span>
                </div>
                <div class="anime-info">
                    <div class="anime-title">Demon Slayer</div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePlayer()">&times;</button>
            <div class="video-container">
                <iframe id="videoPlayer" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');

        function openPlayer(streamUrl) {
            player.src = streamUrl;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            modal.classList.remove('active');
            player.src = '';
            document.body.style.overflow = 'auto';
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closePlayer();
            }
        });

        function filterAnime() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.anime-card');
            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
