<script>
    // Live Error Monitor Panel
    window.onerror = function(msg, url, line) {
        const panel = document.getElementById('debug-panel');
        const txt = document.getElementById('debug-text');
        if(panel && txt) {
            panel.style.display = 'block';
            txt.innerText = msg + " on line " + line;
        }
        return false;
    };

    // FALLBACK DATABASE: Used automatically if Jikan API hits a speed limit rate block
    const fallbackDatabase = {
        "https://jikan.moe": [
            { title: "Kaiju No. 8", title_japanese: "怪獣8号", images: { jpg: { image_url: "https://placehold.co" } }, type: "TV", score: "8.4", trailer: { youtube_id: "dQw4w9WgXcQ" } },
            { title: "Demon Slayer: Hashira Training", title_japanese: "鬼滅の刃", images: { jpg: { image_url: "https://placehold.co" } }, type: "TV", score: "8.7", trailer: { youtube_id: "dQw4w9WgXcQ" } },
            { title: "Chainsaw Man", title_japanese: "チェンソーマン", images: { jpg: { image_url: "https://placehold.co" } }, type: "TV", score: "8.5", trailer: { youtube_id: "dQw4w9WgXcQ" } }
        ],
        "https://jikan.moe": [
            { title: "One Piece", title_japanese: "ワンピース", images: { jpg: { image_url: "https://placehold.co" } }, type: "TV", score: "8.9", trailer: { youtube_id: "dQw4w9WgXcQ" } },
            { title: "Jujutsu Kaisen", title_japanese: "呪術廻戦", images: { jpg: { image_url: "https://placehold.co" } }, type: "TV", score: "8.8", trailer: { youtube_id: "dQw4w9WgXcQ" } }
        ],
        "https://jikan.moe?type=movie": [
            { title: "Your Name.", title_japanese: "君の名は。", images: { jpg: { image_url: "https://placehold.co" } }, type: "Movie", score: "8.9", trailer: { youtube_id: "dQw4w9WgXcQ" } }
        ]
    };

    let activeUrl = "https://jikan.moe";

    // Reusable function to render array objects safely into HTML structural elements
    const renderCardUI = (animeItems) => {
        const container = document.getElementById('anime-render-list');
        container.innerHTML = "";

        animeItems.forEach((anime, index) => {
            const card = document.createElement('div');
            card.className = 'anime-row-card';
            
            const title = anime.title;
            const altTitle = anime.title_japanese || "";
            const imageUrl = anime.images?.jpg?.image_url || "https://placehold.co";
            const type = anime.type || "TV";
            const trailerId = anime.trailer?.youtube_id;

            card.innerHTML = `
                <div class="image-banner-wrapper">
                    <span class="rank-badge">#${index + 1}</span>
                    <img src="${imageUrl}" alt="${title}" loading="lazy">
                </div>
                <div class="card-details">
                    <div class="primary-title">${title}</div>
                    <div class="secondary-title">${altTitle}</div>
                    <div class="status-released">${type} • Score: ${anime.score || "N/A"}</div>
                </div>
            `;

            card.addEventListener('click', () => {
                const player = document.getElementById('player-section');
                const playerTitle = document.getElementById('now-playing-title');
                const target = document.getElementById('video-frame-target');
                
                if (player && playerTitle && target) {
                    if (trailerId) {
                        player.style.display = 'block';
                        playerTitle.innerText = `Now Watching Trailer: ${title}`;
                        target.innerHTML = `<iframe src="https://youtube.com{trailerId}" allowfullscreen></iframe>`;
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        alert(`No video available for ${title}.`);
                    }
                }
            });

            container.appendChild(card);
        });
    };

    // Core async interface to call Jikan
    const fetchAnimeFromJikan = async (url) => {
        const container = document.getElementById('anime-render-list');
        if (!container) return;
        
        container.innerHTML = '<div style="padding:40px; text-align:center; color:#aaa;">Loading live entries from Jikan API...</div>';

        try {
            // Set an explicit 2.5 second network timeout limit
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2500);

            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) throw new Error(`HTTP Error Status ${response.status}`);

            const jsonResult = await response.json();
            const animeItems = jsonResult.data || [];

            if (animeItems.length === 0) {
                throw new Error("Empty dataset returned");
            }

            renderCardUI(animeItems);

        } catch (error) {
            console.warn("Jikan API timed out or rate-limited. Activating internal fallback engine:", error.message);
            
            // Instantly extract backup lists if internet fetch breaks
            const fallbackData = fallbackDatabase[url] || [];
            if (fallbackData.length > 0) {
                renderCardUI(fallbackData);
                // Append small notice indicator at the very bottom
                const notice = document.createElement('div');
                notice.style = "padding:15px; text-align:center; font-size:11px; color:#555;";
                notice.innerText = "Showing offline backup view (Jikan API rate limit reached)";
                container.appendChild(notice);
            } else {
                container.innerHTML = `<div style="padding:40px; text-align:center; color:#ff4d4d;">Failed to load Jikan stream: ${error.message}</div>`;
            }
        }
    };

    // Tab Event Handling Connection
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
            tabs.forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            
            activeUrl = e.target.getAttribute('data-endpoint');
            document.getElementById('hub-title-label').innerText = e.target.innerText + " Catalog";
            document.getElementById('search-box').value = "";
            
            fetchAnimeFromJikan(activeUrl);
        });
    });

    // Real-time keyword filter handler
    let searchTimeout;
    const searchBox = document.getElementById('search-box');
    if (searchBox) {
        searchBox.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            searchTimeout = setTimeout(() => {
                if (query.length >= 3) {
                    const searchUrl = `https://jikan.moe{encodeURIComponent(query)}&limit=15`;
                    fetchAnimeFromJikan(searchUrl);
                } else if (query.length === 0) {
                    fetchAnimeFromJikan(activeUrl);
                }
            }, 600);
        });
    }

    // Launch setup immediately on page boot up
    fetchAnimeFromJikan(activeUrl);
</script>
