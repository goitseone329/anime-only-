    <!-- Combined Application Controller Logic -->
    <script>
        // Force reset old storage corruptions if any exist
        try { localStorage.clear(); } catch(e){}

        // 1. Data Store Engine: Setup structural arrays safely
        const animeCatalog = [
            {
                id: "naruto-shippuden",
                title: "Naruto Shippuden",
                type: "ongoing",
                tag: "SUB",
                tagClass: "tag-sub",
                episodes: [
                    { title: "Episode 1", url: "https://w3schools.com" },
                    { title: "Episode 2", url: "https://w3schools.com" }
                ]
            },
            {
                id: "demon-slayer",
                title: "Demon Slayer",
                type: "ongoing",
                tag: "DUB",
                tagClass: "tag-dub",
                episodes: [
                    { title: "Episode 1", url: "https://w3schools.com" }
                ]
            },
            {
                id: "your-name",
                title: "Your Name",
                type: "movies",
                tag: "SUB",
                tagClass: "tag-sub",
                episodes: [
                    { title: "Full Movie", url: "https://w3schools.com" }
                ]
            }
        ];

        let watchlist = [];
        let currentAnime = null;

        // 2. Element Selectors
        const latestGrid = document.getElementById('latestGrid');
        const popularGrid = document.getElementById('popularGrid');
        const shelfRowA = document.getElementById('shelfRowA');
        const shelfRowB = document.getElementById('shelfRowB');
        const adSlotA = document.getElementById('adSlotA');
        const adSlotB = document.getElementById('adSlotB');
        const theaterView = document.getElementById('theaterView');
        const searchBar = document.getElementById('searchBar');
        
        const videoPlayer = document.getElementById('videoCorePlayer');
        const mediaTitle = document.getElementById('mediaTitle');
        const nodeEpisodeGrid = document.getElementById('nodeEpisodeGrid');
        const btnBack = document.getElementById('btnBack');
        const btnSaveFavorite = document.getElementById('btnSaveFavorite');
        
        const billingModal = document.getElementById('billingModal');
        const proBtn = document.getElementById('proBtn');
        const btnCancelPaywall = document.getElementById('btnCancelPaywall');
        const btnConfirmPurchase = document.getElementById('btnConfirmPurchase');
        const logoHome = document.getElementById('logoHome');

        // 3. Grid Renderer
        function renderGrid(items, targetGrid) {
            if (!targetGrid) return;
            targetGrid.innerHTML = '';
            if (items.length === 0) {
                targetGrid.innerHTML = '<p style="color: var(--muted); padding: 10px;">No entries found.</p>';
                return;
            }
            
            items.forEach(anime => {
                try {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `
                        <div class="card-cover">📺
                            <span class="stream-tag ${anime.tagClass || 'tag-sub'}">${anime.tag || 'SUB'}</span>
                        </div>
                        <div class="card-info">
                            <h3>${anime.title || 'Untitled'}</h3>
                            <p>${anime.episodes ? anime.episodes.length : 0} Episodes</p>
                        </div>
                    `;
                    card.addEventListener('click', () => openTheater(anime));
                    targetGrid.appendChild(card);
                } catch(err) {
                    console.error("Error creating anime card item:", err);
                }
            });
        }

        // 4. Catalog Router Engine
        function initCatalog(filter = 'all', searchQuery = '') {
            try {
                let filtered = [...animeCatalog];

                if (filter !== 'all') {
                    if (filter === 'watchlist') {
                        filtered = animeCatalog.filter(item => watchlist.includes(item.id));
                    } else {
                        filtered = animeCatalog.filter(item => item.type === filter);
                    }
                }

                if (searchQuery.trim() !== '') {
                    filtered = filtered.filter(item => item.title.toLowerCase().includes(searchQuery.toLowerCase()));
                }

                renderGrid(filtered, latestGrid);
                renderGrid([...filtered].reverse(), popularGrid);
            } catch(err) {
                console.error("Catalog engine structural breakdown:", err);
            }
        }

        // 5. Video Portal System Actions
        function openTheater(anime) {
            try {
                currentAnime = anime;
                
                if(shelfRowA) shelfRowA.classList.add('hidden');
                if(shelfRowB) shelfRowB.classList.add('hidden');
                if(adSlotA) adSlotA.classList.add('hidden');
                if(adSlotB) adSlotB.classList.add('hidden');
                if(theaterView) theaterView.classList.remove('hidden');
                
                if(mediaTitle) mediaTitle.textContent = anime.title;
                updateFavoriteButtonState(anime.id);
                
                if(nodeEpisodeGrid && anime.episodes) {
                    nodeEpisodeGrid.innerHTML = '';
                    anime.episodes.forEach((ep, index) => {
                        const btn = document.createElement('button');
                        btn.className = `ep-node ${index === 0 ? 'active' : ''}`;
                        btn.textContent = ep.title;
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.ep-node').forEach(n => n.classList.remove('active'));
                            btn.classList.add('active');
                            playVideo(ep.url);
                        });
                        nodeEpisodeGrid.appendChild(btn);
                    });
                }

                if (anime.episodes && anime.episodes.length > 0) {
                    playVideo(anime.episodes[0].url);
                }
            } catch(err) {
                console.error("Failed to safely expand display player window:", err);
            }
        }

        function playVideo(url) {
            if (!videoPlayer || !url) return;
            try {
                videoPlayer.src = url;
                videoPlayer.load();
                videoPlayer.play().catch(err => console.log("Autoplay context waiting user tap action."));
            } catch(e) {}
        }

        function closeTheater() {
            if (videoPlayer) {
                try { videoPlayer.pause(); videoPlayer.src = ''; } catch(e){}
            }
            if(theaterView) theaterView.classList.add('hidden');
            
            if(shelfRowA) shelfRowA.classList.remove('hidden');
            if(shelfRowB) shelfRowB.classList.remove('hidden');
            if(adSlotA) adSlotA.classList.remove('hidden');
            if(adSlotB) adSlotB.classList.remove('hidden');
        }

        // 6. Watchlist Data Persistence 
        function updateFavoriteButtonState(id) {
            if (!btnSaveFavorite) return;
            if (watchlist.includes(id)) {
                btnSaveFavorite.textContent = '💔 Remove from List';
                btnSaveFavorite.style.background = '#e63946';
            } else {
                btnSaveFavorite.textContent = '❤ Add to List';
                btnSaveFavorite.style.background = 'var(--panel)';
            }
        }

        if(btnSaveFavorite) {
            btnSaveFavorite.addEventListener('click', () => {
                if (!currentAnime) return;
                const index = watchlist.indexOf(currentAnime.id);
                if (index > -1) {
                    watchlist.splice(index, 1);
                } else {
                    watchlist.push(currentAnime.id);
                }
                try { localStorage.setItem('animeWatchlist', JSON.stringify(watchlist)); } catch(e){}
                updateFavoriteButtonState(currentAnime.id);
            });
        }

        // 7. Click Interceptors
        document.querySelectorAll('.nav-ribbon .ribbon-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                if (!button.hasAttribute('data-filter')) return;
                
                document.querySelectorAll('.nav-ribbon .ribbon-btn').forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                
                closeTheater();
                initCatalog(button.getAttribute('data-filter'), searchBar ? searchBar.value : '');
            });
        });

        if(searchBar) {
            searchBar.addEventListener('input', (e) => {
                const activeRibbon = document.querySelector('.nav-ribbon .ribbon-btn.active');
                const activeFilter = activeRibbon ? activeRibbon.getAttribute('data-filter') : 'all';
                initCatalog(activeFilter, e.target.value);
            });
        }

        if(btnBack) btnBack.addEventListener('click', closeTheater);
        if(logoHome) {
            logoHome.addEventListener('click', () => {
                closeTheater();
                if(searchBar) searchBar.value = '';
                const allBtn = document.querySelector('[data-filter="all"]');
                if(allBtn) allBtn.click();
            });
        }

        if(proBtn) proBtn.addEventListener('click', () => billingModal && billingModal.classList.remove('hidden'));
