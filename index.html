<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="Styles/style.css">
    <style>
        /* Base Page Setup mirroring Anime Heaven layout */
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Top Navigation Bar */
        .navbar {
            background-color: #111;
            border-bottom: 2px solid #b00;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
        }
        .nav-logo {
            background-color: #b00;
            color: white;
            font-weight: bold;
            padding: 5px 10px;
            font-size: 20px;
            text-transform: uppercase;
        }
        .search-container {
            flex-grow: 1;
            margin: 0 15px;
            position: relative;
        }
        .search-container input {
            width: 100%;
            background-color: #222;
            border: 1px solid #b00;
            color: white;
            padding: 8px 35px 8px 10px;
            border-radius: 3px;
            box-sizing: border-box;
        }

        /* Top Banner Ad Box Placement Area */
        .top-banner-space {
            max-width: 100%;
            margin: 10px auto;
            text-align: center;
        }
        .top-banner-space img {
            max-width: 100%;
            height: auto;
        }

        /* Schedule Title Header */
        .section-title {
            background-color: #181818;
            text-align: left;
            padding: 12px 15px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #b00;
            margin: 20px 0 0 0;
            color: #fff;
            text-transform: uppercase;
        }

        /* Anime List Card Layout Feed */
        .anime-feed {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .anime-card {
            background-color: #111;
            border-bottom: 4px solid #0c0c0c;
            text-align: center;
            position: relative;
        }

        /* Responsive 16:9 Aspect Ratio Video Box Wrapper */
        .poster-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Forces clean 16:9 widescreen ratio box */
            background-color: #000;
            overflow: hidden;
        }
        
        /* Direct Video Embed Iframe Setup */
        .poster-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 1;
        }

        /* Red Left-Corner Counter Badge */
        .episode-badge {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #d00;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 8px 15px;
            z-index: 2;
        }

        /* Plus Action Overlay Button */
        .action-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background-color: rgba(221, 0, 0, 0.85);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border: none;
            cursor: pointer;
        }

        /* Text Sub-Containers */
        .anime-details {
            padding: 15px 10px;
        }
        .anime-title {
            font-size: 19px;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #eee;
        }
        .anime-status {
            color: #d00;
            font-size: 15px;
            font-weight: 500;
            margin: 0;
        }

        /* Bottom Fixed Navigation Bar for Mobile */
        .mobile-footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #111;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 10;
        }
        .footer-nav-item {
            color: #888;
            text-decoration: none;
            font-size: 20px;
            text-align: center;
        }
        .footer-nav-item.active {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar">
        <div class="nav-logo">AI</div>
        <div class="search-container">
            <input type="text" placeholder="Search anime...">
        </div>
        <div style="color: #b00; font-size: 24px; padding-right: 5px; cursor: pointer;">☰</div>
    </nav>

    <!-- Top Promo Banner Area -->
    <div class="top-banner-space">
        <img src="https://placeholder.com" alt="Promo Banner">
    </div>

    <!-- 1. ANIME TV SERIES SECTION -->
    <h2 class="section-title">Subbed Anime Episodes</h2>
    
    <main class="anime-feed">
        <!-- Show 1: Attack on Titan -->
        <article class="anime-card">
            <div class="poster-container">
                <div class="episode-badge">E75</div>
                <button class="action-btn">+</button>
                <iframe 
                    src="https://youtube.com" 
                    title="Attack on Titan Stream" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="anime-details">
                <h3 class="anime-title">Attack on Titan: The Final Season</h3>
                <p class="anime-status">Episode Released</p>
            </div>
        </article>

        <!-- Show 2: Naruto Shippuden -->
        <article class="anime-card">
            <div class="poster-container">
                <div class="episode-badge">E500</div>
                <button class="action-btn">+</button>
                <iframe 
                    src="https://youtube.com" 
                    title="Naruto Shippuden Stream" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="anime-details">
                <h3 class="anime-title">Naruto: Shippuden</h3>
                <p class="anime-status">Episode Released</p>
            </div>
        </article>
    </main>

    <!-- 2. ANIME MOVIES SECTION -->
    <h2 class="section-title">Anime Movies</h2>

    <main class="anime-feed" style="margin-bottom: 70px;">
        <!-- Movie 1: Demon Slayer -->
        <article class="anime-card">
            <div class="poster-container">
                <div class="episode-badge">HD</div>
                <button class="action-btn">+</button>
                <iframe 
                    src="https://youtube.com" 
                    title="Demon Slayer Movie Stream" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="anime-details">
                <h3 class="anime-title">Demon Slayer: Mugen Train</h3>
                <p class="anime-status">Full Movie Available</p>
            </div>
        </article>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <div class="mobile-footer-nav">
        <a href="#" class="footer-nav-item active">⌂</a>
        <a href="#" class="footer-nav-item">🧭</a>
        <a href="#" class="footer-nav-item">🔖</a>
        <a href="#" class="footer-nav-item">🔍</a>
    </div>

    <!-- Background Monetization Ad Scripts -->
    <script data-cfasync="false">
      var s = document.createElement('script');
      s.src = 'https://bauval.org';
      document.body.appendChild(s);

      var n = document.createElement('script');
      n.src = 'https://abscloud.org';
      document.body.appendChild(n);
    </script>

</body>
</html>
