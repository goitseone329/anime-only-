<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        body { 
            background-color: #000; 
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* HEADER BAR SETTINGS */
        header { 
            background-color: #0d0d0d; 
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 2px solid #ff0000;
        }
        .logo-box { 
            background-color: #ff0000; 
            padding: 8px;
            border-radius: 5px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-box svg { 
            width: 28px; 
            height: 28px;
            fill: #fff;
        }
        .search-wrapper { 
            flex: 1; 
            display: flex;
            position: relative;
        }
        .search-input { 
            width: 100%; 
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 40px 10px 15px;
            border-radius: 4px;
            font-size: 14px;
        }
        .search-input:focus {
            outline: none;
            border-color: #ff0000;
        }
        .search-icon-btn { 
            position: absolute; 
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
        }
        .search-icon-btn svg {
            fill: #ff0000;
        }

        /* TAB NAVIGATION */
        .collection-tabs { 
            display: flex; 
            background: #0d0d0d;
            border-bottom: 1px solid #222;
        }
        .tab-btn { 
            flex: 1; 
            padding: 15px;
            background: none;
            border: none;
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active { 
            color: #fff; 
            border-bottom: 3px solid #ff0000;
        }

        /* VIEW LAYER MANAGEMENT */
        .view-layer { 
            display: none; 
            padding: 15px;
            padding-bottom: 80px;
        }
        .view-layer.active-view { 
            display: block; 
        }

        /* GRID CATALOG LAYOUT DESIGN */
        .section-heading {
            border-left: 4px solid #ff0000;
            padding-left: 10px;
            margin-bottom: 15px;
            font-size: 18px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .catalog-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(110px, 115px));
            gap: 12px;
            justify-content: center;
        }
        .anime-grid-card { 
            background: #111; 
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #222;
        }
        .anime-grid-card:hover {
            transform: scale(1.03);
        }
        .image-thumb-wrapper { 
            position: relative; 
            width: 100%;
            height: 160px;
            background: #222;
        }
        .image-thumb-wrapper img { 
            width: 100%; 
            height: 100%;
            object-fit: cover;
        }
        .rank-badge-pill { 
            position: absolute; 
            top: 5px;
            left: 5px;
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
        }
        .card-meta-details { 
            padding: 8px; 
        }
        .card-main-title { 
            font-size: 12px; 
            font-weight: bold;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 32px;
            line-height: 16px;
            color: #fff;
            margin-bottom: 4px;
        }
        .card-sub-title { 
            font-size: 11px; 
            color: #ff0000;
            display: block;
        }

        /* STREAM LAYER UI */
        .stream-meta-header { 
            text-align: left; 
            margin-bottom: 15px;
        }
        .stream-meta-header h2 { 
            font-size: 20px; 
            color: #fff;
        }
        .video-player-container { 
            width: 100%; 
            margin-bottom: 15px;
        }
        .responsive-iframe-wrap { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            background: #111;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .responsive-iframe-wrap iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0;
        }

        /* CONTROLS HUB */
        .controls-button-row { 
            display: flex; 
            gap: 10px;
            margin-bottom: 15px;
        }
        .ctrl-btn { 
            flex: 1;
            background-color: #1a1a1a; 
            color: #fff;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .ctrl-btn:hover {
            background-color: #222;
        }
        .download-action-bar { 
            max-width: 100%; 
            margin-bottom: 20px;
        }
        .download-btn { 
            width: 100%; 
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        /* SUMMARY CARD INFO COMPONENT */
        .anime-profile-summary { 
            background: #111; 
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #222;
        }
        .profile-stat-line { 
            color: #aaa; 
            font-size: 13px;
            margin-bottom: 6px;
        }
        .profile-stat-line strong { 
            color: #fff; 
        }
        .info-pill-container { 
            display: flex; 
            gap: 8px;
            margin-top: 10px;
        }
        .pill-badge { 
            background: #ff0000; 
            color: white;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* GRID INTERACTIVE BLOCK TILES */
        .grid-header-lbl { 
            text-align: left; 
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-left: 3px solid #ff0000;
            padding-left: 8px;
        }
        .episodes-selection-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
        }
        .episode-selection-tile { 
            background-color: #1a1a1a; 
            border: 1px solid #333;
            color: #fff;
            padding: 12px 5px;
            text-align: center;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .episode-selection-tile:hover, .episode-selection-tile.active {
            background-color: #ff0000;
            border-color: #ff0000;
        }

        /* FOOTER NAV COMPONENT BAR */
        .bottom-nav { 
            position: fixed; 
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #0d0d0d;
            display: flex;
            border-top: 1px solid #222;
            z-index: 999;
        }
        .nav-item { 
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #555; 
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-item.active { 
            color: #ff0000; 
        }
        .nav-item svg { 
            width: 24px; 
            height: 24px;
            fill: currentColor;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- HEADER BLOCK -->
    <header>
        <div class="logo-box" id="logo-home">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
        </div>
        <div class="search-wrapper">
            <input type="text" id="search-input" class="search-input" placeholder="Search Anime...">
            <button id="search-btn" class="search-icon-btn">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="collection-tabs">
