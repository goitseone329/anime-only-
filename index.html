<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Stream Free Anime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 70px; }
        
        /* HEADER BAR SETTINGS */
        header { background-color: #050505; border-bottom: 2px solid #ff1a1a; display: flex; align-items: center; padding: 8px 12px; height: 56px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(255, 26, 26, 0.2); }
        .logo-box { background-color: #d61c1c; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 4px; text-decoration: none; margin-right: 12px; cursor: pointer; box-shadow: 0 0 8px #ff1a1a; }
        .logo-box svg { width: 28px; height: 28px; fill: #fff; }
        .search-wrapper { flex: 1; position: relative; max-width: 600px; display: flex; align-items: center; }
        .search-input { width: 100%; height: 36px; background-color: #111; border: 1px solid #d61c1c; border-radius: 4px; color: #fff; padding: 0 40px 0 12px; font-size: 15px; }
        .search-icon-btn { position: absolute; right: 10px; background: none; border: none; color: #d61c1c; cursor: pointer; display: flex; align-items: center; }
        
        /* MONETIZATION PLACEMENT BOXES */
        .ad-banner-placement { width: 100%; max-width: 728px; margin: 10px auto; padding: 5px; display: flex; justify-content: center; align-items: center; min-height: 90px; background: #050505; border: 1px dashed #222; overflow: hidden; }

        /* TAB NAVIGATION */
        .collection-tabs { display: flex; background-color: #050505; border-bottom: 1px solid #111; margin-top: 2px; }
        .tab-btn { flex: 1; padding: 14px 5px; background: none; border: none; color: #aaa; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #fff; border-bottom-color: #ff1a1a; background-color: #111; }
        
        .section-heading { background-color: #000; padding: 16px 12px; font-size: 20px; font-weight: bold; text-align: center; color: #fff; letter-spacing: 0.5px; }
        
        /* VIEW LAYER MANAGEMENT */
        .view-layer { display: none; max-width: 800px; margin: 0 auto; padding: 0 8px; }
        .view-layer.active-view { display: block; }

        /* GRID CATALOG LAYOUT DESIGN */
        .catalog-container { display: flex; flex-direction: column; gap: 16px; padding: 4px; }
        .anime-grid-card { background-color: #0b0b0b; border: 1px solid #151515; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .image-thumb-wrapper { position: relative; width: 100%; height: 240px; background: #111; }
        .image-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .rank-badge-pill { position: absolute; top: 0; left: 0; background-color: #d61c1c; color: #fff; font-weight: bold; font-size: 16px; padding: 6px 16px; border-bottom-right-radius: 6px; z-index: 10; }
        .action-plus-btn { position: absolute; top: 8px; right: 8px; background-color: #ff1a1a; color: #fff; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 10; border: none; font-weight: bold; }
        .card-meta-details { padding: 12px 8px; text-align: center; }
        .card-main-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .card-sub-title { font-size: 13px; color: #777; margin-bottom: 6px; }
        .status-badge-lbl { color: #ff1a1a; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

        /* STREAM LAYER UI */
        .stream-meta-header { text-align: center; padding: 15px 5px; }
        .stream-meta-header h2 { font-size: 22px; color: #ff1a1a; font-weight: bold; margin-bottom: 12px; }
        
        .video-player-container { width: 100%; background: #000; border: 1px solid #1c1c1c; border-radius: 4px; position: relative; overflow: hidden; margin-bottom: 15px; }
        .responsive-iframe-wrap { position: relative; padding-bottom: 56.25%; height: 0; }
        .responsive-iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* CONTROLS HUB MULTI-BAR */
        .controls-button-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .ctrl-btn { background-color: #d61c1c; color: #fff; border: none; border-radius: 4px; padding: 10px 16px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .ctrl-btn-action { width: 44px; height: 44px; border-radius: 50%; padding: 0; font-size: 18px; }
        .download-action-bar { max-width: 400px; margin: 0 auto 20px auto; }
        .download-btn { width: 100%; background-color: #d61c1c; color: #fff; border: none; padding: 12px; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; text-align: center; }
        
        .social-link-strip { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #111; }
        .social-icon-box { background-color: #111; padding: 10px; border-radius: 6px; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; cursor: pointer; border: 1px solid #222; }
        .social-icon-box svg { width: 24px; height: 24px; fill: #fff; }
        
        /* INFO BANNER BLOCK MODULES */
        .anime-profile-summary { background: #080808; border: 1px solid #111; padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 20px; font-size: 15px; }
        .profile-stat-line { color: #888; margin-bottom: 6px; }
        .profile-stat-line strong { color: #ff1a1a; }
        .info-pill-container { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
        .pill-badge { background: #111; border: 1px solid #ff1a1a; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; color: white; }
        
        .grid-header-lbl { text-align: center; font-size: 16px; font-weight: bold; color: #888; margin: 20px 0 12px 0; text-transform: uppercase; }
        
        /* EPISODE SELECTION BLOCK */
        .episodes-selection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background-color: #ff1a1a; border: 1px solid #ff1a1a; margin-bottom: 25px; }
        .episode-selection-tile { background-color: #000; padding: 14px 6px; text-align: center; cursor: pointer; }
        .episode-selection-tile .ep-num { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 2px; }
        .episode-selection-tile .ep-time { font-size: 11px; color: #555; }
        
        /* FOOTER NAV COMPONENT BAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 52px; background-color: #050505; border-top: 1px solid #111; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #555; display: flex; align-items: center; justify-content: center; width: 25%; height: 100%; cursor: pointer; }
        .nav-item.active { color: #ff1a1a; filter: drop-shadow(0 0 4px #ff1a1a); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
        .loading-spinner { padding: 50px 20px; text-align: center; color: #888; }
    </style>
    
    <!-- ADSTERRA SOCIAL BAR AD UNIT SCRIPT CODE -->
    <script data-cfasync="false" src="https://abscloud.org"></script>
</head>

        <div class="logo-box" id="logo-nav-home" title="Home">

    <!-- TOP ADSTERRA BANNER UNIT -->
    <div class="ad-banner-placement">
        <script data-cfasync="false" src="https://bauval.org"></script>
    </div>

    <!-- CATALOG VIEW LAYER -->
    <div id="catalog-view-layer" class="view-layer active-view">
        <div class="collection-tabs">
            <button class="tab-btn active" id="tab-schedule">Schedule</button>
            <button class="tab-btn" id="tab-trending">Trending</button>
            <button class="tab-btn" id="tab-movies">Movies</button>
            <button class="tab-btn" id="tab-watchlist">Watchlist</button>
        </div>

        <div class="catalog-container" id="anime-grid-target"></div>
    </div>

    <!-- STREAM VIEW LAYER -->
    <div id="stream-view-layer" class="view-layer">
        <div class="stream-meta-header">
            <h2 id="stream-anime-title">Anime Title</h2>
