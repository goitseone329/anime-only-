<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeOnly - Streaming Hub</title>
    
    <!-- PopAds Website Verification Code Tag -->
    <meta name="popads-verification-3669498" value="9886709c8157f6d032d62cb9b9426bf5">

    <!-- Linked directly to your Styles folder sheet -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <header>
        <div class="logo-section">
            <!-- Ghost Rider Flame Skull Pure Code Block Component -->
            <div class="skull-logo">
                <div class="fire-glow"></div>
                <div class="skull-eyes"></div>
                <div class="skull-eyes right"></div>
            </div> 
            <a href="#" class="logo" onclick="showHome()">AnimeOnly</a>
        </div>
        <div class="search-container">
            <input type="text" id="animeSearch" class="search-box" placeholder="Search anime titles..." onkeyup="searchAnime()">
        </div>
        <nav class="nav-links">
            <a onclick="showHome()">Home</a>
            <a href="#">Trending</a>
        </nav>
    </header>

    <div class="container">
        <div class="ad-space" id="monetization-zone">
            ADVERTISEMENT SPACE (MONETIZATION ZONE)
        </div>

        <!-- HOME PAGE SCREEN PANEL -->
        <div id="home-view">
            <h2 class="section-heading" id="section-title">Trending Releases</h2>
            <div class="anime-grid" id="anime-grid-container">
                <p style="padding: 20px; color: #a6a6a6;">Loading catalog database...</p>
            </div>
        </div>

        <!-- DETAILED ANIME WATCH VIEW SCREEN -->
        <div id="details-view" class="hidden">
            <button class="back-btn" onclick="showHome()">← Back to Catalog</button>
            
            <div class="details-header">
                <div class="details-title" id="det-title">Anime Title</div>
                
                <div class="tag-container" id="det-genres">
                    <!-- Dynamic genre badges loaded here -->
                </div>

                <div class="meta-info">Episodes: <span id="det-episodes">5+</span></div>
                <div class="meta-info">Year: <span id="det-year">2026</span></div>
                <div class="meta-info">Score: <span id="det-score">?</span></div>

                <div class="action-container">
                    <button class="btn-action">Bookmark +</button>
                    <button class="btn-action">Rate +</button>
                </div>
            </div>

            <!-- Dynamic Countdown Display Block -->
            <div class="countdown-box">
                <h3 id="countdown-label">Countdown to Next Episode</h3>
                <div class="timer-display" id="timer-clock">6 Days 21 Hours 51 Min</div>
            </div>

            <h3 class="section-heading">Available Episodes</h3>
            <div class="episode-grid" id="episode-container">
                <!-- Clickable episode items list generated here -->
            </div>

            <h3 class="section-heading">Similar Shows</h3>
            <div class="anime-grid" id="similar-container">
                <!-- Similar recommendation cards generated here -->
            </div>
        </div>
    </div>

    <script>
        let countdownInterval;

        // Initialize Home Dashboard view
        async function loadTrendingAnime() {
            const grid = document.getElementById('anime-grid-container');
            try {
                const response = await fetch('https://jikan.moe');
                const data = await response.json();
                renderCards(data.data, grid);
            } catch (error) {
                grid.innerHTML = '<p style="padding: 20px; color: #ff0022;">Failed to load live catalog listings.</p>';
            }
        }

        // Live Search Filter Integration Panel
        async function searchAnime() {
            const query = document.getElementById('animeSearch').value.trim();
            const grid = document.getElementById('anime-grid-container');
            if (query.length < 3) { if (query.length === 0) loadTrendingAnime(); return; }
            try {
                const response = await fetch(`https://jikan.moe{encodeURIComponent(query)}&limit=12`);
                const data = await response.json();
                renderCards(data.data, grid);
            } catch (error) { console.error(error); }
        }

        // Render generic home cards list block
        function renderCards(list, container) {
            container.innerHTML = '';
            if(!list || list.length === 0) return;
            list.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => openAnimeDetails(anime.mal_id);
                card.innerHTML = `
                    <div class="poster-placeholder" style="background: url('${anime.images.jpg.image_url}') no-repeat center/cover;"></div>
                    <div class="anime-details">
                        <h3 style="font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${anime.title}</h3>
                        <p style="font-size:0.8rem; color:#777;">★ ${anime.score || 'N/A'}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Deep-dive watch view screen layout activation
        async function openAnimeDetails(id) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('details-view').classList.remove('hidden');
            window.scrollTo(0,0);

            try {
                const res = await fetch(`https://jikan.moe{id}`);
                const data = await res.json();
                const anime = data.data;

                document.getElementById('det-title').innerText = anime.title;
                document.getElementById('det-episodes').innerText = anime.episodes ? `${anime.episodes}+` : 'Ongoing';
                document.getElementById('det-year').innerText = anime.year || '2026';
                document.getElementById('det-score').innerText = anime.score || '?';

                const genresBox = document.getElementById('det-genres');
                genresBox.innerHTML = '';
                const displayGenres = anime.genres.slice(0, 2);
                if(displayGenres.length === 0) displayGenres.push({name: 'Fantasy'}, {name: 'Comedy'});
                displayGenres.forEach(g => {
                    genresBox.innerHTML += `<span class="tag">${g.name}</span>`;
                });

                const epContainer = document.getElementById('episode-container');
                epContainer.innerHTML = '';
                const totalEps = anime.episodes || 5;
                for(let i = totalEps; i >= 1; i--) {
                    const isWide = (i === 2 || i === 1) ? 'episode-card-wide' : '';
                    epContainer.innerHTML += `
                        <div class="episode-card ${isWide}">
                            <strong>${i}</strong>
                            <div>${i === totalEps ? '2 h ago' : '5 d ago'}</div>
                        </div>
                    `;
                }

                setupCountdown(anime.title, totalEps + 1);

                const simRes = await fetch(`https://jikan.moe{id}/recommendations`);
                const simData = await simRes.json();
                const simContainer = document.getElementById('similar-container');
                simContainer.innerHTML = '';
                
                const recList = simData.data.slice(0, 3).map(r => r.entry);
                if(recList.length > 0) {
                    renderCards(recList, simContainer);
                } else {
                    simContainer.innerHTML = '<p style="color:#777; font-size:0.9rem;">No similar entries cataloged yet.</p>';
                }

            } catch (error) { console.error(error); }
        }

        function setupCountdown(title, nextEp) {
            clearInterval(countdownInterval);
            document.getElementById('countdown-label').innerText = `Countdown to Episode ${nextEp}`;
            
            let days = 6, hours = 21, minutes = 51;
            const clock = document.getElementById('timer-clock');
            
            countdownInterval = setInterval(() => {
                minutes--;
                if(minutes < 0) { minutes = 59; hours--; }
                if(hours < 0) { hours = 23; days--; }
                if(days < 0) { clearInterval(countdownInterval); clock.innerText = "Streaming Live Now!"; return; }
                clock.innerText = `${days} Days ${hours} Hours ${minutes} Min`;
            }, 60000);
            clock.innerText = `${days} Days ${hours} Hours ${minutes} Min`;
        }

        function showHome() {
            clearInterval(countdownInterval);
            document.getElementById('details-view').classList.add('hidden');
            document.getElementById('home-view').style.display = 'block';
        }

        window.onload = loadTrendingAnime;
    </script>
</body>
</html>
