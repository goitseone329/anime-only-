<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Heaven</title>
  <meta name="referrer" content="no-referrer">
  <style>
    /* --- GLOBAL BASE THEME --- */
    body {
      background-color: #060606;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0e0e0e;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 2px solid #ff0000;
    }

    .logo-box {
      background-color: #ff0000;
      color: #ffffff;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 3px;
      margin-right: 15px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .search-bar {
      background-color: #161616;
      border: 1px solid #222222;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 4px;
      width: 100%;
      max-width: 400px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-bar:focus {
      border-color: #ff0000;
    }

    /* --- STABLE CONTROLS DISPLAY COMPONENT --- */
    .player-container {
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-wrapper {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background-color: #0e0e0e;
      border: 2px solid #1a1a1a;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
    }

    /* --- CENTRALIZED PLAYER ACTIONS WINDOW --- */
    .player-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ccc;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 5;
      background-color: rgba(14, 14, 14, 0.95);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .player-details {
      width: 90%;
      max-width: 800px;
      padding: 15px 0 0 0;
      text-align: left;
      box-sizing: border-box;
    }

    .player-details h2 {
      font-size: 1.2rem;
      color: #ff0000;
      margin: 0 0 4px 0;
    }

    .player-details p {
      font-size: 0.85rem;
      color: #888;
      margin: 0 0 15px 0;
    }

    /* --- DYNAMIC EPISODE SELECTOR LAYOUT --- */
    .episode-control-panel {
      display: none;
      background-color: #0e0e0e;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      padding: 15px;
      margin-top: 5px;
    }

    .episode-panel-title {
      font-size: 0.9rem;
      color: #fff;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .episode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .episode-grid::-webkit-scrollbar {
      width: 6px;
    }
    .episode-grid::-webkit-scrollbar-thumb {
      background-color: #222;
      border-radius: 3px;
    }

    .episode-btn {
      background-color: #161616;
      border: 1px solid #222;
      color: #ccc;
      padding: 6px 0;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .episode-btn:hover {
      background-color: #222;
      color: #fff;
      border-color: #444;
    }

    .episode-btn.active {
      background-color: #ff0000;
      color: #fff;
      border-color: #ff0000;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    /* --- MAIN CONTENT LAYOUT --- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .section-title {
      font-size: 1.4rem;
      border-left: 4px solid #ff0000;
      padding-left: 10px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- CARDS GRID SYSTEM --- */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .anime-card {
      background-color: #0e0e0e;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .anime-card:hover {
      transform: translateY(-4px);
      border-color: #ff0000;
    }

    .card-image-wrapper {
      background-size: cover;
      background-position: center;
      height: 240px;
      width: 100%;
      background-color: #1a1a1a;
    }

    .card-details {
      padding: 10px;
    }

    .card-details h3 {
      font-size: 0.95rem;
      margin: 5px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .banner-title {
      display: block;
      color: #ff0000;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .rating {
      font-size: 0.8rem;
      color: #ffcc00;
    }

    .loading-text {
      color: #888;
      grid-column: 1 / -1;
      text-align: center;
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-box" id="logoHomeBtn">ANIME</div>
    <input type="text" class="search-bar" id="searchEngineInput" placeholder="Search anime dynamically...">
  </header>

  <div class="player-container">
    <div class="player-wrapper">
      <div id="placeholder-screen" class="player-placeholder">
        <p>No media stream targeting currently loaded.</p>
        <p style="font-size: 0.8rem; color: #666;">Select a dynamic node card lower on the grid interface architecture to bind connection layout endpoints.</p>
      </div>
      <iframe id="video-embed-frame" style="display: none;" allowfullscreen></iframe>
    </div>
    
    <div class="player-details">
      <h2 id="statusMsg">Playing: Select an Anime</h2>
      <p id="subMsg">Streaming Client: Idle</p>
      
      <div class="episode-control-panel" id="episodeControlPanel">
        <div class="episode-panel-title">Select Episode</div>
        <div class="episode-grid" id="episodeButtonGrid"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="section-title" id="gridTitleDisplay">Trending Anime</div>
    <div id="trending-anime-grid" class="anime-grid">
      <div class="loading-text">Connecting to Jikan API pipeline node structure...</div>
    </div>
  </div>

  <!-- --- DYNAMIC DISPATCH ENGINE WITH ROUTING --- -->
  <script>
    const JIKAN_API_BASE = 'https://jikan.moe';
    const VIDLINK_EMBED_BASE = 'https://vidlink.pro';

    let searchDebounceTimeout = null;
    let activeAnimeId = null;
    let activeAnimeTitle = "";

    // Run initialization logic on startup
    window.addEventListener('DOMContentLoaded', initApp);

    // Wire up home button and search navigation fields
    document.getElementById('logoHomeBtn').addEventListener('click', () => {
      document.getElementById('searchEngineInput').value = "";
      document.getElementById('gridTitleDisplay').innerText = "Trending Anime";
      loadTrendingAnime();
    });

    document.getElementById('searchEngineInput').addEventListener('input', (e) => {
      clearTimeout(searchDebounceTimeout);
      const query = e.target.value.trim();
      
      searchDebounceTimeout = setTimeout(() => {
        if (query.length > 2) {
          executeAnimeSearch(query);
        } else if (query.length === 0) {
          document.getElementById('gridTitleDisplay').innerText = "Trending Anime";
          loadTrendingAnime();
        }
      }, 500); 
    });

    /**
     * Initializes the app safely without routing errors
     */
    async function initApp() {
      // Safely loads trending titles first to prevent initialization crashes
      loadTrendingAnime();
    }

    /**
     * Dispatches runtime request targets to populate UI card matrices
     */
    async function loadTrendingAnime() {
      const grid = document.getElementById('trending-anime-grid');
      grid.innerHTML = '<div class="loading-text">Loading top anime dataset...</div>';
      
      try {
        const response = await fetch(`${JIKAN_API_BASE}/top/anime?filter=bypopularity&limit=20`);
        const result = await response.json();
        if (result && result.data) {
          renderAnimeCards(result.data);
        }
      } catch (e) {
        grid.innerHTML = '<div class="loading-text" style="color: #ff0000;">Failed loading trending stream pipelines.</div>';
        console.error(e);
      }
    }

    /**
     * Executes queries against the search endpoint
     */
    async function executeAnimeSearch(query) {
      const grid = document.getElementById('trending-anime-grid');
      document.getElementById('gridTitleDisplay').innerText = `Search Results: "${query}"`;
      grid.innerHTML = '<div class="loading-text">Searching database nodes...</div>';

      try {
        const response = await fetch(`${JIKAN_API_BASE}/anime?q=${encodeURIComponent(query)}&limit=24`);
        const result = await response.json();
        if (result && result.data) {
          renderAnimeCards(result.data);
        }
      } catch (e) {
        grid.innerHTML = '<div class="loading-text" style="color: #ff0000;">Search query routing execution error.</div>';
        console.error(e);
      }
    }

    /**
     * Master render function to output standard structures into layout frameworks
     */
    function renderAnimeCards(animeList) {
      const grid = document.getElementById('trending-anime-grid');
      grid.innerHTML = "";

      if (animeList.length === 0) {
