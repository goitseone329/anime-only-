<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeOnly - Streaming Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #0d0202; /* Ultra dark red-tinted black */
            color: #e5e5e5;
        }
        /* Top Navigation Header */
        header {
            background-color: #1a0505;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff0022; /* Vibrant red accent */
        }
        .logo {
            color: #ff0022;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 34, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* Placeholder for a Ghost Rider / Skull themed logo graphic later */
        .logo-icon {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ff5500, #ff0022);
            border-radius: 50%;
            display: inline-block;
        }
        .nav-links a {
            color: #b3b3b3;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
        }
        .nav-links a:hover {
            color: #ff0022;
        }
        /* Main Container */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }
        /* Monetization / Ad Placement Banner Holder */
        .ad-space {
            background-color: #1a0909;
            border: 1px dashed #ff0022;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 6px;
            color: #802020;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        /* Content Catalog Grid */
        h2 {
            color: #fff;
            margin-bottom: 20px;
            border-left: 4px solid #ff0022;
            padding-left: 10px;
        }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .anime-card {
            background-color: #1a0505;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #2d0c0c;
        }
        .anime-card:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(255, 0, 34, 0.3);
            border-color: #ff0022;
        }
        .poster-placeholder {
            width: 100%;
            height: 230px;
            background-color: #2d0c0c;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff0022;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .anime-details {
            padding: 12px;
        }
        .anime-details h3 {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-details p {
            font-size: 0.8rem;
            color: #a6a6a6;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="logo-icon"></span> AnimeOnly
        </div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Trending</a>
            <a href="#">Movies</a>
        </nav>
    </header>

    <div class="container">
        <!-- Placeholder for pop-ads / display integration -->
        <div class="ad-space">
            ADVERTISEMENT SPACE (MONETIZATION ZONE)
        </div>

        <h2>Trending Releases</h2>
        <div class="anime-grid">
            <div class="anime-card">
                <div class="poster-placeholder">Naruto</div>
                <div class="anime-details">
                    <h3>Naruto Shippuden</h3>
                    <p>Episodes: 500</p>
                </div>
            </div>
            <div class="anime-card">
                <div class="poster-placeholder">Demon Slayer</div>
                <div class="anime-details">
                    <h3>Demon Slayer</h3>
                    <p>Episodes: 26</p>
                </div>
            </div>
            <div class="anime-card">
                <div class="poster-placeholder">Attack On Titan</div>
                <div class="anime-details">
                    <h3>Attack On Titan</h3>
                    <p>Episodes: 87</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
