<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <style>
        :root {
            --bg-primary: #0b0c10;
            --bg-secondary: #121212;
            --card-bg: #1f2833;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-secondary: #8a9aa7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding-bottom: 4rem;
            min-height: 100vh;
        }

        /* Header & Logo Navbar Layout */
        header {
            background-color: var(--bg-secondary);
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .logo span:first-child {
            color: var(--accent-color);
        }

        .logo span:last-child {
            color: var(--text-main);
        }

        /* Search input controls */
        .search-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .search-bar {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid #2a2a2a;
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: var(--accent-color);
            background-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.3);
        }

        /* Trending Section Heading styling */
        main {
            padding: 1.5rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            font-weight: 700;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 1.4rem;
            background-color: var(--accent-color);
            margin-right: 10px;
            border-radius: 2px;
        }

        /* Anime Grid System layout */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        /* Fixed Anime Card Structure via Absolute Overlays */
        .anime-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .anime-card:hover {
            transform: translateY(-5px);
        }

        /* Image containment area */
        .img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 145%; /* High quality 2:3 Anime poster layout scaling */
            background-color: #1a232e;
        }

        .anime-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Floated Badge Component styles */
        .badge-sub-dub {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: rgba(11, 12, 16, 0.85);
            border-left: 3px solid var(--accent-color);
            color: #ffffff;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 0 3px 3px 0;
            z-index: 2;
        }

        .badge-ep {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 2px 6px;
            font-size: 0.72rem;
            font-weight: 700;
            border-radius: 4px;
            z-index: 2;
        }

        /* Bottom Text Details Zone */
        .anime-details {
            background-color: var(--bg-secondary);
            padding: 10px 8px;
            text-align: left;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .anime-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Status States */
        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>Anime</span><span>Only</span></div>
        <div class="search-container">
            <input type="text" id="anime-search" class="search-bar" placeholder="Search anime titles...">
        </div>
    </header>

    <main>
        <section id="trending-section">
            <h1 class="section-title" id="display-title">Trending Anime</h1>
            <div id="anime-grid" class="anime-grid">
                <p class="status-msg">Loading dynamic titles from catalog...</p>
            </div>
        </section>
    </main>

    <script>
        const gridContainer = document.getElementById('anime-grid');
        const searchInput = document.getElementById('anime-search');
        const displayTitle = document.getElementById('display-title');
        
        let timeoutId = null;

        // Base fetch client abstraction for the Jikan API integration
        async function fetchAnimeData(endpoint, headingText) {
            try {
                gridContainer.innerHTML = '<p class="status-msg">Loading assets safely...</p>';
                displayTitle.textContent = headingText;

                const response = await fetch(`https://jikan.moe{endpoint}`);
                if (!response.ok) throw new Error('API communication failed');
                
                const result = await response.json();
                renderCards(result.data);
            } catch (error) {
                console.error('Data pipeline error:', error);
                gridContainer.innerHTML = '<p class="status-msg">Failed to connect to catalog. Try again shortly.</p>';
            }
        }

        // Render card structure using correct layout paths
        function renderCards(animeList) {
            if (!animeList || animeList.length === 0) {
                gridContainer.innerHTML = '<p class="status-msg">No titles matched your search query.</p>';
                return;
            }

            gridContainer.innerHTML = '';

            animeList.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';

                // Safely verify if localized or alternative titles are usable
                const localizedTitle = anime.title_english || anime.title;
                const imageSource = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
                const baseEpisodes = anime.episodes || '??';
                
                // Set default type strings safely matching fallback logic
                const audioType = anime.type === 'Movie' ? 'Movie' : 'Sub';

                card.innerHTML = `
                    <div class="badge-sub-dub">${audioType}</div>
                    <div class="badge-ep">Ep ${baseEpisodes}</div>
                    <div class="img-wrapper">
                        <img src="${imageSource}" alt="${localizedTitle}" class="anime-img" loading="lazy">
                    </div>
                    <div class="anime-details">
                        <p class="anime-title" title="${localizedTitle}">${localizedTitle}</p>
                    </div>
                `;

                gridContainer.appendChild(card);
            });
        }

        // Functional live search handler utilizing standard debouncing 
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(timeoutId);

            timeoutId = setTimeout(() => {
                if (query.length > 2) {
                    fetchAnimeData(`anime?q=${encodeURIComponent(query)}&limit=18`, `Results for: "${query}"`);
                } else if (query.length === 0) {
                    fetchAnimeData('top/anime?filter=airing&limit=18', 'Trending Anime');
                }
            }, 600); // 600ms boundary protects against API rate limiting drops
        });

        // Initialize with default global airing trends when content mounts
        document.addEventListener('DOMContentLoaded', () => {
            fetchAnimeData('top/anime?filter=airing&limit=18', 'Trending Anime');
        });
    </script>

</body>
</html>
