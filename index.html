<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven</title>
    <style>
        /* --- GLOBAL BASE THEME --- */
        body {
            background-color: #060606;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0e0e0e;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 2px solid #ff0000;
        }

        .logo-box {
            background-color: #ff0000;
            color: #ffffff;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
            margin-right: 15px;
            font-size: 1.1rem;
        }

        .search-bar {
            background-color: #161616;
            border: 1px solid #222222;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
        }

        /* --- VIDEO PLAYER COMPONENT (YOUR CSS) --- */
        .player-container {
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-wrapper {
            width: 90%;
            max-width: 800px;
            position: relative;
            padding-top: 56.25%; /* Fixed 16:9 Aspect Ratio */
            background-color: #0c0c0c;
            border: 2px solid #222222;
            border-radius: 6px;
            overflow: hidden;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- PLAYER PLACEHOLDER GRAPHICS (YOUR CSS) --- */
        .player-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #111111, #000000);
            color: #666;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #222222;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .player-details {
            width: 90%;
            max-width: 800px;
            padding: 10px 0 0 0;
            text-align: left;
            box-sizing: border-box;
        }

        .player-details h2 {
            font-size: 1.1rem;
            color: #ff0000;
            margin: 0 0 4px 0;
        }

        .player-details p {
            font-size: 0.85rem;
            color: #888;
            margin: 0;
        }

        /* --- MAIN CONTENT LAYOUT (YOUR CSS) --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 4px solid #ff0000;
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- CARDS GRID SYSTEM (YOUR CSS) --- */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background-color: #0e0e0e;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .anime-card:hover {
            transform: translateY(-4px);
            border-color: #ff0000;
        }

        .card-image-wrapper {
            background-size: cover;
            background-position: center;
            height: 240px;
            width: 100%;
            background-color: #1a1a1a;
        }

        .card-details {
            padding: 10px;
        }

        .banner-title {
            display: block;
            color: #ff0000;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .card-details h3 {
            font-size: 0.9rem;
            margin: 0 0 6px 0;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating {
            font-size: 0.8rem;
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo-box">AH</div>
        <input type="text" class="search-bar" placeholder="Search Anime...">
    </header>

    <!-- Video Player Container Block -->
    <div class="player-container">
        <div class="player-wrapper">
            <!-- Loading Indicator Placeholder UI -->
            <div class="player-placeholder" id="video-loader">
                <div class="spinner"></div>
                <div style="font-weight: bold; color: #fff; margin-bottom: 5px;">Ready to Stream</div>
                <div>Tap a card below to load the streaming container</div>
            </div>
            <!-- Streaming Embed Frame -->
            <iframe id="video-stream-frame" src="" allowfullscreen></iframe>
        </div>
        
        <div class="player-details">
            <h2 id="now-playing-title">Playing: Welcome to Anime Heaven</h2>
            <p id="client-status-text">Streaming Client: Ready</p>
        </div>
    </div>

    <!-- Cards Catalog Grid Section -->
    <div class="container">
        <div class="section-title">Trending Anime</div>
        <div class="anime-grid" id="anime-display-grid">
            <!-- Dynamic Jikan Core cards load directly here -->
            <div style="color: #666; grid-column: 1/-1; text-align: center; padding: 40px 0;">Loading Engine Components...</div>
        </div>
    </div>

    <!-- --- CORE ENGINE JAVASCRIPT --- -->
    <script>
        // Endpoint Configurations
        const JIKAN_TOP_ENDPOINT = 'https://jikan.moe';
        const VIDSRC_EMBED_BASE = 'https://vidsrc.to';
        const BROWSER_CACHE_KEY = 'ah_trending_cache';
        const CACHE_EXPIRY_LIMIT = 15 * 60 * 1000; // 15-Minute Safety Threshold

        /**
         * Fetches top-tier anime from Jikan and safely maps images to layout elements
         */
        async function runAnimeEngine() {
            const grid = document.getElementById('anime-display-grid');
            if (!grid) return;

            try {
                // Rate limit defensive handling (Vercel safe setup)
                const cacheData = localStorage.getItem(BROWSER_CACHE_KEY);
                const cacheStamp = localStorage.getItem(`${BROWSER_CACHE_KEY}_stamp`);
                const timestampNow = Date.now();

                let collection = [];

                if (cacheData && cacheStamp && (timestampNow - cacheStamp < CACHE_EXPIRY_LIMIT)) {
                    collection = JSON.parse(cacheData);
                } else {
                    const networkResponse = await fetch(JIKAN_TOP_ENDPOINT);
                    if (!networkResponse.ok) throw new Error(`Server Response Status: ${networkResponse.status}`);
                    
                    const packingData = await networkResponse.json();
                    collection = packingData.data || [];

                    // Commit to storage cache layer
                    localStorage.setItem(BROWSER_CACHE_KEY, JSON.stringify(collection));
                    localStorage.setItem(`${BROWSER_CACHE_KEY}_stamp`, timestampNow.toString());
                }

                // Render dynamic item cards
                grid.innerHTML = ''; 

                collection.slice(0, 12).forEach(item => {
                    // RESOLVED PATH: Accessing deep nested properties safely
                    const mediaCover = item.images?.jpg?.large_image_url || 
                                       item.images?.jpg?.image_url || 
                                       'https://placehold.co';

                    const primaryTitle = item.title_english || item.title;
                    const displayTitle = primaryTitle.replace(/"/g, '&quot;').replace(/'/g, "\\'");

                    const elementCode = `
                        <div class="anime-card" style="cursor: pointer;" onclick="initializeStream('${item.mal_id}', '${displayTitle}')">
                            <div class="card-image-wrapper" style="background-image: url('${mediaCover}');"></div>
                            <div class="card-details">
                                <span class="banner-title">${item.type || 'ANIME'}</span>
                                <h3>${primaryTitle}</h3>
                                <span class="rating">★ ${item.score || 'N/A'}</span>
                            </div>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', elementCode);
                });

            } catch (err) {
                console.error("Engine failure exception caught:", err);
