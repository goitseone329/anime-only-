<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding-bottom: 3rem;
        }

        header {
            background-color: #000000;
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid #e50914;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .logo span {
            color: #ffffff;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1.5rem;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 25px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 2rem 0 1.5rem 0;
            border-left: 5px solid #e50914;
            padding-left: 12px;
            text-transform: uppercase;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            background-color: #1f2833;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #2d3748;
            position: relative;
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background-color: #121212;
            cursor: pointer;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background-color: rgba(0, 0, 0, 0.8);
            border-left: 3px solid #e50914;
            color: #ffffff;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .ep-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background-color: #e50914;
            color: #ffffff;
            padding: 0.1rem 0.5rem;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Target Action Favorite + Button styling */
        .fav-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #e50914;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .fav-btn.active {
            background-color: #e50914;
            color: #ffffff;
        }

        .anime-info {
            padding: 0.8rem;
        }

        .anime-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Streaming Overlay Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background-color: #0b0c10;
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            border: 2px solid #e50914;
            position: relative;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .close-modal {
            position: absolute;
            top: -45px;
            right: 0;
            color: white;
            font-size: 2.2rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Anime<span>Only</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search anime titles..." oninput="filterAnime()">
        </div>
    </header>

    <main>
        <!-- Favorites Playlist Container Tracker Block -->
        <h2 class="section-title" id="favsTitle" style="display: none;">My Watchlist</h2>
        <div class="anime-grid" id="favoritesGrid"></div>

        <h2 class="section-title">Trending Anime</h2>
        <div class="anime-grid" id="animeGrid">
            
            <!-- Card 1: Chainsaw Man -->
            <div class="anime-card" data-title="chainsaw man">
                <button class="fav-btn" onclick="toggleFavorite('Chainsaw Man', 'https://unsplash.com', 'SUB', 'Ep 12', 'https://youtube.com', this)"><i class="fa-solid fa-plus"></i></button>
                <div class="poster-wrapper" onclick="openPlayer('https://youtube.com')">
                    <img src="https://unsplash.com" alt="Chainsaw Man">
                    <span class="status-badge">SUB</span>
                    <span class="ep-badge">Ep 12</span>
                </div>
                <div class="anime-info">
                    <div class="anime-title">Chainsaw Man</div>
                </div>
            </div>

            <!-- Card 2: Attack on Titan -->
            <div class="anime-card" data-title="attack on titan">
                <button class="fav-btn" onclick="toggleFavorite('Attack on Titan', 'https://unsplash.com', 'SUB', 'Ep 87', 'https://youtube.com', this)"><i class="fa-solid fa-plus"></i></button>
                <div class="poster-wrapper" onclick="openPlayer('https://youtube.com')">
                    <img src="https://unsplash.com" alt="Attack on Titan">
                    <span class="status-badge">SUB</span>
                    <span class="ep-badge">Ep 87</span>
                </div>
                <div class="anime-info">
                    <div class="anime-title">Attack on Titan</div>
                </div>
            </div>

            <!-- Card 3: Demon Slayer -->
            <div class="anime-card" data-title="demon slayer">
                <button class="fav-btn" onclick="toggleFavorite('Demon Slayer', 'https://unsplash.com', 'DUB', 'Ep 26', 'https://youtube.com', this)"><i class="fa-solid fa-plus"></i></button>
                <div class="poster-wrapper" onclick="openPlayer('https://youtube.com')">
                    <img src="https://unsplash.com" alt="Demon Slayer">
                    <span class="status-badge">DUB</span>
                    <span class="ep-badge">Ep 26</span>
                </div>
                <div class="anime-info">
                    <div class="anime-title">Demon Slayer</div>
                </div>
            </div>

        </div>
    </main>

    <!-- Video Streaming Modal Container -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePlayer()">&times;</button>
            <div class="video-container">
                <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');

        function openPlayer(streamUrl) {
            player.src = streamUrl;
            modal.style.display = 'flex';
        }

        function closePlayer() {
            modal.style.display = 'none';
            player.src = '';
        }

        // Live Search Filter Function
        function filterAnime() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('#animeGrid .anime-card');
            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                if (title.includes(query)) {
