<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only - Test Baseline</title>
    <style>
        :root {
            --bg: #0b0b0f;
            --panel: #17171f;
            --red: #ef233c;
            --text: #f7f7fb;
            --muted: #aaaab8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding: 16px;
        }
        header {
            background: #111116;
            border-bottom: 1px solid #292933;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            color: var(--red);
            font-size: 23px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .logo span { color: white; }
        .catalog {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .anime-card {
            background: var(--panel);
            border: 1px solid #242430;
            border-radius: 12px;
            overflow: hidden;
            padding: 12px;
            text-align: center;
        }
        .poster-placeholder {
            height: 150px;
            background: #1c1c24;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-weight: bold;
        }
        h3 { font-size: 14px; margin: 4px 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Anime <span>Only (Testing Baseline)</span></div>
    </header>

    <main>
        <h2 style="font-size: 20px; margin-bottom: 16px;"># Verification Catalog</h2>
        <div class="catalog" id="testGrid">
            <!-- JavaScript will insert items here if deployment updates correctly -->
        </div>
    </main>

    <script>
        "use strict";
        
        console.log("TEST ENGINE: Running baseline rendering script...");

        // Simple local mock data array to isolate layout generation from live API fetching
        const baselineData = [
            { id: 1, title: "Baseline Test Card A" },
            { id: 2, title: "Baseline Test Card B" }
        ];

        const testGrid = document.getElementById('testGrid');

        if (testGrid) {
            baselineData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="poster-placeholder">IMAGE</div>
                    <h3>${item.title}</h3>
                `;
                testGrid.appendChild(card);
            });
            console.log("TEST ENGINE: Baseline render successful.");
        } else {
            console.error("TEST ENGINE: Could not find target DOM grid container.");
        }
    </script>
</body>
</html>
