<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven</title>
    <style>
        /* --- GLOBAL BASE THEME --- */
        body {
            background-color: #060606;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0e0e0e;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 2px solid #ff0000;
        }

        .logo-box {
            background-color: #ff0000;
            color: #ffffff;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
            margin-right: 15px;
            font-size: 1.1rem;
        }

        .search-bar {
            background-color: #161616;
            border: 1px solid #222222;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            max-width: 400px;
        }

        /* --- VIDEO PLAYER COMPONENT --- */
        .player-container {
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-wrapper {
            width: 90%;
            max-width: 800px;
            position: relative;
            padding-top: 56.25%; /* Fixed 16:9 Aspect Ratio */
            background-color: #0c0c0c;
            border: 2px solid #222222;
            border-radius: 6px;
            overflow: hidden;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- PLAYER PLACEHOLDER GRAPHICS --- */
        .player-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #111111, #000000);
            color: #666;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #222222;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .player-details {
            width: 90%;
            max-width: 800px;
            padding: 10px 0 0 0;
            text-align: left;
            box-sizing: border-box;
        }

        .player-details h2 {
            font-size: 1.1rem;
            color: #ff0000;
            margin: 0 0 4px 0;
        }

        .player-details p {
            font-size: 0.85rem;
            color: #888;
            margin: 0;
        }

        /* --- MAIN CONTENT LAYOUT --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 4px solid #ff0000;
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- CARDS GRID SYSTEM --- */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background-color: #0e0e0e;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .anime-card:hover {
            transform: translateY(-4px);
            border-color: #ff0000;
        }

        .card-image-wrapper {
            background-size: cover;
            background-position: center;
            height: 240px;
            width: 100%;
            background-color: #1a1a1a;
        }

        .card-details {
            padding: 10px;
        }

        .banner-title {
            display: block;
            color: #ff0000;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .card-details h3 {
            font-size: 0.9rem;
            margin: 0 0 6px 0;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating {
            font-size: 0.8rem;
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo-box">AH</div>
        <input type="text" class="search-bar" placeholder="Search Anime...">
    </header>

    <!-- Video Player Container Block -->
    <div class="player-container">
        <div class="player-wrapper">
            <!-- Loading Indicator Placeholder UI -->
            <div class="player-placeholder" id="video-loader">
                <div class="spinner"></div>
                <div style="font-weight: bold; color: #fff; margin-bottom: 5px;">Ready to Stream</div>
                <div>Tap a card below to load the streaming container</div>
            </div>
            <!-- Streaming Embed Frame -->
            <iframe id="video-stream-frame" src="" allowfullscreen></iframe>
        </div>
        
        <div class="player-details">
            <h2 id="now-playing-title">Playing: Welcome to Anime Heaven</h2>
            <p id="client-status-text">Streaming Client: Ready</p>
        </div>
    </div>

    <!-- Cards Catalog Grid Section -->
    <div class="container">
        <div class="section-title">Trending Anime</div>
        <div class="anime-grid" id="anime-display-grid">
            <div style="color: #666; grid-column: 1/-1; text-align: center; padding: 40px 0;">Loading Engine Components...</div>
        </div>
    </div>

    <!-- --- CORE ENGINE JAVASCRIPT --- -->
    <script>
        const JIKAN_TOP_ENDPOINT = 'https://jikan.moe';
        const VIDSRC_EMBED_BASE = 'https://vidsrc.to';

        // HARDCODED FALLBACK DATA: This ensures cards display instantly even if Jikan rate-limits you
        const fallbackAnimeData = [
            {
                mal_id: "21",
                title: "One Piece",
                score: 8.72,
                type: "TV",
                image: "https://myanimelist.net"
            },
            {
                mal_id: "1735",
                title: "Naruto Shippuden",
                score: 8.21,
                type: "TV",
                image: "https://myanimelist.net"
            },
            {
                mal_id: "5114",
                title: "Fullmetal Alchemist: Brotherhood",
                score: 9.10,
                type: "TV",
                image: "https://myanimelist.net"
            },
            {
                mal_id: "38000",
                title: "Demon Slayer: Kimetsu no Yaiba",
                score: 8.47,
                type: "TV",
                image: "https://myanimelist.net"
            }
        ];

        /**
         * Renders the cards into the grid container layout
         */
        function renderCards(animeArray, isFallback = false) {
            const grid = document.getElementById('anime-display-grid');
            if (!grid) return;
            
            grid.innerHTML = ''; 

            animeArray.forEach(item => {
                let mediaCover = '';
                let primaryTitle = '';
                
                if (isFallback) {
                    mediaCover = item.image;
                    primaryTitle = item.title;
                } else {
                    mediaCover = item.images?.jpg?.large_image_url || item.images?.jpg?.image_url;
                    primaryTitle = item.title_english || item.title;
                }

                const displayTitle = primaryTitle.replace(/"/g, '&quot;').replace(/'/g, "\\'");

                const elementCode = `
                    <div class="anime-card" style="cursor: pointer;" onclick="initializeStream('${item.mal_id}', '${displayTitle}')">
                        <div class="card-image-wrapper" style="background-image: url('${mediaCover}');"></div>
                        <div class="card-details">
                            <span class="banner-title">${item.type || 'ANIME'}</span>
                            <h3>${primaryTitle}</h3>
                            <span class="rating">★ ${item.score || 'N/A'}</span>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', elementCode);
            });
        }

        /**
         * Core network handler with automatic hardcoded fallback execution
         */
        async function runAnimeEngine() {
            try {
                const networkResponse = await fetch(JIKAN_TOP_ENDPOINT);
                
                if (!networkResponse.ok) {
                    throw new Error(`API Error: ${networkResponse.status}`);
                }
                
                const packingData = await networkResponse.json();
                
                if (packingData.data && packingData.data.length > 0) {
