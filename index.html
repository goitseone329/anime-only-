<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Only - Premium Blue Edition</title>
    <style>
        :root {
            --bg: #0b0b0c;
            --panel: #141416;
            --panel-light: #1c1c21;
            --blue: #2563eb;       /* Primary Electric Blue */
            --blue-light: #3b82f6; /* Hover / Focus Highlight */
            --gold: #ffb703;
            --text: #ffffff;
            --muted: #7a7a85;
            --sub-badge: #00b4d8;
            --dub-badge: #9b5de5;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-top: 70px; /* Offset for sticky header */
        }

        /* --- STICKY NAV HEADER --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #000000;
            border-bottom: 2px solid var(--blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .brand {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .brand span {
            background: var(--blue);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 2px;
        }

        .search-container {
            flex: 1;
            max-width: 450px;
            margin: 0 16px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 16px;
            background: var(--panel-light);
            border: 1px solid #292933;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--blue-light);
        }

        .pro-trigger {
            background: linear-gradient(45deg, var(--gold), #ff8500);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* --- AD ZONE STYLING --- */
        .ad-zone {
            background: #101014;
            border: 1px dashed #3a3a4f;
            color: var(--muted);
            text-align: center;
            padding: 15px;
            margin: 16px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .ad-zone::before {
            content: "ADVERTISEMENT";
            display: block;
            color: var(--blue-light);
            font-size: 9px;
            margin-bottom: 4px;
        }

        /* --- QUICK NAVIGATION BAR --- */
        .nav-ribbon {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .nav-ribbon::-webkit-scrollbar {
            display: none;
        }

        .ribbon-btn {
            background: var(--panel);
            color: var(--muted);
            border: 1px solid #23232a;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .ribbon-btn.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        /* --- MEDIA SHELF & HIGH-DENSITY GRID --- */
        main {
            padding: 0 16px 40px;
        }

        .shelf-container {
            margin-bottom: 30px;
        }

        .shelf-title {
            font-size: 18px;
            font-weight: 800;
            border-left: 4px solid var(--blue);
            padding-left: 10px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        @media (min-width: 768px) {
            .catalog-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        .anime-card {
            background: var(--panel);
            border: 1px solid #1f1f26;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .anime-card:hover {
            transform: translateY(-2px);
            border-color: var(--blue-light);
        }

        .card-cover {
            height: 160px;
            background: #252533;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            position: relative;
        }

        .stream-tag {
            position: absolute;
            bottom: 6px;
            left: 6px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
            color: #fff;
        }

        .tag-sub { background: var(--sub-badge); }
        .tag-dub { background: var(--dub-badge); }

        .card-info {
            padding: 10px;
        }

        .card-info h3 {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 11px;
            color: var(--muted);
        }

        /* --- THEATER STREAMING VIEWPORT --- */
        .hidden {
            display: none !important;
        }

        #theaterDeck {
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid #23232a;
            padding: 16px;
        }

        .back-link {
            display: inline-block;
            color: var(--blue-light);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 14px;
            text-decoration: none;
        }

        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .control-ribbon {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-light);
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            border: 1px solid #292933;
        }

        .w2g-anchor {
            color: var(--blue-light);
            font-weight: bold;
            font-size: 13px;
            text-decoration: none;
        }

        .w2g-anchor:hover {
            text-decoration: underline;
        }

        .episode-deck {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .ep-node {
            background: var(--panel-light);
            color: #fff;
            border: 1px solid #292933;
            padding: 10px 16px;
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }

        .ep-node.active {
            background: var(--blue);
            border-color: var(--blue);
        }

        /* --- BILLING CHECKOUT MODAL OVERLAY --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: var(--panel);
            border: 1px solid #292933;
            border-radius: 12px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        .modal-card h2 {
            color: var(--gold);
            font-size: 20px;
            margin-bottom: 12px;
        }

        .checkout-btn {
            background: var(--blue);
            color: #fff;
            font-weight: bold;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            margin-top: 16px;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: var(--blue-light);
        }

        .cancel-btn {
            background: transparent;
            color: var(--muted);
            border: none;
            margin-top: 12px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Sticky Navigation Top Header Bar -->
    <header>
        <div class="brand" id="logoHome">Anime<span>Only</span></div>
        <div class="search-container">
            <input type="search" class="search-bar" id="searchBar" placeholder="Search across database entries...">
        </div>
        <button class="pro-trigger" id="proBtn">👑 Go Pro</button>
    </header>

    <!-- Ad Anchor A -->
    <div class="ad-zone" id="adSlotA">Stream secure with ExpressVPN - Special offer inside.</div>

    <!-- Scrollable Horizontal View Switcher Ribbon Bar -->
    <div class="nav-ribbon">
